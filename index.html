<!DOCTYPE html>
<html lang="zh-TW" data-theme="cream">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>旅遊手帳 | Trip Mochi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Inter"', 'sans-serif'],
          },
          colors: {
            cream: 'var(--bg-cream)',
            creamDark: 'var(--bg-cream-dark)',
            sage: 'var(--color-primary)',
            sageDark: 'var(--color-primary-dark)',
            sageLight: 'var(--color-primary-light)',
            sageMuted: 'var(--color-primary-muted)',
            terracotta: 'var(--color-accent)',
            terracottaLight: 'var(--color-accent-light)',
            charcoal: 'var(--text-main)',
            warmBorder: 'var(--border-warm)',
          }
        }
      }
    }
  </script>

  <style>
    /* 1. 森林奶油 (預設) */
    :root {
      --bg-outer: #E7E3D6;
      --bg-cream: #F5F3EB;
      --bg-cream-dark: #ECE8DA;
      --bg-card: #FFFFFF;
      --color-primary: #5B7A58;
      --color-primary-dark: #486345;
      --color-primary-light: #E6EFE5;
      --color-primary-muted: #8CA389;
      --color-accent: #D97736;
      --color-accent-light: #FDF1E8;
      --text-main: #2C302E;
      --border-warm: #E5E0D2;
    }
    /* 2. 櫻花晴空 */
    [data-theme="sakura"] {
      --bg-outer: #F3E5E9;
      --bg-cream: #FFF8FA;
      --bg-cream-dark: #FCEEF2;
      --bg-card: #FFFFFF;
      --color-primary: #D96B84;
      --color-primary-dark: #B85068;
      --color-primary-light: #FDECEF;
      --color-primary-muted: #E89DAE;
      --color-accent: #4A89DC;
      --color-accent-light: #EBF3FE;
      --text-main: #33292C;
      --border-warm: #F2DCE2;
    }
    /* 3. 極簡雜誌 */
    [data-theme="minimal"] {
      --bg-outer: #E4E4E7;
      --bg-cream: #FAFAFA;
      --bg-cream-dark: #F4F4F5;
      --bg-card: #FFFFFF;
      --color-primary: #18181B;
      --color-primary-dark: #09090B;
      --color-primary-light: #F4F4F5;
      --color-primary-muted: #71717A;
      --color-accent: #2563EB;
      --color-accent-light: #EFF6FF;
      --text-main: #18181B;
      --border-warm: #E4E4E7;
    }
    /* 4. 深夜航行 (Dark Mode) */
    [data-theme="midnight"] {
      --bg-outer: #020617;
      --bg-cream: #0F172A;
      --bg-cream-dark: #1E293B;
      --bg-card: #1E293B;
      --color-primary: #38BDF8;
      --color-primary-dark: #0284C7;
      --color-primary-light: #0C4A6E;
      --color-primary-muted: #7DD3FC;
      --color-accent: #F59E0B;
      --color-accent-light: #451A03;
      --text-main: #F8FAFC;
      --border-warm: #334155;
    }
    /* 5. 京都楓紅 */
    [data-theme="kyoto"] {
      --bg-outer: #EFE4D8;
      --bg-cream: #FAF5F0;
      --bg-cream-dark: #F2E7DC;
      --bg-card: #FFFFFF;
      --color-primary: #C85A32;
      --color-primary-dark: #A34320;
      --color-primary-light: #FCECE6;
      --color-primary-muted: #DF8D6F;
      --color-accent: #B45309;
      --color-accent-light: #FEF3C7;
      --text-main: #3B2820;
      --border-warm: #EAD9CA;
    }
    /* 6. 沖繩海鹽 */
    [data-theme="okinawa"] {
      --bg-outer: #DCEEF3;
      --bg-cream: #F3FAFC;
      --bg-cream-dark: #E3F3F8;
      --bg-card: #FFFFFF;
      --color-primary: #0E8A9E;
      --color-primary-dark: #096C7C;
      --color-primary-light: #E0F5F8;
      --color-primary-muted: #5EB5C4;
      --color-accent: #F97316;
      --color-accent-light: #FFEDD5;
      --text-main: #1E333B;
      --border-warm: #D0E8EF;
    }
    /* 7. 富良野薰衣草 */
    [data-theme="lavender"] {
      --bg-outer: #EAE4F2;
      --bg-cream: #F9F7FC;
      --bg-cream-dark: #F0ECF7;
      --bg-card: #FFFFFF;
      --color-primary: #7E65B0;
      --color-primary-dark: #634B94;
      --color-primary-light: #F1ECFA;
      --color-primary-muted: #A995D1;
      --color-accent: #D97736;
      --color-accent-light: #FDF1E8;
      --text-main: #2E273B;
      --border-warm: #E4DCF0;
    }
    /* 8. 宇治抹茶 */
    [data-theme="matcha"] {
      --bg-outer: #DFE6DC;
      --bg-cream: #F4F7F2;
      --bg-cream-dark: #E8EFE4;
      --bg-card: #FFFFFF;
      --color-primary: #4A6B44;
      --color-primary-dark: #375232;
      --color-primary-light: #E4EDE1;
      --color-primary-muted: #7C9976;
      --color-accent: #B8860B;
      --color-accent-light: #FEF9E7;
      --text-main: #243022;
      --border-warm: #D8E2D4;
    }

    /* 暗黑模式卡片與底色適配 */
    [data-theme="midnight"] .bg-white {
      background-color: var(--bg-card) !important;
      color: var(--text-main) !important;
    }
    [data-theme="midnight"] .bg-white\/95,
    [data-theme="midnight"] .bg-white\/90,
    [data-theme="midnight"] .bg-white\/85 {
      background-color: rgba(30, 41, 59, 0.92) !important;
      color: var(--text-main) !important;
    }
    [data-theme="midnight"] .bg-sky-50 {
      background-color: rgba(14, 165, 233, 0.15) !important;
      border-color: rgba(56, 189, 248, 0.3) !important;
      color: #7DD3FC !important;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: var(--bg-outer);
      color: var(--text-main);
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 8px); }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: var(--bg-cream);
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.14);
      transition: background-color 0.25s ease;
    }
    @media (max-width: 480px) {
      body { background-color: var(--bg-cream); }
      .app-shell { box-shadow: none; }
    }

    /* === 票券撕角版樣式 === */
    .ticket-card {
      position: relative;
      display: flex;
      background-color: var(--bg-card, #FFFFFF);
      border: 1px solid var(--border-warm);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .ticket-card:active {
      transform: scale(0.99);
    }
    .ticket-stub {
      width: 82px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      background-color: var(--color-primary-light);
      border-right: 1.5px dashed var(--border-warm);
      position: relative;
    }
    /* 上下撕角半圓凹槽 */
    .ticket-stub::before,
    .ticket-stub::after {
      content: '';
      position: absolute;
      right: -7px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background-color: var(--bg-cream);
      border: 1px solid var(--border-warm);
      z-index: 2;
    }
    .ticket-stub::before { top: -7px; }
    .ticket-stub::after { bottom: -7px; }

    /* 航班類別特殊票券強調色 */
    .ticket-card.is-flight .ticket-stub {
      background-color: var(--color-accent-light);
    }
    .ticket-card.is-flight {
      border-color: rgba(217, 119, 54, 0.35);
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <script>
    const STORAGE_KEY = 'trip_mochi_data_v2';

    const CATEGORIES = {
      sightseeing: { label: '景點', icon: 'camera', color: 'text-sage' },
      food: { label: '美食', icon: 'utensils', color: 'text-terracotta' },
      transport: { label: '交通', icon: 'train', color: 'text-sky-600' },
      flight: { label: '航班', icon: 'plane', color: 'text-terracotta' },
      shopping: { label: '購物', icon: 'shopping-bag', color: 'text-pink-600' },
      hotel: { label: '住宿', icon: 'bed-double', color: 'text-indigo-600' }
    };

    const DEFAULT_DATA = {
      currentTripId: 'trip_hiroshima_2027',
      trips: [
        {
          id: 'trip_hiroshima_2027',
          title: '廣島・關西 6天5夜之旅',
          destination: '廣島・宮島・大阪',
          startDate: '2027-03-19',
          endDate: '2027-03-24',
          currency: 'JPY',
          exchangeRate: 0.215,
          days: [
            {
              dayIndex: 1,
              date: '2027-03-19',
              label: 'Day 1',
              subtitle: '抵達廣島・本通商店街',
              items: [
                {
                  id: 'item_1',
                  time: '11:45',
                  category: 'flight',
                  title: '桃園 TPE → 廣島 HIJ',
                  location: '廣島機場',
                  mapQuery: 'Hiroshima Airport',
                  notes: '抵達後搭乘機場利木津巴士前往廣島站新幹線口（約 45 分鐘）'
                },
                {
                  id: 'item_2',
                  time: '14:30',
                  category: 'hotel',
                  title: 'EN HOTEL Hiroshima 寄放行李',
                  location: '廣島市中區銀山町',
                  mapQuery: 'EN HOTEL Hiroshima',
                  notes: '先辦理寄放行李，順便領取周邊地圖'
                },
                {
                  id: 'item_3',
                  time: '17:30',
                  category: 'food',
                  title: '廣島燒村（お好み村）晚餐',
                  location: '廣島新天地',
                  mapQuery: 'Okonomimura Hiroshima',
                  notes: '必點牡蠣廣島燒＋生啤酒！'
                }
              ]
            },
            {
              dayIndex: 2,
              date: '2027-03-20',
              label: 'Day 2',
              subtitle: '嚴島神社・宮島一日遊',
              items: [
                {
                  id: 'item_4',
                  time: '08:30',
                  category: 'transport',
                  title: 'JR 廣島站 → 宮島口 → JR 西日本宮島渡輪',
                  location: '宮島口棧橋',
                  mapQuery: 'Miyajimaguchi Ferry Terminal',
                  notes: '搭右側靠海上鳥居視角拍照最清楚'
                },
                {
                  id: 'item_5',
                  time: '10:00',
                  category: 'sightseeing',
                  title: '嚴島神社 & 海上大鳥居',
                  location: '廿日市市宮島町',
                  mapQuery: 'Itsukushima Shrine',
                  notes: '確認當日滿潮與乾潮時間，可走下沙灘近距離看大鳥居'
                },
                {
                  id: 'item_6',
                  time: '12:30',
                  category: 'food',
                  title: '宮島表參道商店街 邊走邊吃',
                  location: '宮島表參道',
                  mapQuery: 'Omotesando Shopping Street Miyajima',
                  notes: '烤牡蠣、現烤紅葉饅頭、星鰻飯'
                }
              ]
            },
            {
              dayIndex: 3,
              date: '2027-03-21',
              label: 'Day 3',
              subtitle: '尾道千光寺・移動至大阪',
              items: [
                {
                  id: 'item_7',
                  time: '09:30',
                  category: 'sightseeing',
                  title: '尾道千光寺公園 & 貓之細道',
                  location: '尾道市',
                  mapQuery: 'Senkoji Park Onomichi',
                  notes: '搭纜車上山再沿著坡道慢慢散步下來'
                }
              ]
            }
          ],
          expenses: [
            { id: 'exp_1', title: '廣島機場巴士券', amount: 1500, category: '交通', payer: '我' },
            { id: 'exp_2', title: 'お好み村 廣島燒晚餐', amount: 2400, category: '餐飲', payer: '我' },
            { id: 'exp_3', title: '嚴島神社參拜券', amount: 500, category: '門票', payer: '我' }
          ],
          stays: [
            {
              id: 'stay_1',
              name: 'EN HOTEL Hiroshima',
              checkIn: '2027-03-19',
              checkOut: '2027-03-21',
              address: '広島県広島市中区銀山町7-8',
              code: 'RES-884920',
              notes: '含早餐，步行至八丁堀站約 5 分鐘'
            }
          ],
          tasks: [
            { id: 'task_1', text: '填寫 Visit Japan Web 入境海關申報', done: true },
            { id: 'task_2', text: '購買日本 6 日無限流量 eSIM', done: true },
            { id: 'task_3', text: '兌換日幣現鈔（約 50,000 円）', done: false },
            { id: 'task_4', text: '檢查行動電源容量標示', done: false }
          ]
        }
      ]
    };

    function loadAppData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.trips) && parsed.trips.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.error('Failed to load storage:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    let appData = loadAppData();

    function saveAppData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      } catch (e) {
        console.error('Failed to save storage:', e);
      }
    }

    let uiState = {
      activeTab: 'schedule', // 'schedule' | 'weather' | 'food' | 'budget' | 'stay' | 'tasks'
      selectedDayIdx: 0,
      modal: null, // { type: string, payload?: any }
      toast: null,
      theme: localStorage.getItem('trip_mochi_theme') || 'cream',
      weatherCity: 'hiroshima', // 'hiroshima' | 'osaka' | 'gps'
      weatherData: null,
      weatherLoading: false,
      foodArea: '廣島站・本通',
      userCoords: null
    };

    function getCurrentTrip() {
      return appData.trips.find(t => t.id === appData.currentTripId) || appData.trips[0];
    }

    function showToast(msg) {
      uiState.toast = msg;
      render();
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        uiState.toast = null;
        render();
      }, 2400);
    }

    function openModal(type, payload = null) {
      uiState.modal = { type, payload };
      render();
    }

    function closeModal() {
      uiState.modal = null;
      render();
    }

    function switchTab(tabId) {
      uiState.activeTab = tabId;
      render();
      if (tabId === 'weather' && !uiState.weatherData) {
        fetchWeatherForecast(uiState.weatherCity);
      }
    }

    function selectDay(idx) {
      uiState.selectedDayIdx = idx;
      render();
    }

    function changeAppTheme(themeId) {
      uiState.theme = themeId;
      localStorage.setItem('trip_mochi_theme', themeId);
      render();
      showToast('已切換版面風格！');
    }

    function getCountdownText(startDateStr) {
      if (!startDateStr) return '準備出發';
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(startDateStr + 'T00:00:00');
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      if (diff > 0) return `距離出發 ${diff} 天`;
      if (diff === 0) return '就是今天出發！';
      return '旅程進行中';
    }

    /* === 主渲染函式 === */
    function render() {
      document.documentElement.setAttribute('data-theme', uiState.theme || 'cream');
      const trip = getCurrentTrip();
      if (uiState.selectedDayIdx >= trip.days.length) {
        uiState.selectedDayIdx = Math.max(0, trip.days.length - 1);
      }

      let mainContent = '';
      if (uiState.activeTab === 'schedule') {
        mainContent = renderScheduleView(trip);
      } else if (uiState.activeTab === 'weather') {
        mainContent = renderWeatherView();
      } else if (uiState.activeTab === 'food') {
        mainContent = renderFoodView();
      } else if (uiState.activeTab === 'budget') {
        mainContent = renderBudgetView(trip);
      } else if (uiState.activeTab === 'stay') {
        mainContent = renderStayView(trip);
      } else if (uiState.activeTab === 'tasks') {
        mainContent = renderTasksView(trip);
      }

      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <!-- 頂部導覽列 -->
        <header class="sticky top-0 z-30 bg-cream/95 backdrop-blur-md border-b border-warmBorder px-4 pt-3 pb-2.5">
          <div class="flex items-center justify-between gap-2">
            <button onclick="openModal('SWITCH_TRIP')" class="flex items-center gap-2 text-left min-w-0 group">
              <div class="w-9 h-9 rounded-2xl bg-sage text-white flex items-center justify-center shrink-0 shadow-sm">
                <i data-lucide="compass" class="w-5 h-5"></i>
              </div>
              <div class="min-w-0">
                <div class="flex items-center gap-1">
                  <h1 class="text-base font-black text-charcoal truncate">${escapeHtml(trip.title)}</h1>
                  <i data-lucide="chevron-down" class="w-4 h-4 text-charcoal/50 shrink-0"></i>
                </div>
                <p class="text-[11px] font-bold text-charcoal/55 truncate">${escapeHtml(trip.destination)} ・ ${trip.startDate}</p>
              </div>
            </button>

            <button onclick="openModal('SETTINGS')"
              class="w-9 h-9 rounded-2xl bg-white border border-warmBorder flex items-center justify-center text-charcoal/80 hover:bg-creamDark transition shrink-0 shadow-sm"
              title="設定與風格切換">
              <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
          </div>

          <!-- 狀態膠囊列 -->
          <div class="flex items-center justify-between mt-2.5">
            <span class="px-3 py-1 rounded-full bg-white border border-warmBorder text-xs font-extrabold text-terracotta flex items-center gap-1.5 shadow-2xs">
              <span>✈️</span>
              <span>${getCountdownText(trip.startDate)}</span>
            </span>
            <span class="px-3 py-1 rounded-full bg-creamDark text-[11px] font-bold text-charcoal/65 flex items-center gap-1">
              <i data-lucide="cloud-check" class="w-3.5 h-3.5 text-sage"></i>
              <span>已儲存於本機</span>
            </span>
          </div>
        </header>

        <!-- 主內容區 -->
        <main class="min-h-[calc(100vh-140px)]">
          ${mainContent}
        </main>

        <!-- 底部 6 鍵導覽列 -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white/95 backdrop-blur-md border-t border-warmBorder px-1.5 py-1.5 pb-safe z-40">
          <div class="grid grid-cols-6 gap-0.5">
            ${[
              { id: 'schedule', icon: 'calendar-days', label: '行程' },
              { id: 'weather', icon: 'cloud-sun', label: '天氣' },
              { id: 'food', icon: 'utensils', label: '美食' },
              { id: 'budget', icon: 'wallet', label: '記帳' },
              { id: 'stay', icon: 'bed-double', label: '住宿' },
              { id: 'tasks', icon: 'check-square', label: '任務' }
            ].map(tab => {
              const active = uiState.activeTab === tab.id;
              return `
                <button onclick="switchTab('${tab.id}')"
                  class="flex flex-col items-center justify-center py-1.5 rounded-xl transition
                  ${active ? 'bg-terracotta text-white font-extrabold shadow-sm' : 'text-charcoal/65 hover:bg-creamDark/60 font-bold'}">
                  <i data-lucide="${tab.icon}" class="w-4 h-4 mb-0.5"></i>
                  <span class="text-[10px] leading-none">${tab.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </nav>

        <!-- 彈出視窗 -->
        ${uiState.modal ? renderModal(trip) : ''}

        <!-- 提示 Toast -->
        ${uiState.toast ? `
          <div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-charcoal text-white text-xs font-extrabold shadow-lg animate-bounce">
            ${escapeHtml(uiState.toast)}
          </div>
        ` : ''}
      `;

      lucide.createIcons();
    }

    /* === 1. 行程分頁（票券撕角版） === */
    function renderScheduleView(trip) {
      const currentDay = trip.days[uiState.selectedDayIdx] || trip.days[0];
      const items = (currentDay?.items || []).slice().sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      return `

    /* === 2. 天氣預報分頁 === */
    const WEATHER_PRESETS = {
      hiroshima: { name: '廣島・宮島', lat: 34.3853, lon: 132.4553 },
      osaka: { name: '大阪・京都', lat: 34.6937, lon: 135.5023 },
      gps: { name: '我的定位', lat: null, lon: null }
    };

    function getWeatherCodeInfo(code) {
      if (code === 0) return { text: '晴朗', emoji: '☀️' };
      if (code <= 3) return { text: '多雲時晴', emoji: '⛅' };
      if (code <= 48) return { text: '起霧多雲', emoji: '🌫️' };
      if (code <= 67) return { text: '下雨', emoji: '🌧️' };
      if (code <= 77) return { text: '降雪', emoji: '❄️' };
      if (code <= 82) return { text: '陣雨', emoji: '🌦️' };
      return { text: '雷陣雨', emoji: '⛈️' };
    }

    async function fetchWeatherForecast(cityKey) {
      uiState.weatherCity = cityKey;
      uiState.weatherLoading = true;
      render();

      let lat, lon;
      if (cityKey === 'gps') {
        if (!navigator.geolocation) {
          showToast('瀏覽器不支援定位功能');
          uiState.weatherLoading = false;
          render();
          return;
        }
        try {
          const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
          lat = pos.coords.latitude;
          lon = pos.coords.longitude;
          uiState.userCoords = { lat, lon };
        } catch (e) {
          showToast('無法取得定位，請確認定位權限');
          uiState.weatherLoading = false;
          render();
          return;
        }
      } else {
        lat = WEATHER_PRESETS[cityKey].lat;
        lon = WEATHER_PRESETS[cityKey].lon;
      }

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=14`;
        const res = await fetch(url);
        const data = await res.json();
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

        uiState.weatherData = data.daily.time.map((dateStr, i) => {
          const d = new Date(dateStr + 'T00:00:00');
          const mm = d.getMonth() + 1;
          const dd = d.getDate();
          const wd = weekDays[d.getDay()];
          const info = getWeatherCodeInfo(data.daily.weathercode[i]);
          return {
            dateLabel: `${mm}/${dd} (${wd})`,
            emoji: info.emoji,
            desc: info.text,
            min: Math.round(data.daily.temperature_2m_min[i]),
            max: Math.round(data.daily.temperature_2m_max[i]),
            pop: data.daily.precipitation_probability_max[i] ?? 0
          };
        });
      } catch (err) {
        showToast('氣象資料載入失敗，請稍後再試');
      } finally {
        uiState.weatherLoading = false;
        render();
      }
    }

                  <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sage shrink-0"></i>
                  <span>${escapeHtml(st.address)}</span>
                </div>
                ${st.code ? `
                  <div class="px-3 py-2 rounded-xl bg-creamDark/70 flex items-center justify-between text-xs">
                    <span class="font-bold text-charcoal/60">訂房代號</span>
                    <span class="font-mono font-black text-charcoal select-all">${escapeHtml(st.code)}</span>
                  </div>
                ` : ''}
                ${st.notes ? `<p class="text-xs text-charcoal/65">${escapeHtml(st.notes)}</p>` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* === 6. 行前任務分頁 === */
    function renderTasksView(trip) {
      const tasks = trip.tasks || [];
      const doneCount = tasks.filter(t => t.done).length;
      return `
        <div class="px-4 pt-3 pb-24 space-y-4">
          <div class="bg-white rounded-3xl p-4 border border-warmBorder flex items-center justify-between">
            <div>
              <h2 class="text-base font-black text-charcoal">行前準備清單</h2>
              <p class="text-xs text-charcoal/55 mt-0.5">已完成 ${doneCount} / ${tasks.length} 項</p>
            </div>
            <button onclick="openModal('ADD_TASK')"
              class="px-3 py-1.5 rounded-xl bg-sage text-white text-xs font-extrabold flex items-center gap-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
              <span>新增任務</span>
            </button>
          </div>

          <div class="space-y-2">
            ${tasks.map(t => `
              <div onclick="toggleTask('${t.id}')"
                class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between cursor-pointer">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-5 h-5 rounded-lg flex items-center justify-center border
                    ${t.done ? 'bg-sage border-sage text-white' : 'border-warmBorder bg-cream'}">
                    ${t.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                  </div>
                  <span class="text-sm font-bold truncate ${t.done ? 'line-through text-charcoal/40' : 'text-charcoal'}">
                    ${escapeHtml(t.text)}
                  </span>
                </div>
                <button onclick="event.stopPropagation(); deleteTask('${t.id}')" class="text-charcoal/30 hover:text-red-500 ml-2">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* === 彈出視窗（含設定 8 種風格切換） === */
    function renderModal(trip) {
      const { type, payload } = uiState.modal;
      let bodyHtml = '';
      let titleText = '';

      if (type === 'SETTINGS') {
        titleText = '設定與版面風格';
        bodyHtml = `
          <div class="space-y-4">
            <!-- 8 種版面風格選擇器 -->
            <div class="bg-white rounded-2xl p-3.5 border border-warmBorder space-y-2.5">
              <div class="text-xs font-extrabold text-charcoal flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                  <i data-lucide="palette" class="w-4 h-4 text-sage"></i>
                  <span>版面風格主題（8 款）</span>
                </div>
                <span class="text-[10px] text-charcoal/50 font-normal">點擊即時切換</span>
              </div>
              <div class="grid grid-cols-2 gap-2">
                ${[
                  { id: 'cream', name: '🌿 森林奶油', dot: '#5B7A58' },
                  { id: 'sakura', name: '🌸 櫻花晴空', dot: '#D96B84' },
                  { id: 'minimal', name: '📰 極簡雜誌', dot: '#18181B' },
                  { id: 'midnight', name: '🌙 深夜航行', dot: '#38BDF8' },
                  { id: 'kyoto', name: '🌅 京都楓紅', dot: '#C85A32' },
                  { id: 'okinawa', name: '🌊 沖繩海鹽', dot: '#0E8A9E' },
                  { id: 'lavender', name: '🪻 薰衣草霧', dot: '#7E65B0' },
                  { id: 'matcha', name: '🍵 宇治抹茶', dot: '#4A6B44' }
                ].map(th => `
                  <button type="button" onclick="changeAppTheme('${th.id}')"
                    class="p-2.5 rounded-xl border text-left flex items-center justify-between transition
                    ${uiState.theme === th.id ? 'border-sage ring-2 ring-sage/25 bg-sageLight/40 font-extrabold' : 'border-warmBorder opacity-85 hover:opacity-100'}">
                    <span class="text-xs text-charcoal truncate">${th.name}</span>
                    <span class="w-3.5 h-3.5 rounded-full border border-black/15 shrink-0 ml-1" style="background:${th.dot}"></span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- 匯率設定 -->
            <div class="bg-white rounded-2xl p-3.5 border border-warmBorder space-y-2">
              <label class="text-xs font-extrabold text-charcoal">日幣匯率設定（1 ${trip.currency} = ? TWD）</label>
              <div class="flex gap-2">
                <input id="rateInput" type="number" step="0.001" value="${trip.exchangeRate}"
                  class="flex-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold text-charcoal" />
                <button onclick="updateExchangeRate()" class="px-4 py-2 rounded-xl bg-sage text-white text-xs font-extrabold">儲存</button>
              </div>
            </div>

            <!-- 備份與還原 -->
            <div class="bg-white rounded-2xl p-3.5 border border-warmBorder space-y-2.5">
              <div class="text-xs font-extrabold text-charcoal">資料備份與重置</div>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="exportDataJson()" class="py-2.5 rounded-xl bg-creamDark text-charcoal text-xs font-extrabold">匯出 JSON 備份</button>
                <button onclick="resetDefaultData()" class="py-2.5 rounded-xl bg-red-50 text-red-600 text-xs font-extrabold">重置預設範例</button>
              </div>
            </div>
          </div>
        `;
      } else if (type === 'ADD_ITEM' || type === 'EDIT_ITEM') {
        const currentDay = trip.days[uiState.selectedDayIdx];
        const editingItem = type === 'EDIT_ITEM' ? currentDay.items.find(i => i.id === payload) : null;
        titleText = editingItem ? '編輯行程票券' : '新增行程票券';

        bodyHtml = `
          <form onsubmit="saveScheduleItem(event, '${editingItem ? editingItem.id : ''}')" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">時間</label>
                <input name="time" type="time" value="${editingItem ? editingItem.time : '10:00'}" required
                  class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">票券類別</label>
                <select name="category" class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold">
                  ${Object.entries(CATEGORIES).map(([k, v]) => `
                    <option value="${k}" ${editingItem && editingItem.category === k ? 'selected' : ''}>${v.label}</option>
                  `).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">行程標題</label>
              <input name="title" type="text" required placeholder="例：嚴島神社參拜" value="${editingItem ? escapeHtml(editingItem.title) : ''}"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">地點名稱</label>
              <input name="location" type="text" placeholder="例：廣島縣廿日市市" value="${editingItem ? escapeHtml(editingItem.location || '') : ''}"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">Google 地圖搜尋關鍵字</label>
              <input name="mapQuery" type="text" placeholder="例：Itsukushima Shrine" value="${editingItem ? escapeHtml(editingItem.mapQuery || '') : ''}"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">備註提醒</label>
              <textarea name="notes" rows="2" placeholder="輸入交通方式、必點美食或預約編號..."
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold">${editingItem ? escapeHtml(editingItem.notes || '') : ''}</textarea>
            </div>
            <div class="flex gap-2 pt-2">
              ${editingItem ? `
                <button type="button" onclick="deleteScheduleItem('${editingItem.id}')"
                  class="px-4 py-2.5 rounded-xl bg-red-50 text-red-600 text-xs font-extrabold">刪除</button>
              ` : ''}
              <button type="submit" class="flex-1 py-2.5 rounded-xl bg-sage text-white text-xs font-extrabold">儲存票券</button>
            </div>
          </form>
        `;
      } else if (type === 'ADD_EXPENSE') {
        titleText = '新增一筆花費';
        bodyHtml = `
          <form onsubmit="saveExpense(event)" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">項目名稱</label>
              <input name="title" type="text" required placeholder="例：一蘭拉麵"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">金額 (${trip.currency})</label>
                <input name="amount" type="number" required placeholder="1200"
                  class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">分類</label>
                <select name="category" class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold">
                  <option value="餐飲">餐飲</option>
                  <option value="交通">交通</option>
                  <option value="購物">購物</option>
                  <option value="門票">門票</option>
                  <option value="住宿">住宿</option>
                </select>
              </div>
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-terracotta text-white text-xs font-extrabold">加入記帳</button>
          </form>
        `;
      } else if (type === 'ADD_STAY') {
        titleText = '新增住宿憑證';
        bodyHtml = `
          <form onsubmit="saveStay(event)" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">飯店名稱</label>
              <input name="name" type="text" required placeholder="例：EN HOTEL Hiroshima"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">入住日</label>
                <input name="checkIn" type="date" required value="${trip.startDate}"
                  class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
              </div>
              <div>
                <label class="text-[11px] font-bold text-charcoal/70">退房日</label>
                <input name="checkOut" type="date" required value="${trip.endDate}"
                  class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
              </div>
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">地址</label>
              <input name="address" type="text" required placeholder="飯店地址"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">訂房代號</label>
              <input name="code" type="text" placeholder="選填"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-sage text-white text-xs font-extrabold">儲存住宿</button>
          </form>
        `;
      } else if (type === 'ADD_TASK') {
        titleText = '新增行前任務';
        bodyHtml = `
          <form onsubmit="saveTask(event)" class="space-y-3">
            <div>
              <label class="text-[11px] font-bold text-charcoal/70">任務內容</label>
              <input name="text" type="text" required placeholder="例：列印機票與飯店確認單"
                class="w-full mt-1 px-3 py-2 rounded-xl border border-warmBorder bg-cream text-sm font-bold" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-sage text-white text-xs font-extrabold">新增任務</button>
          </form>
        `;
      } else if (type === 'SWITCH_TRIP') {
        titleText = '切換或建立旅程';
        bodyHtml = `
          <div class="space-y-3">
            <div class="space-y-2">
              ${appData.trips.map(t => `
                <button onclick="selectTrip('${t.id}')"
                  class="w-full p-3 rounded-2xl border text-left flex items-center justify-between
                  ${t.id === trip.id ? 'border-sage bg-sageLight/40 font-extrabold' : 'border-warmBorder bg-white'}">
                  <div>
                    <div class="text-sm text-charcoal">${escapeHtml(t.title)}</div>
                    <div class="text-[11px] text-charcoal/55">${escapeHtml(t.destination)} ・ ${t.startDate}</div>
                  </div>
                  ${t.id === trip.id ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-sage"></i>' : ''}
                </button>
              `).join('')}
            </div>
            <form onsubmit="createNewTrip(event)" class="pt-3 border-t border-warmBorder space-y-2">
              <div class="text-xs font-extrabold text-charcoal">+ 建立新旅程</div>
              <input name="title" type="text" required placeholder="旅程標題（例：北海道札幌雪祭）"
                class="w-full px-3 py-2 rounded-xl border border-warmBorder bg-cream text-xs font-bold" />
              <div class="grid grid-cols-2 gap-2">
                <input name="destination" type="text" required placeholder="目的地（例：札幌・小樽）"
                  class="px-3 py-2 rounded-xl border border-warmBorder bg-cream text-xs font-bold" />
                <input name="startDate" type="date" required value="2027-01-20"
                  class="px-3 py-2 rounded-xl border border-warmBorder bg-cream text-xs font-bold" />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-sage text-white text-xs font-extrabold">建立旅程</button>
            </form>
          </div>
        `;
      }

      return `
        <div onclick="closeModal()" class="fixed inset-0 bg-black/45 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-3">
          <div onclick="event.stopPropagation()" class="w-full max-w-[440px] bg-cream rounded-3xl p-5 border border-warmBorder shadow-2xl max-h-[85vh] overflow-y-auto space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-base font-black text-charcoal">${titleText}</h3>
              <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-creamDark flex items-center justify-center text-charcoal/70">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
            ${bodyHtml}
          </div>
        </div>
      `;
    }

    /* === 資料操作函式 === */
    function saveScheduleItem(e, editId) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      const day = trip.days[uiState.selectedDayIdx];
      const itemData = {
        id: editId || 'item_' + Date.now(),
        time: fd.get('time'),
        category: fd.get('category'),
        title: fd.get('title'),
        location: fd.get('location'),
        mapQuery: fd.get('mapQuery') || fd.get('location') || fd.get('title'),
        notes: fd.get('notes')
      };

      if (editId) {
        const idx = day.items.findIndex(i => i.id === editId);
        if (idx !== -1) day.items[idx] = itemData;
      } else {
        day.items.push(itemData);
      }
      saveAppData();
      closeModal();
      showToast('行程票券已儲存');
    }

    function deleteScheduleItem(itemId) {
      const trip = getCurrentTrip();
      const day = trip.days[uiState.selectedDayIdx];
      day.items = day.items.filter(i => i.id !== itemId);
      saveAppData();
      closeModal();
      showToast('已刪除票券');
    }

    function addNewDay() {
      const trip = getCurrentTrip();
      const nextIdx = trip.days.length + 1;
      trip.days.push({
        dayIndex: nextIdx,
        date: '',
        label: `Day ${nextIdx}`,
        subtitle: '自由探索日',
        items: []
      });
      uiState.selectedDayIdx = trip.days.length - 1;
      saveAppData();
      render();
      showToast(`已新增 Day ${nextIdx}`);
    }

    function saveExpense(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      trip.expenses.unshift({
        id: 'exp_' + Date.now(),
        title: fd.get('title'),
        amount: Number(fd.get('amount')),
        category: fd.get('category'),
        payer: '我'
      });
      saveAppData();
      closeModal();
      showToast('已新增消費紀錄');
    }

    function deleteExpense(id) {
      const trip = getCurrentTrip();
      trip.expenses = trip.expenses.filter(e => e.id !== id);
      saveAppData();
      render();
    }

    function saveStay(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      trip.stays.push({
        id: 'stay_' + Date.now(),
        name: fd.get('name'),
        checkIn: fd.get('checkIn'),
        checkOut: fd.get('checkOut'),
        address: fd.get('address'),
        code: fd.get('code'),
        notes: ''
      });
      saveAppData();
      closeModal();
      showToast('已新增住宿憑證');
    }

    function deleteStay(id) {
      const trip = getCurrentTrip();
      trip.stays = trip.stays.filter(s => s.id !== id);
      saveAppData();
      render();
    }

    function saveTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const trip = getCurrentTrip();
      trip.tasks.push({
        id: 'task_' + Date.now(),
        text: fd.get('text'),
        done: false
      });
      saveAppData();
      closeModal();
      showToast('已新增行前任務');
    }

    function toggleTask(id) {
      const trip = getCurrentTrip();
      const task = trip.tasks.find(t => t.id === id);
      if (task) task.done = !task.done;
      saveAppData();
      render();
    }

    function deleteTask(id) {
      const trip = getCurrentTrip();
      trip.tasks = trip.tasks.filter(t => t.id !== id);
      saveAppData();
      render();
    }

    function selectTrip(tripId) {
      appData.currentTripId = tripId;
      uiState.selectedDayIdx = 0;
      saveAppData();
      closeModal();
      showToast('已切換旅程');
    }

    function createNewTrip(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const newTrip = {
        id: 'trip_' + Date.now(),
        title: fd.get('title'),
        destination: fd.get('destination'),
        startDate: fd.get('startDate'),
        endDate: fd.get('startDate'),
        currency: 'JPY',
        exchangeRate: 0.215,
        days: [
          { dayIndex: 1, date: fd.get('startDate'), label: 'Day 1', subtitle: '出發日', items: [] }
        ],
        expenses: [],
        stays: [],
        tasks: [{ id: 't_' + Date.now(), text: '確認護照效期與機票', done: false }]
      };
      appData.trips.push(newTrip);
      appData.currentTripId = newTrip.id;
      uiState.selectedDayIdx = 0;
      saveAppData();
      closeModal();
      showToast('已建立新旅程！');
    }

    function updateExchangeRate() {
      const val = parseFloat(document.getElementById('rateInput').value);
      if (!isNaN(val) && val > 0) {
        getCurrentTrip().exchangeRate = val;
        saveAppData();
        closeModal();
        showToast('已更新匯率');
      }
    }

    function exportDataJson() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trip-mochi-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetDefaultData() {
      if (confirm('確定要重置回預設範例資料嗎？')) {
        appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveAppData();
        closeModal();
        showToast('已重置為預設資料');
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // 啟動渲染
    render();
  </script>
</body>
</html>
