let cloudSyncState = {
  status: 'idle',
  lastSyncText: '尚未同步',
  timer: null
};

let appState = (() => {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      const base = createInitialData();
      return {
        ...base,
        ...parsed,
        currentUserCode: parsed.currentUserCode || ADMIN_CODE,
        userRegistry: { ...base.userRegistry, ...(parsed.userRegistry || {}) }
      };
    }
  } catch (e) {
    console.error('Failed to load state:', e);
  }
  return createInitialData();
})();

function saveState(options = { syncCloud: true }) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    showToast('儲存空間已滿，建議減少大型圖片上傳', 'error');
  }
  if (options.syncCloud && GAS_WEB_APP_URL) {
    scheduleCloudPush();
  }
}

function updateSyncStatusUI() {
  const el = document.getElementById('gas_sync_indicator');
  if (!el) return;
  el.textContent = cloudSyncState.lastSyncText;
  el.className = cloudSyncState.status === 'error'
    ? 'text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-full border border-red-200'
    : 'text-[10px] font-bold text-sageDark bg-sageLight/80 px-2 py-0.5 rounded-full border border-sage/20';
}

function scheduleCloudPush() {
  clearTimeout(cloudSyncState.timer);
  cloudSyncState.status = 'syncing';
  cloudSyncState.lastSyncText = '☁️ 上傳中...';
  updateSyncStatusUI();
  cloudSyncState.timer = setTimeout(() => {
    pushStateToCloud(false);
  }, 600);
}

async function pushStateToCloud(showToastMsg = false) {
  if (!GAS_WEB_APP_URL) return;
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        users: appState.userRegistry || {},
        trips: (appState.trips || []).reduce((acc, t) => {
          acc[t.id] = t;
          return acc;
        }, {}),
        fullAppState: appState
      })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || '同步失敗');
    cloudSyncState.status = 'synced';
    cloudSyncState.lastSyncText = `☁️ 已同步 ${new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5)}`;
    updateSyncStatusUI();
    if (showToastMsg) showToast('已同步最新資料至 Google 試算表！');
  } catch (err) {
    cloudSyncState.status = 'error';
    cloudSyncState.lastSyncText = '⚠️ 同步失敗';
    updateSyncStatusUI();
    if (showToastMsg) showToast('雲端同步失敗：' + err.message, 'error');
  }
}

async function pullStateFromCloud(showToastMsg = false) {
  if (!GAS_WEB_APP_URL) return;
  cloudSyncState.status = 'syncing';
  cloudSyncState.lastSyncText = '☁️ 抓取中...';
  updateSyncStatusUI();
  try {
    const res = await fetch(`${GAS_WEB_APP_URL}?t=${Date.now()}`, { method: 'GET' });
    const json = await res.json();
    if (!json.ok || !json.data) throw new Error(json.error || '無雲端資料');

    const cloudTripsObj = json.data.trips || {};
    const cloudUsersObj = json.data.users || {};
    const cloudTripList = Object.values(cloudTripsObj);

    if (cloudTripList.length > 0) {
      const localById = {};
      (appState.trips || []).forEach(t => { localById[t.id] = t; });
      const mergedTrips = cloudTripList.map(ct => ({
        ...ct,
        ownerCode: ct.ownerCode || ADMIN_CODE,
        editorCodes: Array.isArray(ct.editorCodes) ? ct.editorCodes : [ct.ownerCode || ADMIN_CODE]
      }));
      appState.trips = mergedTrips;
      if (!appState.trips.find(t => t.id === appState.activeTripId)) {
        appState.activeTripId = appState.trips[0].id;
      }
    }

    if (Object.keys(cloudUsersObj).length > 0) {
      appState.userRegistry = { ...createInitialData().userRegistry, ...cloudUsersObj };
    }

    if (!appState.userRegistry[appState.currentUserCode]) {
      appState.currentUserCode = ADMIN_CODE;
    }

    saveState({ syncCloud: false });
    cloudSyncState.status = 'synced';
    cloudSyncState.lastSyncText = `☁️ 已同步 ${new Date().toLocaleTimeString('zh-TW', { hour12: false }).slice(0, 5)}`;
    render();
    if (showToastMsg) showToast('已從 Google 試算表更新最新行程！');
  } catch (err) {
    cloudSyncState.status = 'error';
    cloudSyncState.lastSyncText = '⚠️ 讀取失敗';
    updateSyncStatusUI();
    if (showToastMsg) showToast('抓取雲端資料失敗：' + err.message, 'error');
  }
}

function isCurrentUserAdmin() {
  const u = getCurrentAuthUser();
  return !!(u && (u.role === 'admin' || u.code === ADMIN_CODE));
}

function canCurrentUserEditTrip(trip) {
  if (!trip) return false;
  const u = getCurrentAuthUser();
  if (!u) return false;
  if (u.role === 'admin' || u.code === ADMIN_CODE) return true;
  if (trip.ownerCode === u.code) return true;
  return Array.isArray(trip.editorCodes) && trip.editorCodes.includes(u.code);
}

function generateUniqueAuthCode(prefix = 'TRV') {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  do {
    let rand = '';
    for (let i = 0; i < 5; i++) {
      rand += chars[Math.floor(Math.random() * chars.length)];
    }
    code = `${prefix}-${rand}`;
  } while (appState.userRegistry[code]);
  return code;
}

function formatDateParts(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return { md: dateStr, weekday: '' };
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  return {
    md: `${parts[1]}/${parts[2]}`,
    weekday: weekdays[d.getDay()] || ''
  };
}

function convertToTWD(amount, currency, rates) {
  const num = Number(amount) || 0;
  const rate = (rates && rates[currency]) ? Number(rates[currency]) : (DEFAULT_RATES[currency] || 1);
  return Math.round(num * rate);
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const bg = type === 'error' ? 'bg-red-600' : 'bg-[#2C302E]';
  el.className = `${bg} text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 animate-slide-up`;
  el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✨'}</span><span>${message}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.2s';
    setTimeout(() => el.remove(), 220);
  }, 2400);
}

function calculateTripFinancials(trip) {
  const rates = trip.rates || DEFAULT_RATES;
  const memberTotals = {};
  trip.members.forEach(m => {
    memberTotals[m.id] = { totalTWD: 0, breakdown: [] };
  });

  trip.days.forEach((day) => {
    day.items.forEach(item => {
      const price = Number(item.price) || 0;
      if (price <= 0 || item.isPotential) return;
      const participants = (item.memberIds && item.memberIds.length > 0)
        ? item.memberIds.filter(id => memberTotals[id])
        : trip.members.map(m => m.id);
      if (participants.length === 0) return;

      let perPersonOrig = price;
      if (item.includeTax) perPersonOrig = perPersonOrig * 1.015;
      const perPersonTWD = convertToTWD(perPersonOrig, item.currency || 'TWD', rates);

      participants.forEach(mid => {
        memberTotals[mid].totalTWD += perPersonTWD;
        memberTotals[mid].breakdown.push({
          title: item.title,
          typeLabel: ITEM_TYPES[item.type]?.label || '項目',
          date: day.date,
          amountTWD: perPersonTWD
        });
      });
    });
  });

  const potentialItems = [];
  let totalPotentialTWD = 0;
  trip.days.forEach((day, dIdx) => {
    day.items.forEach(item => {
      const price = Number(item.price) || 0;
      if (price > 0 && item.isPotential) {
        const origWithFee = item.includeTax ? price * 1.015 : price;
        const perPersonTWD = convertToTWD(origWithFee, item.currency || 'TWD', rates);
        const participants = (item.memberIds && item.memberIds.length > 0)
          ? item.memberIds.filter(id => memberTotals[id])
          : trip.members.map(m => m.id);
        const rowTotal = perPersonTWD * participants.length;
        totalPotentialTWD += rowTotal;
        potentialItems.push({
          ...item,
          dayNumber: dIdx + 1,
          perPersonTWD,
          rowTotalTWD: rowTotal,
          participants
        });
      }
    });
  });

  let totalSplitExpenseTWD = 0;
  const paidByMember = {};
  const owedByMember = {};
  trip.members.forEach(m => {
    paidByMember[m.id] = 0;
    owedByMember[m.id] = 0;
  });

  (trip.expenses || []).forEach(exp => {
    const raw = Number(exp.amount) || 0;
    const withFee = exp.extraFee ? raw * 1.015 : raw;
    const twd = convertToTWD(withFee, exp.currency || 'TWD', rates);
    totalSplitExpenseTWD += twd;

    if (paidByMember[exp.payerId] !== undefined) {
      paidByMember[exp.payerId] += twd;
    }

    if (exp.splitMode === 'CUSTOM' && exp.customSplits) {
      Object.entries(exp.customSplits).forEach(([mid, origAmt]) => {
        if (owedByMember[mid] !== undefined) {
          const mWithFee = exp.extraFee ? (Number(origAmt) || 0) * 1.015 : (Number(origAmt) || 0);
          owedByMember[mid] += convertToTWD(mWithFee, exp.currency || 'TWD', rates);
        }
      });
    } else {
      const splitters = (exp.splitMemberIds && exp.splitMemberIds.length > 0)
        ? exp.splitMemberIds.filter(id => owedByMember[id] !== undefined)
        : trip.members.map(m => m.id);
      if (splitters.length > 0) {
        const share = Math.round(twd / splitters.length);
        splitters.forEach(id => {
          owedByMember[id] += share;
        });
      }
    }
  });

  const cashSummary = {};
  (trip.cashExchanges || []).forEach(ex => {
    const cur = (ex.currency || 'JPY').toUpperCase();
    if (!cashSummary[cur]) cashSummary[cur] = { boughtForeign: 0, boughtTWD: 0, spentForeign: 0, remainingForeign: 0 };
    cashSummary[cur].boughtForeign += Number(ex.foreignAmount) || 0;
    cashSummary[cur].boughtTWD += Number(ex.twdCost) || 0;
  });

  (trip.expenses || []).forEach(exp => {
    if (exp.method === '現金支付' && exp.currency && exp.currency.toUpperCase() !== 'TWD') {
      const cur = exp.currency.toUpperCase();
      if (!cashSummary[cur]) cashSummary[cur] = { boughtForeign: 0, boughtTWD: 0, spentForeign: 0, remainingForeign: 0 };
      cashSummary[cur].spentForeign += Number(exp.amount) || 0;
    }
  });

  Object.keys(cashSummary).forEach(cur => {
    cashSummary[cur].remainingForeign = cashSummary[cur].boughtForeign - cashSummary[cur].spentForeign;
  });

  return {
    memberTotals,
    potentialItems,
    totalPotentialTWD,
    totalSplitExpenseTWD,
    paidByMember,
    owedByMember,
    cashSummary
  };
}

function getTimeGapLabel(curr, next) {
  const startStr = curr.arrTime || curr.time;
  const endStr = next.time;
  if (!startStr || !endStr || !startStr.includes(':') || !endStr.includes(':')) return '';
  const [h1, m1] = startStr.split(':').map(Number);
  const [h2, m2] = endStr.split(':').map(Number);
  const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (diff <= 0 || diff > 720) return '';
  const hrs = Math.floor(diff / 60);
  const mins = diff % 60;
  return hrs > 0 ? `間隔約 ${hrs} 小時 ${mins > 0 ? mins + ' 分' : ''}` : `移動 / 停留間隔約 ${mins} 分鐘`;
}

            <span class="w-8 h-8 rounded-xl ${meta.bg} ${meta.color} flex items-center justify-center shrink-0">
              <i data-lucide="${meta.icon}" class="w-4 h-4"></i>
            </span>
            <span class="bg-sageLight text-sageDark font-extrabold text-xs px-2.5 py-0.5 rounded-lg font-mono">
              ${escapeHtml(item.time || '09:00')}
            </span>
            <span class="text-[11px] font-bold tracking-wider uppercase ${meta.color}">
              ${meta.tag}
            </span>
            ${item.isPotential ? `
              <span class="text-[10px] font-bold bg-terracottaLight text-terracotta px-2 py-0.5 rounded-full">

            <div class="flex items-center gap-1.5">

                ${escapeHtml(item.currency || 'TWD')} ${Number(item.price).toLocaleString()}
              </span>
              <button onclick="event.stopPropagation(); guardEditAction(() => convertItemToExpense('${item.id}'))"
                title="一鍵帶入記帳分帳"
                class="text-[11px] font-extrabold bg-charcoal hover:bg-black text-white px-2.5 py-1 rounded-full shadow-2xs active:scale-95 transition">

          ${escapeHtml(item.title)}

          <div class="flex items-center justify-between gap-2 mt-1">
            <p class="text-xs text-stone-500 flex items-center gap-1 truncate">

              <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        ` : ''}

        ${hasImages && imgPos === 'middle' ? renderPhotoBanner() : ''}

        ${item.type === 'FLIGHT' ? renderFlightDetails() : ''}
        ${item.type === 'TRANSPORT' ? renderTransportDetails() : ''}

        ${item.notes ? `
          <div class="mt-3 bg-cream/60 rounded-2xl p-3.5 text-xs text-stone-700 leading-relaxed border border-warmBorder/70 flex items-center">
            <div class="whitespace-pre-line w-full">${escapeHtml(item.notes.trim())}</div>
          </div>
        ` : ''}

        ${hasImages && imgPos === 'bottom' ? renderPhotoBanner() : ''}

        ${participants.length > 0 ? `
          <div class="mt-3 pt-2.5 border-t border-warmBorder/60 flex items-center justify-between">
            <span class="text-[10px] font-bold tracking-wider text-stone-400 uppercase">MEMBERS</span>

              ${participants.map(m => `
                <span class="inline-flex items-center gap-1 text-[11px] font-medium bg-cream px-2 py-0.5 rounded-full text-stone-600">
                  <span>${m.avatar}</span>
                  <span>${escapeHtml(m.name)}</span>
                </span>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

function renderBookingsTab(trip) {
  const flights = [];
  const hotels = [];
  trip.days.forEach((day, dIdx) => {
    day.items.forEach(item => {
      if (item.type === 'FLIGHT') flights.push({ ...item, dayDate: day.date, dayNum: dIdx + 1 });
      if (item.type === 'HOTEL') hotels.push({ ...item, dayDate: day.date, dayNum: dIdx + 1 });
    });
  });

  const subTabs = [
    { id: 'FLIGHT', label: '機票', icon: 'plane', count: flights.length },
    { id: 'HOTEL', label: '住宿', icon: 'bed-double', count: hotels.length },
    { id: 'CAR', label: '租車', icon: 'car', count: 0 }
  ];

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <div class="grid grid-cols-3 gap-2 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">
        ${subTabs.map(st => {
          const active = uiState.bookingSubTab === st.id;
          return `
            <button onclick="setBookingSubTab('${st.id}')"
              class="py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition
              ${active ? 'bg-sage text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
              <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
              <span>${st.label}</span>
              ${st.count > 0 ? `<span class="text-[10px] px-1.5 rounded-full ${active ? 'bg-white/25' : 'bg-cream'}">${st.count}</span>` : ''}
            </button>
          `;
        }).join('')}
      </div>

      <button onclick="guardEditAction(() => openModal('ITEM_FORM', { type: '${uiState.bookingSubTab === 'CAR' ? 'TRANSPORT' : uiState.bookingSubTab}' }))"
        class="w-full py-3 rounded-2xl bg-white hover:bg-sageLight/50 text-charcoal font-bold text-xs border border-warmBorder shadow-sm flex items-center justify-center gap-1.5 transition">
        <i data-lucide="plus" class="w-4 h-4 text-sage"></i>
        <span>新增${uiState.bookingSubTab === 'FLIGHT' ? '機票' : uiState.bookingSubTab === 'HOTEL' ? '住宿' : '租車'}</span>
      </button>

      ${uiState.bookingSubTab === 'FLIGHT' ? (
        flights.length === 0 ? renderEmptyBooking('plane', '尚未新增機票', '點擊上方按鈕新增第一筆機票資料') :
        `<div class="space-y-3">${flights.map(f => renderItineraryCard(trip, f, 0)).join('')}</div>`
      ) : ''}

      ${uiState.bookingSubTab === 'HOTEL' ? (
        hotels.length === 0 ? renderEmptyBooking('bed-double', '尚未新增住宿', '點擊上方按鈕新增飯店、民宿或 Airbnb 資訊') :
        `<div class="space-y-3">${hotels.map(h => `
          <div onclick="guardEditAction(() => openModal('EDIT_ITEM', '${h.id}'))" class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm cursor-pointer hover:shadow-md transition">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold bg-purple-50 text-purple-700 px-2.5 py-0.5 rounded-full">
                Day ${h.dayNum} · ${h.dayDate}
              </span>
              <span class="text-xs font-extrabold text-sage">
                ${h.currency || 'TWD'} ${Number(h.price || 0).toLocaleString()}
              </span>
            </div>
            <h3 class="text-base font-extrabold text-charcoal">${escapeHtml(h.title)}</h3>
            <p class="text-xs text-stone-500 mt-1 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-purple-600"></i>
              <span>${escapeHtml(h.location || '未填寫地址')}</span>
            </p>
            ${h.notes ? `<div class="mt-2.5 bg-cream/70 rounded-xl p-2.5 text-xs text-stone-600 whitespace-pre-line">${escapeHtml(h.notes.trim())}</div>` : ''}
          </div>
        `).join('')}</div>`
      ) : ''}

      ${uiState.bookingSubTab === 'CAR' ? renderEmptyBooking('car', '尚未安排租車', '若有自駕行程，可點擊上方按鈕新增租車訂單') : ''}
    </div>
  `;
}

function renderEmptyBooking(icon, title, subtitle) {

    <div class="bg-white rounded-3xl p-10 border border-warmBorder text-center shadow-sm">

      <h4 class="text-sm font-extrabold text-charcoal">${title}</h4>

}

function renderExpensesTab(trip) {

    return exp.payerId === uiState.expenseFilterMember;
  });

  const displayedTotalTWD = filteredExpenses.reduce((sum, exp) => {
    const raw = Number(exp.amount) || 0;
    const withFee = exp.extraFee ? raw * 1.015 : raw;
    return sum + convertToTWD(withFee, exp.currency || 'TWD', trip.rates);
  }, 0);

  return `

      <div class="grid grid-cols-3 gap-1.5 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">

          <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
          <span>分帳總覽</span>
        </button>
        <button onclick="setExpenseSubTab('CASH')"
          class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition

          <i data-lucide="banknote" class="w-3.5 h-3.5"></i>
          <span>外幣現金</span>
        </button>
        <button onclick="setExpenseSubTab('POOL')"
          class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition
          ${uiState.expenseSubTab === 'POOL' ? 'bg-charcoal text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
          <i data-lucide="piggy-bank" class="w-3.5 h-3.5"></i>
          <span>公費管理</span>
        </button>
      </div>

      ${uiState.expenseSubTab === 'SPLIT' ? `
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="guardEditAction(() => openAddExpenseModal())"
            class="py-3 rounded-2xl bg-sage hover:bg-sageDark text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition">

            <span>新增支出</span>
          </button>
          <button onclick="openModal('SETTLEMENT_SUMMARY')"
            class="py-3 rounded-2xl bg-white hover:bg-cream text-charcoal font-bold text-xs border border-warmBorder shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition">

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button onclick="setExpenseFilterMember('ALL')"
            class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition
            ${uiState.expenseFilterMember === 'ALL' ? 'bg-charcoal text-white' : 'bg-white text-stone-600 border border-warmBorder'}">
            全部
          </button>
          ${trip.members.map(m => `
            <button onclick="setExpenseFilterMember('${m.id}')"
              class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 transition
              ${uiState.expenseFilterMember === m.id ? 'bg-sage text-white' : 'bg-white text-stone-600 border border-warmBorder'}">
              <span>${m.avatar}</span>
              <span>${escapeHtml(m.name)}</span>
            </button>
          `).join('')}
        </div>

        <div class="bg-gradient-to-br from-[#5B7A58] to-[#466343] rounded-3xl p-5 text-white shadow-md">
          <div class="text-xs font-medium text-white/80">

          </div>
          <div class="text-3xl font-black tracking-tight mt-1">
            NT$ ${displayedTotalTWD.toLocaleString()}

          <div class="mt-3 pt-3 border-t border-white/15 flex items-center justify-between text-xs text-white/90">
            <span>共 ${filteredExpenses.length} 筆支出紀錄</span>
            <span>平均每人 NT$ ${Math.round(displayedTotalTWD / Math.max(1, trip.members.length)).toLocaleString()}</span>
          </div>
        </div>

          <h3 class="text-xs font-bold text-stone-500 px-1">支出明細</h3>

            const payer = trip.members.find(m => m.id === exp.payerId);

            const isCustom = exp.splitMode === 'CUSTOM';
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-warmBorder shadow-sm flex items-center justify-between gap-3">

            </div>
          ` : Object.entries(fin.cashSummary).map(([cur, info]) => {
            const pct = info.boughtForeign > 0 ? Math.max(0, Math.min(100, Math.round((info.remainingForeign / info.boughtForeign) * 100))) : 0;
            const avgRate = info.boughtForeign > 0 ? (info.boughtTWD / info.boughtForeign).toFixed(4) : '-';
            return `
              <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                  <div>
                    <span class="text-xs font-extrabold bg-sageLight text-sageDark px-2.5 py-0.5 rounded-full">${cur} 現金袋</span>
                    <div class="text-2xl font-black text-charcoal mt-1.5">
                      ${cur} ${info.remainingForeign.toLocaleString()}
                    </div>
                  </div>
                  <div class="text-right text-[11px] text-stone-500">
                    <div>平均換匯率：<b>${avgRate}</b></div>
                    <div class="mt-0.5">約合 NT$ ${convertToTWD(info.remainingForeign, cur, trip.rates).toLocaleString()}</div>
                  </div>
                </div>

                <div class="w-full h-2.5 bg-cream rounded-full overflow-hidden">
                  <div class="h-full bg-sage rounded-full transition-all" style="width: ${pct}%"></div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1 text-xs">
                  <div class="bg-cream/80 rounded-xl p-2.5">
                    <div class="text-[10px] text-stone-400">總換入外幣</div>
                    <div class="font-extrabold text-charcoal mt-0.5">${cur} ${info.boughtForeign.toLocaleString()}</div>
                  </div>
                  <div class="bg-terracottaLight/70 rounded-xl p-2.5">
                    <div class="text-[10px] text-terracotta">已花費現金</div>
                    <div class="font-extrabold text-terracotta mt-0.5">- ${cur} ${info.spentForeign.toLocaleString()}</div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold text-stone-500 px-1">換匯登記紀錄</h3>
          ${(trip.cashExchanges || []).map(ex => `
            <div class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between text-xs">
              <div>
                <div class="font-extrabold text-charcoal">+ ${ex.currency} ${Number(ex.foreignAmount).toLocaleString()}</div>
                <div class="text-[11px] text-stone-400 mt-0.5">${ex.date} · ${escapeHtml(ex.note || '外幣現鈔')} (花費 NT$${Number(ex.twdCost).toLocaleString()})</div>
              </div>
              <button onclick="guardEditAction(() => deleteCashExchange('${ex.id}'))" class="text-stone-300 hover:text-red-500">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          `).join('')}
        </div>
      ` : ''}

      ${uiState.expenseSubTab === 'POOL' ? `
        <div class="bg-gradient-to-br from-[#2B7A69] to-[#1F5C4E] rounded-3xl p-5 text-white shadow-md space-y-2">
          <div class="text-xs font-medium text-white/80">公費各幣別餘額概覽</div>
          <div class="flex flex-wrap gap-2.5 pt-1">
            ${Object.entries(getPoolBalancesByCurrency(trip)).map(([cur, bal]) => `
              <div class="bg-white/15 rounded-2xl px-3.5 py-2">
                <div class="text-[10px] text-white/80">${cur}</div>
                <div class="text-xl font-black">${cur} ${bal.toLocaleString()}</div>
              </div>
            `).join('')}
          </div>

        <div class="grid grid-cols-2 gap-3">
          <button onclick="guardEditAction(() => openModal('POOL_ACTION', 'deposit'))"
            class="bg-white hover:bg-emerald-50 rounded-2xl p-4 border border-warmBorder shadow-sm flex flex-col items-center gap-1.5 transition">
            <span class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
            </span>
            <span class="text-xs font-extrabold text-charcoal">入金</span>
            <span class="text-[10px] text-stone-400">ADD FUND</span>
          </button>

          <button onclick="guardEditAction(() => openModal('POOL_ACTION', 'spend'))"
            class="bg-white hover:bg-red-50 rounded-2xl p-4 border border-warmBorder shadow-sm flex flex-col items-center gap-1.5 transition">
            <span class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
              <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
            </span>
            <span class="text-xs font-extrabold text-charcoal">公費支出</span>
            <span class="text-[10px] text-stone-400">RECORD SPEND</span>
          </button>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold text-stone-500 px-1">公費明細</h3>
          ${(trip.poolLogs || []).length === 0 ? `
            <div class="bg-white rounded-2xl p-8 text-center border border-warmBorder text-xs text-stone-400">尚無公費收支紀錄</div>
          ` : (trip.poolLogs || []).map(log => {
            const cur = log.currency || 'TWD';
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between">
                <div>
                  <div class="text-xs font-bold text-charcoal">${escapeHtml(log.title)}</div>
                  <div class="text-[11px] text-stone-400 mt-0.5">${log.date} · 保管人：${escapeHtml(log.keeper || '未指定')}</div>

                <span class="text-sm font-black ${log.type === 'deposit' ? 'text-emerald-600' : 'text-red-500'}">
                  ${log.type === 'deposit' ? '+' : '-'} ${cur} ${Number(log.amount).toLocaleString()}
                </span>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

          <h3 class="text-sm font-bold text-charcoal">還沒有寫下任何回憶...</h3>
          <p class="text-xs text-stone-400 mt-1">點擊右上方「寫日誌」記錄旅程與上傳照片</p>
        </div>
      ` : (trip.journals || []).map(j => {
        const author = trip.members.find(m => m.id === j.authorId) || trip.members[0];
        return `
          <article class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-sageLight flex items-center justify-center text-lg">
                  ${author ? author.avatar : '📝'}
                </div>
                <div>
                  <div class="text-xs font-extrabold text-charcoal">${author ? escapeHtml(author.name) : '旅伴'}</div>
                  <div class="text-[10px] text-stone-400">${escapeHtml(j.date)}</div>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="guardEditAction(() => openModal('EDIT_JOURNAL', '${j.id}'))" class="text-stone-400 hover:text-sage p-1" title="編輯日誌">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button onclick="guardEditAction(() => deleteJournal('${j.id}'))" class="text-stone-300 hover:text-red-500 p-1" title="刪除日誌">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div>
              <h3 class="text-base font-extrabold text-charcoal mb-1.5">${escapeHtml(j.title)}</h3>
              <p class="text-xs text-stone-700 leading-relaxed whitespace-pre-line">${escapeHtml(j.content)}</p>
            </div>

            ${j.image ? `
              <img src="${j.image}" alt="${escapeHtml(j.title)}"
                onclick="openLightbox(['${j.image}'], 0)"
                onerror="this.style.display='none'"
                class="w-full h-52 object-cover rounded-2xl cursor-zoom-in border border-warmBorder" />
            ` : ''}

            <div class="pt-3 border-t border-warmBorder space-y-2.5">
              ${(j.comments || []).map(c => {
                const cm = trip.members.find(m => m.id === c.memberId);
                return `
                  <div class="bg-cream/80 rounded-2xl px-3 py-2 text-xs flex items-start gap-2">
                    <span class="text-sm">${cm ? cm.avatar : '💬'}</span>
                    <div class="flex-1">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-charcoal">${cm ? escapeHtml(cm.name) : '旅伴'}</span>
                        <span class="text-[10px] text-stone-400">${c.time || ''}</span>
                      </div>
                      <p class="text-stone-700 mt-0.5">${escapeHtml(c.text)}</p>
                    </div>
                  </div>
                `;
              }).join('')}

              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${trip.members.map(m => `
                  <button onclick="setJournalAuthor('${m.id}')"
                    class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border transition
                    ${activeAuthor?.id === m.id ? 'bg-sageLight border-sage text-sageDark' : 'bg-cream border-warmBorder text-stone-500'}">
                    <span>${m.avatar}</span>
                    <span>${escapeHtml(m.name)}</span>
                  </button>
                `).join('')}
              </div>

              <form onsubmit="submitJournalComment(event, '${j.id}')" class="flex items-center gap-2">
                <input type="text" id="j_comment_${j.id}"
                  placeholder="用 ${activeAuthor ? escapeHtml(activeAuthor.name) : '我'} 的身份留言..."
                  class="flex-1 bg-cream rounded-full px-3.5 py-2 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
                <button type="submit" class="w-8 h-8 rounded-full bg-sage text-white flex items-center justify-center shrink-0">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
              </form>
            </div>
          </article>
        `;
      }).join('')}
    </div>
  `;
}

function renderListsTab(trip) {
  const subTabs = [
    { id: 'TODO', label: '待辦', icon: 'check-circle-2' },
    { id: 'PACKING', label: '行李', icon: 'luggage' },
    { id: 'POCKET', label: '想去', icon: 'heart' },
    { id: 'DOCS', label: '文件', icon: 'folder-check' }
  ];

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <div class="grid grid-cols-4 gap-1.5 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">
        ${subTabs.map(st => {
          const active = uiState.listSubTab === st.id;
          return `
            <button onclick="setListSubTab('${st.id}')"
              class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition
              ${active ? 'bg-sage text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
              <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
              <span>${st.label}</span>
            </button>
          `;
        }).join('')}
      </div>

      ${uiState.listSubTab === 'TODO' ? renderTodoSubView(trip) : ''}
      ${uiState.listSubTab === 'PACKING' ? renderPackingSubView(trip) : ''}
      ${uiState.listSubTab === 'POCKET' ? renderPocketSubView(trip) : ''}
      ${uiState.listSubTab === 'DOCS' ? renderDocsSubView(trip) : ''}
    </div>
  `;
}

function renderTodoSubView(trip) {
  const me = trip.members.find(m => m.id === uiState.currentUserId) || trip.members[0];

  return `
    <div class="space-y-3">
      <div class="bg-white rounded-2xl px-3.5 py-2.5 border border-warmBorder flex items-center justify-between text-xs">
        <span class="text-stone-500 font-bold">👤 目前操作身分（留言將自動以此身分送出）：</span>
        <select onchange="setCurrentDeviceUser(this.value)" class="bg-sageLight text-sageDark font-extrabold px-2.5 py-1 rounded-xl border border-sage/30">
          ${trip.members.map(m => `<option value="${m.id}" ${m.id === me.id ? 'selected' : ''}>${m.avatar} ${escapeHtml(m.name)}</option>`).join('')}
        </select>
      </div>

      <form onsubmit="addTodoItem(event)" class="bg-white rounded-2xl p-3 border border-warmBorder shadow-sm space-y-2.5">
        <div class="flex items-center gap-2">
          <input type="text" id="new_todo_input" placeholder="新增待辦事項..."
            class="flex-1 bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder focus:outline-none" />
          <button type="submit" class="px-3.5 py-2 rounded-xl bg-sage hover:bg-sageDark text-white text-xs font-bold shrink-0">
            + 新增
          </button>
        </div>
        <div class="flex items-center flex-wrap gap-1.5 text-[11px]">
          <span class="text-stone-400 font-bold">指定人員：</span>
          ${trip.members.map(m => `
            <label class="inline-flex items-center gap-1 bg-cream px-2 py-1 rounded-full border border-warmBorder cursor-pointer">
              <input type="checkbox" name="todoAssignees" value="${m.id}" checked class="accent-[#5B7A58]" />
              <span>${m.avatar} ${escapeHtml(m.name)}</span>
            </label>
          `).join('')}
        </div>
      </form>

      ${(trip.todos || []).length === 0 ? `
        <div class="bg-white rounded-3xl p-10 text-center border border-warmBorder text-xs text-stone-400">
          這裡空空如也，新增第一項行前準備吧！
        </div>
      ` : (trip.todos || []).map(todo => {
        const targetIds = (todo.assignedTo && todo.assignedTo.length > 0) ? todo.assignedTo : trip.members.map(m => m.id);
        const targetMembers = trip.members.filter(m => targetIds.includes(m.id));
        const doneCount = (todo.completedBy || []).filter(id => targetIds.includes(id)).length;
        const comments = todo.comments || [];
        const isExpanded = !!uiState.expandedTodoComments[todo.id];

        return `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-full ${doneCount === targetMembers.length ? 'bg-sage text-white' : 'bg-sageLight text-sageDark'}">
                  ${doneCount}/${targetMembers.length}
                </span>
                <span class="text-[10px] font-bold bg-cream text-stone-500 px-2 py-0.5 rounded-full">
                  ${targetMembers.length === trip.members.length ? '全體' : `指定 ${targetMembers.length} 人`}
                </span>
                <h4 class="text-sm font-extrabold text-charcoal">${escapeHtml(todo.title)}</h4>
              </div>
              <button onclick="guardEditAction(() => deleteTodo('${todo.id}'))" class="text-stone-300 hover:text-red-500">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${targetMembers.map(m => {
                const isDone = (todo.completedBy || []).includes(m.id);
                return `
                  <button onclick="toggleTodoMember('${todo.id}', '${m.id}')"
                    class="px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border transition
                    ${isDone ? 'bg-sage text-white border-sage' : 'bg-cream text-stone-500 border-warmBorder hover:bg-creamDark'}">
                    <span>${isDone ? '✓' : m.avatar}</span>
                    <span>${escapeHtml(m.name)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="pt-1 border-t border-warmBorder/60">
              <button type="button" onclick="toggleTodoComments('${todo.id}')"
                class="text-[11px] font-bold text-sageDark bg-sageLight/70 px-2.5 py-1 rounded-full inline-flex items-center gap-1">
                <span>💬 進度留言 (${comments.length})</span>
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-3 h-3"></i>
              </button>

              ${isExpanded ? `
                <div class="space-y-1.5 mt-2">
                  ${comments.map(c => {
                    const cm = trip.members.find(m => m.id === c.memberId);
                    return `
                      <div class="bg-cream/80 rounded-xl px-3 py-1.5 text-xs flex items-center justify-between">
                        <span><b>${cm ? escapeHtml(cm.name) : '旅伴'}：</b>${escapeHtml(c.text)}</span>
                        <span class="text-[10px] text-stone-400">${c.time || ''}</span>
                      </div>
                    `;
                  }).join('')}
                  <form onsubmit="addTodoComment(event, '${todo.id}')" class="flex items-center gap-2 pt-1">
                    <input type="text" id="todo_comment_${todo.id}"
                      placeholder="以 ${escapeHtml(me.name)} 留言進度..."
                      class="flex-1 bg-cream rounded-full px-3 py-1.5 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
                    <button type="submit" class="w-7 h-7 rounded-full bg-sage text-white flex items-center justify-center shrink-0">
                      <i data-lucide="send" class="w-3 h-3"></i>
                    </button>
                  </form>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPackingSubView(trip) {
  const memberId = uiState.packingMemberId || trip.members[0]?.id;
  const activeMember = trip.members.find(m => m.id === memberId) || trip.members[0];
  const items = (trip.packing && trip.packing[memberId]) || [];
  const packedCount = items.filter(i => i.packed).length;
  const pct = items.length === 0 ? 0 : Math.round((packedCount / items.length) * 100);

  const categories = ['衣物', '盥洗用品', '3C 電子', '藥品保健', '證件財物', '其他'];

  return `
    <div class="space-y-3">
      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-charcoal">🧳 夥伴打包進度總覽</span>
          <button onclick="guardEditAction(() => openModal('PACKING_ALERT_MODAL'))"
            class="text-[11px] font-bold bg-terracottaLight text-terracotta px-2.5 py-1 rounded-full">
            ⚠️ 設定警示提醒
          </button>
        </div>
        ${trip.packingAlertNote ? `
          <div class="bg-terracottaLight/80 border border-orange-200 text-terracotta text-xs font-bold px-3 py-2 rounded-2xl flex items-center justify-between">
            <span>🔔 提醒：${escapeHtml(trip.packingAlertNote)}</span>
            <button onclick="guardEditAction(() => clearPackingAlert())" class="text-[10px] underline ml-2">清除</button>
          </div>
        ` : ''}
        <div class="grid grid-cols-2 gap-2">
          ${trip.members.map(m => {
            const list = (trip.packing && trip.packing[m.id]) || [];
            const done = list.filter(i => i.packed).length;
            const ratio = list.length === 0 ? 0 : Math.round((done / list.length) * 100);
            const isWarn = list.length > 0 && ratio < 100;
            return `
              <div onclick="setPackingMember('${m.id}')" class="bg-cream/80 rounded-2xl p-2.5 border ${isWarn ? 'border-orange-200' : 'border-warmBorder'} cursor-pointer">
                <div class="flex items-center justify-between text-xs font-bold">
                  <span>${m.avatar} ${escapeHtml(m.name)}</span>
                  <span class="${ratio === 100 && list.length > 0 ? 'text-sage' : 'text-terracotta'}">${ratio}%</span>
                </div>
                <div class="text-[10px] text-stone-400 mt-0.5">${list.length === 0 ? '尚未建立清單' : `已打包 ${done}/${list.length} 件`}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        ${trip.members.map(m => {
          const mItems = (trip.packing && trip.packing[m.id]) || [];
          const mDone = mItems.filter(i => i.packed).length;
          const isSelected = m.id === memberId;
          return `
            <button onclick="setPackingMember('${m.id}')"
              class="shrink-0 px-3.5 py-2.5 rounded-2xl border text-left transition
              ${isSelected ? 'bg-sage text-white border-sage shadow-sm' : 'bg-white text-charcoal border-warmBorder'}">
              <div class="flex items-center gap-1.5 font-bold text-xs">
                <span>${m.avatar}</span>
                <span>${escapeHtml(m.name)}</span>
              </div>
              <div class="text-[10px] mt-0.5 ${isSelected ? 'text-white/85' : 'text-stone-400'}">
                ${mItems.length === 0 ? '尚未新增' : `${mDone}/${mItems.length} 已打包`}
              </div>
            </button>
          `;
        }).join('')}
      </div>

      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <div>
            <div class="text-xs font-extrabold text-charcoal">${escapeHtml(activeMember.name)} 的行李打包完成度</div>
            <div class="text-[11px] text-stone-400">已打包 ${packedCount} / 共 ${items.length} 件物品</div>
          </div>
          <span class="text-lg font-black text-sage">${pct}%</span>
        </div>
        <div class="w-full h-2.5 bg-cream rounded-full overflow-hidden">
          <div class="h-full bg-sage rounded-full transition-all duration-300" style="width: ${pct}%"></div>
        </div>
      </div>

      ${categories.map(cat => {
        const catItems = items.filter(i => i.category === cat);
        const catDone = catItems.filter(i => i.packed).length;
        const catPct = catItems.length === 0 ? 0 : Math.round((catDone / catItems.length) * 100);

        return `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-charcoal">${cat}</span>
                <span class="text-[10px] font-bold bg-cream text-stone-500 px-2 py-0.5 rounded-full">
                  ${catItems.length === 0 ? '尚未新增' : `${catDone}/${catItems.length}`}
                </span>
              </div>
              ${catItems.length > 0 ? `<span class="text-xs font-extrabold text-sage">${catPct}%</span>` : ''}
            </div>

            <div class="space-y-1.5">
              ${catItems.map(item => `
                <div class="flex items-center justify-between py-1.5 px-2 rounded-xl hover:bg-cream/60 transition">
                  <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                    <input type="checkbox" ${item.packed ? 'checked' : ''}
                      onchange="togglePackingItem('${memberId}', '${item.id}')"
                      class="w-4 h-4 accent-[#5B7A58] rounded" />
                    <span class="text-xs font-medium ${item.packed ? 'line-through text-stone-400' : 'text-charcoal'}">
                      ${escapeHtml(item.name)}
                    </span>
                  </label>
                  <button onclick="guardEditAction(() => deletePackingItem('${memberId}', '${item.id}'))" class="text-stone-300 hover:text-red-500 p-1">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <form onsubmit="addPackingItem(event, '${memberId}', '${cat}')" class="flex items-center gap-2 pt-1">
              <input type="text" id="pk_input_${cat}" placeholder="+ 新增${cat}項目..."
                class="flex-1 bg-cream rounded-xl px-3 py-1.5 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
              <button type="submit" class="px-3 py-1.5 rounded-xl bg-sageLight hover:bg-sage hover:text-white text-sageDark text-xs font-bold transition">
                + 新增
              </button>
            </form>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPocketSubView(trip) {
  const list = trip.pocketList || [];
  const filtered = list.filter(item => {
    if (uiState.pocketTypeFilter !== 'ALL' && item.type !== uiState.pocketTypeFilter) return false;
    if (uiState.pocketStatusFilter !== 'ALL' && item.status !== uiState.pocketStatusFilter) return false;
    if (uiState.pocketSearch.trim()) {
      const q = uiState.pocketSearch.toLowerCase();
      return item.title.toLowerCase().includes(q) || (item.tag || '').toLowerCase().includes(q) || (item.notes || '').toLowerCase().includes(q);
    }
    return true;
  });

  return `
    <div class="space-y-3">
      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base font-extrabold text-charcoal">口袋名單筆記 <span class="text-xs font-medium text-stone-400">共 ${list.length} 項</span></h3>
          </div>
          <button onclick="guardEditAction(() => openModal('ADD_POCKET'))"
            class="bg-charcoal hover:bg-black text-white text-xs font-bold px-3.5 py-2 rounded-full flex items-center gap-1 transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>新增筆記</span>
          </button>
        </div>

        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" value="${escapeHtml(uiState.pocketSearch)}"
            oninput="setPocketSearch(this.value)"
            placeholder="搜尋口袋名單店名、標籤、備註..."
            class="w-full bg-cream rounded-2xl pl-9 pr-4 py-2 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          ${['ALL', '美食', '探索景點', '購物/伴手禮'].map(t => `
            <button onclick="setPocketTypeFilter('${t}')"
              class="shrink-0 px-3 py-1 rounded-full text-xs font-bold transition
              ${uiState.pocketTypeFilter === t ? 'bg-sage text-white' : 'bg-cream text-stone-600'}">
              ${t === 'ALL' ? '全部' : t}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="space-y-3">
        ${filtered.length === 0 ? `
          <div class="bg-white rounded-3xl p-10 text-center border border-warmBorder text-xs text-stone-400">
            沒有符合條件的口袋名單筆記
          </div>
        ` : filtered.map(item => `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">${escapeHtml(item.type)}</span>
                  ${item.tag ? `<span class="text-[10px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">${escapeHtml(item.tag)}</span>` : ''}
                  ${item.scheduledDay ? `<span class="text-[10px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">已排入 Day ${item.scheduledDay}</span>` : ''}
                </div>
                <h4 class="text-sm font-extrabold text-charcoal">${escapeHtml(item.title)}</h4>
              </div>
              <button onclick="guardEditAction(() => togglePocketStatus('${item.id}'))"
                class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full border transition
                ${item.status === '已去' ? 'bg-sage text-white border-sage' : 'bg-cream text-stone-600 border-warmBorder'}">
                ${item.status === '已去' ? '✓ 已去' : '想去'}
              </button>
            </div>

            ${item.notes ? `
              <p class="text-xs text-stone-600 leading-relaxed bg-cream/70 p-2.5 rounded-2xl">${escapeHtml(item.notes)}</p>
            ` : ''}

            <div class="flex items-center justify-between pt-2 border-t border-warmBorder/60 gap-2">
              <div class="flex items-center gap-1.5">
                <select onchange="if(this.value !== '') { const v = Number(this.value); this.value = ''; guardEditAction(() => schedulePocketToDay('${item.id}', v)); }"
                  class="bg-sageLight text-sageDark font-extrabold text-[11px] px-2.5 py-1.5 rounded-xl border border-sage/30 focus:outline-none cursor-pointer">
                  <option value="">📅 一鍵排入行程...</option>
                  ${trip.days.map((d, dIdx) => `
                    <option value="${dIdx}">排入 Day ${dIdx + 1} (${formatDateParts(d.date).md})</option>
                  `).join('')}
                </select>
              </div>

              <div class="flex items-center gap-2.5 text-xs">
                ${item.mapUrl ? `
                  <a href="${escapeHtml(item.mapUrl)}" target="_blank"
                    class="inline-flex items-center gap-1 text-sage font-bold hover:underline">
                    <i data-lucide="navigation" class="w-3 h-3"></i>
                    <span>導航</span>
                  </a>
                ` : ''}
                <button onclick="guardEditAction(() => deletePocketItem('${item.id}'))" class="text-stone-300 hover:text-red-500">
