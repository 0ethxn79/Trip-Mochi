<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>旅遊手冊與分帳記帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f3f1ea;
      color: #2f332c;
      -webkit-tap-highlight-color: transparent;
    }
    .card-surface {
      background-color: #faf9f5;
      border: 1px solid #e6e2d6;
      border-radius: 1.25rem;
    }
    .btn-primary {
      background-color: #4f6f52;
      color: #ffffff;
    }
    .btn-primary:active {
      background-color: #3e5841;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .drag-over {
      border: 2px dashed #4f6f52 !important;
      background-color: #eef3ee !important;
    }
  </style>
</head>
<body class="min-h-screen pb-24">
  <div id="app" class="max-w-md mx-auto min-h-screen px-4 pt-4"></div>

  <!-- 通用 Modal 容器 -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/45 p-0 sm:p-4">
    <div id="modal-box" class="bg-[#faf9f5] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[88vh] overflow-y-auto shadow-xl border border-[#e6e2d6]"></div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-[60] hidden bg-[#2f332c] text-white text-sm px-4 py-2.5 rounded-full shadow-lg transition-opacity"></div>

  <script>
    const STORAGE_KEY = 'travel_handbook_v2_data';

    const DEFAULT_STATE = {
      activeTab: 'list', // 'itinerary' | 'list' | 'journal' | 'expense'
      tripInfo: {
        title: '廣島・山陽 6日旅遊手冊範本',
        icon: '⛩️',
        code: 'HIJ319',
        startDate: '2027-03-19',
        endDate: '2027-03-24',
        baseCurrency: 'TWD',
        rates: {
          TWD: 1,
          JPY: 0.215,
          KRW: 0.024,
          USD: 32.5
        },
        customCurrencies: []
      },
      // 身分綁定（本機瀏覽器代表「我」是哪位成員，用於待辦留言防冒名與預設操作者）
      currentUserId: 'm1',
      members: [
        { id: 'm1', name: '我', avatar: '🐯' },
        { id: 'm2', name: '鄭聿宸', avatar: '🦊' }
      ],
      itinerary: [
        {
          id: 'it1',
          day: 1,
          date: '2027-03-19',
          time: '11:30',
          title: '抵達廣島機場 → 廣島市區',
          category: '交通',
          note: '搭乘利木津巴士前往廣島站新幹線口'
        },
        {
          id: 'it2',
          day: 1,
          date: '2027-03-19',
          time: '15:00',
          title: '廣島和平紀念公園＆原爆圓頂館',
          category: '景點',
          note: '傍晚散步至本通商店街吃廣島燒'
        }
      ],
      listSubTab: 'docs', // 'todo' | 'luggage' | 'wishlist' | 'docs'
      // 4. 文件母項目可自定義
      docCategories: ['入境資料', '簽證', '保險', '訂單'],
      activeDocCategory: '全部',
      documents: [],
      // 5. 行李清單（支援多人打包狀態 + 警示提醒）
      luggageFilterMemberId: 'm1',
      luggageItems: [
        {
          id: 'lug1',
          name: '護照正本（效期6個月以上）',
          category: '隨身重要',
          alertNote: '出發前務必再次確認是否在隨身包！',
          packedBy: { m1: true, m2: false }
        },
        {
          id: 'lug2',
          name: 'Visit Japan Web QR Code 截圖',
          category: '隨身重要',
          alertNote: '建議存離線相簿避免機場網路不穩',
          packedBy: { m1: true, m2: true }
        },
        {
          id: 'lug3',
          name: '行動電源（限隨身登機）',
          category: '3C配件',
          alertNote: '嚴禁託運！需標示瓦時數',
          packedBy: { m1: false, m2: false }
        }
      ],
      // 6. 待辦事項（支援指定人物、留言收合、限定本人身分留言）
      todos: [
        {
          id: 'td1',
          title: '預訂宮島渡輪與嚴島神社參拜時間確認',
          assigneeId: 'm2', // 'all' 或成員 id
          done: false,
          commentsExpanded: false,
          comments: [
            { id: 'c1', authorId: 'm2', text: '已查好潮汐時間，上午滿潮拍大鳥居最美', createdAt: '11/19 14:20' }
          ]
        },
        {
          id: 'td2',
          title: '購買日本網卡 / 開通漫遊',
          assigneeId: 'all',
          done: false,
          commentsExpanded: false,
          comments: []
        }
      ],
      wishlist: [
        { id: 'w1', title: '尾道千光寺纜車＆貓之細道', category: '景點', note: '下午光線最適合拍照' },
        { id: 'w2', title: '廣島牡蠣屋 烤牡蠣定食', category: '美食', note: '宮島表參道商店街內' }
      ],
      // 7. 日誌（支援完成後再次編輯）
      journals: [
        {
          id: 'jn1',
          date: '2027-03-19',
          title: '第一天抵達廣島，廣島燒超滿足！',
          content: '天氣微涼很舒服，晚餐吃了車站旁的麗ちゃん廣島燒，麵條焦香搭配特製醬汁非常推薦。',
          authorId: 'm1',
          updatedAt: '2027-03-19 21:30'
        }
      ],
      // 8 & 9 & 10. 記帳、外幣現金、公費管理
      expenseSubTab: 'split', // 'split' | 'cash' | 'pool'
      expenseFilterMemberId: 'all', // 'all' 或成員 id
      expenses: [
        {
          id: 'ex1',
          date: '2027-03-21',
          category: '餐飲',
          title: '廣島燒＆牡蠣晚餐',
          amount: 16161,
          currency: 'JPY',
          payMethod: '現金支付',
          paidBy: 'm2',
          splitWith: ['m2']
        },
        {
          id: 'ex2',
          date: '2027-03-21',
          category: '餐飲',
          title: '宮島商店街小吃',
          amount: 10000,
          currency: 'JPY',
          payMethod: '現金支付',
          paidBy: 'm1',
          splitWith: ['m1', 'm2']
        }
      ],
      // 9. 外幣現金袋
      cashWallets: [
        { id: 'cw1', currency: 'JPY', initialAmount: 80000, note: '出發前台灣銀行換匯' },
        { id: 'cw2', currency: 'KRW', initialAmount: 0, note: '' },
        { id: 'cw3', currency: 'USD', initialAmount: 200, note: '備用美金' }
      ],
      // 8. 公費管理（支援多幣別入金 + 保管人）
      publicPoolDeposits: [
        {
          id: 'pd1',
          date: '2027-03-19',
          contributorId: 'm1',
          custodianId: 'm1',
          currency: 'TWD',
          amount: 5000,
          note: '出發前公費繳交'
        },
        {
          id: 'pd2',
          date: '2027-03-19',
          contributorId: 'm2',
          custodianId: 'm2',
          currency: 'JPY',
          amount: 25000,
          note: '日幣現金公費（由鄭聿宸保管）'
        }
      ]
    };

    let state = loadState();
    let dragMemberIndex = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          tripInfo: {
            ...structuredClone(DEFAULT_STATE.tripInfo),
            ...(parsed.tripInfo || {}),
            rates: {
              ...DEFAULT_STATE.tripInfo.rates,
              ...((parsed.tripInfo && parsed.tripInfo.rates) || {})
            }
          }
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || { id, name: '未知成員', avatar: '👤' };
    }

    function getCurrentUser() {
      return getMember(state.currentUserId) || state.members[0];
    }

    function toTWD(amount, currency) {
      if (currency === 'TWD') return Number(amount) || 0;
      const rate = Number(state.tripInfo.rates[currency]) || 1;
      return Math.round((Number(amount) || 0) * rate);
    }

    function getAllCurrencies() {
      const base = ['TWD', 'JPY', 'KRW', 'USD'];
      const extra = Object.keys(state.tripInfo.rates || {}).filter(c => !base.includes(c));
      return [...base, ...extra];
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    // 1. 自動抓取最新匯率（使用免費免金鑰公開匯率 API，換算為 1 外幣 = ? TWD）
    async function fetchLatestRates() {
      const btn = document.getElementById('btn-fetch-rates');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>抓取中...';
      }
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates) {
          const currencies = getAllCurrencies().filter(c => c !== 'TWD');
          let updatedCount = 0;
          currencies.forEach(code => {
            if (data.rates[code] && data.rates[code] > 0) {
              // data.rates[code] 是 1 TWD 等於多少外幣，反過來 1 外幣 = 1 / rate TWD
              const twdPerUnit = Number((1 / data.rates[code]).toFixed(4));
              state.tripInfo.rates[code] = twdPerUnit;
              const inputEl = document.getElementById(`rate-input-${code}`);
              if (inputEl) inputEl.value = twdPerUnit;
              updatedCount++;
            }
          });
          saveState();
          showToast(`已更新 ${updatedCount} 種幣別最新匯率！`);
        } else {
          throw new Error('API 回傳格式異常');
        }
      } catch (err) {
        showToast('自動抓取失敗，請檢查網路或手動輸入匯率');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i>自動抓取最新匯率';
        }
      }
    }

    // 行程設定與成員管理 Modal（含 1.匯率自動/手動、2.自訂表情圖案、3.拖移排序且右上角不顯示過多頭像）
    function openSettingsModal() {
      const currencies = getAllCurrencies().filter(c => c !== 'TWD');
      const presetEmojis = ['🐯', '🦊', '🐻', '🐰', '🐶', '🐱', '🐼', '🐨', '🦁', '🐸', '🐧', '🦄'];

      const membersHtml = state.members.map((m, idx) => `
        <div draggable="true"
             ondragstart="handleMemberDragStart(event, ${idx})"
             ondragover="handleMemberDragOver(event)"
             ondragleave="handleMemberDragLeave(event)"
             ondrop="handleMemberDrop(event, ${idx})"
             class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-2xl px-3 py-2.5 mb-2 cursor-move transition">
          <div class="flex items-center gap-2.5">
            <i class="fa-solid fa-grip-vertical text-gray-400 text-xs"></i>
            <span class="text-xl w-8 h-8 flex items-center justify-center bg-[#f3f1ea] rounded-full">${m.avatar}</span>
            <div>
              <div class="font-semibold text-sm flex items-center gap-1.5">
                ${m.name}
                ${state.currentUserId === m.id ? '<span class="text-[11px] bg-[#e6efe7] text-[#4f6f52] px-2 py-0.5 rounded-full">目前本機身分</span>' : ''}
              </div>
              <div class="text-[11px] text-gray-400">可上下拖移調整順序</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="moveMember(${idx}, -1)" class="p-1.5 text-gray-400 hover:text-gray-700" title="上移"><i class="fa-solid fa-arrow-up text-xs"></i></button>
            <button onclick="moveMember(${idx}, 1)" class="p-1.5 text-gray-400 hover:text-gray-700" title="下移"><i class="fa-solid fa-arrow-down text-xs"></i></button>
            ${state.members.length > 1 ? `<button onclick="removeMember('${m.id}')" class="p-1.5 text-red-400 hover:text-red-600" title="刪除"><i class="fa-solid fa-trash-can text-xs"></i></button>` : ''}
          </div>
        </div>
      `).join('');

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold">⚙️ 行程與系統設定</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#f3f1ea] flex items-center justify-center text-gray-500">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="space-y-5 text-sm">
          <!-- 基本資訊 -->
          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="font-bold text-[#4f6f52]">手冊基本資訊</div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">手冊名稱</label>
              <input id="set-title" type="text" value="${state.tripInfo.title}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-[#faf9f5]" />
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">本機操作身分（待辦留言將鎖定此身分）</label>
              <select id="set-current-user" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-[#faf9f5]">
                ${state.members.map(m => `<option value="${m.id}" ${m.id === state.currentUserId ? 'selected' : ''}>${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
          </div>

          <!-- 1. 匯率設定：自動抓取 + 手動保留 -->
          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="flex items-center justify-between">
              <div class="font-bold text-[#4f6f52]">💱 匯率設定（1 外幣 = ? TWD）</div>
              <button id="btn-fetch-rates" onclick="fetchLatestRates()" class="text-xs bg-[#e6efe7] text-[#4f6f52] font-semibold px-3 py-1.5 rounded-full hover:bg-[#d7e6d9]">
                <i class="fa-solid fa-rotate mr-1"></i>自動抓取最新匯率
              </button>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              ${currencies.map(code => `
                <div class="bg-[#faf9f5] border border-[#e6e2d6] rounded-xl p-2.5">
                  <label class="text-xs font-semibold text-gray-600 block mb-1">${code} → TWD</label>
                  <input id="rate-input-${code}" type="number" step="0.0001" value="${state.tripInfo.rates[code] || ''}" class="w-full border border-[#e6e2d6] rounded-lg px-2.5 py-1.5 bg-white text-sm" />
                </div>
              `).join('')}
            </div>
            <div class="flex gap-2 pt-1">
              <input id="new-rate-code" type="text" maxlength="5" placeholder="新增幣別代碼 如 EUR / THB" class="flex-1 border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs uppercase bg-[#faf9f5]" />
              <input id="new-rate-val" type="number" step="0.0001" placeholder="對台幣匯率" class="w-28 border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs bg-[#faf9f5]" />
              <button onclick="addCustomCurrencyRate()" class="px-3 py-1.5 rounded-xl bg-[#4f6f52] text-white text-xs font-semibold">新增</button>
            </div>
          </div>

          <!-- 2 & 3. 成員管理（自訂貼入 Emoji + 拖移排序） -->
          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="flex items-center justify-between">
              <div class="font-bold text-[#4f6f52]">👥 旅伴成員管理（共 ${state.members.length} 人）</div>
              <span class="text-[11px] text-gray-400">拖移或箭頭調整順序</span>
            </div>
            <div id="member-list-container">
              ${membersHtml}
            </div>
            <div class="pt-2 border-t border-[#e6e2d6] space-y-2">
              <div class="text-xs font-semibold text-gray-600">新增旅伴成員（可貼入手機任意表情符號）</div>
              <div class="flex gap-2">
                <input id="new-member-avatar" type="text" value="🐶" maxlength="4" placeholder="貼入Emoji" class="w-16 text-center text-xl border border-[#e6e2d6] rounded-xl py-1.5 bg-[#faf9f5]" />
                <input id="new-member-name" type="text" placeholder="輸入旅伴名稱" class="flex-1 border border-[#e6e2d6] rounded-xl px-3 py-1.5 bg-[#faf9f5]" />
                <button onclick="addMember()" class="px-4 py-1.5 rounded-xl btn-primary text-xs font-semibold">新增</button>
              </div>
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${presetEmojis.map(em => `
                  <button type="button" onclick="document.getElementById('new-member-avatar').value='${em}'" class="w-8 h-8 rounded-lg bg-[#f3f1ea] hover:bg-[#e6e2d6] text-base flex items-center justify-center">${em}</button>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- JSON 備份與還原 -->
          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-2.5">
            <div class="font-bold text-[#4f6f52]">💾 資料備份與還原（JSON）</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="exportJsonBackup()" class="py-2 px-3 rounded-xl border border-[#4f6f52] text-[#4f6f52] font-semibold text-xs">
                <i class="fa-solid fa-download mr-1"></i>匯出備份檔
              </button>
              <label class="py-2 px-3 rounded-xl bg-[#f3f1ea] text-gray-700 font-semibold text-xs text-center cursor-pointer">
                <i class="fa-solid fa-upload mr-1"></i>匯入還原檔
                <input type="file" accept=".json" onchange="importJsonBackup(event)" class="hidden" />
              </label>
            </div>
          </div>

          <button onclick="saveSettings()" class="w-full py-3 rounded-2xl btn-primary font-bold text-sm shadow">
            儲存設定
          </button>
        </div>
      `);
    }

    function addCustomCurrencyRate() {
      const code = (document.getElementById('new-rate-code').value || '').trim().toUpperCase();
      const val = parseFloat(document.getElementById('new-rate-val').value);
      if (!code || isNaN(val) || val <= 0) {
        showToast('請輸入正確的幣別代碼與匯率');
        return;
      }
      state.tripInfo.rates[code] = val;
      saveState();
      openSettingsModal();
      showToast(`已新增 ${code} 匯率`);
    }

    function addMember() {
      const avatar = (document.getElementById('new-member-avatar').value || '🙂').trim();
      const name = (document.getElementById('new-member-name').value || '').trim();
      if (!name) {
        showToast('請輸入旅伴名稱');
        return;
      }
      const newId = 'm_' + Date.now();
      state.members.push({ id: newId, name, avatar: avatar || '🙂' });
      // 同步初始化行李打包欄位
      state.luggageItems.forEach(item => {
        if (!item.packedBy) item.packedBy = {};
        item.packedBy[newId] = false;
      });
      saveState();
      openSettingsModal();
      render();
      showToast(`已新增旅伴「${name}」`);
    }

    function removeMember(id) {
      if (state.members.length <= 1) return;
      state.members = state.members.filter(m => m.id !== id);
      if (state.currentUserId === id) {
        state.currentUserId = state.members[0].id;
      }
      saveState();
      openSettingsModal();
      render();
    }

    function moveMember(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= state.members.length) return;
      const temp = state.members[index];
      state.members[index] = state.members[target];
      state.members[target] = temp;
      saveState();
      openSettingsModal();
      render();
    }

    function handleMemberDragStart(e, index) {
      dragMemberIndex = index;
      e.dataTransfer.effectAllowed = 'move';
    }
    function handleMemberDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }
    function handleMemberDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function handleMemberDrop(e, targetIndex) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (dragMemberIndex === null || dragMemberIndex === targetIndex) return;
      const moved = state.members.splice(dragMemberIndex, 1)[0];
      state.members.splice(targetIndex, 0, moved);
      dragMemberIndex = null;
      saveState();
      openSettingsModal();
      render();
    }

    function saveSettings() {
      const title = document.getElementById('set-title').value.trim();
      if (title) state.tripInfo.title = title;
      state.currentUserId = document.getElementById('set-current-user').value;

      const currencies = getAllCurrencies().filter(c => c !== 'TWD');
      currencies.forEach(code => {
        const el = document.getElementById(`rate-input-${code}`);
        if (el) {
          const v = parseFloat(el.value);
          if (!isNaN(v) && v > 0) state.tripInfo.rates[code] = v;
        }
      });

      saveState();
      closeModal();
      render();
      showToast('設定已儲存');
    }

    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.tripInfo.title || '旅遊手冊'}_備份.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已匯出 JSON 備份檔');
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.tripInfo || !imported.members) throw new Error('格式不符');
          state = { ...structuredClone(DEFAULT_STATE), ...imported };
          saveState();
          closeModal();
          render();
          showToast('備份還原成功！');
        } catch (err) {
          showToast('匯入失敗：檔案格式不正確');
        }
      };
      reader.readAsText(file);
    }

    function shareSummaryText() {
      const text = `【${state.tripInfo.title}】\n行程代碼：${state.tripInfo.code}\n旅伴：${state.members.map(m => m.avatar + m.name).join('、')}\n總支出筆數：${state.expenses.length} 筆`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('已複製行程摘要文字'));
      } else {
        showToast('已準備好分享摘要');
      }
    }

    // ==================== 清單分頁（4. 自定義文件母項目、5. 行李看夥伴進度+警示、6. 待辦指定人+收合+IP/身分鎖定留言） ====================

        <div class="bg-white border border-[#e6e2d6] rounded-full p-1 grid grid-cols-4 gap-1 mb-4">
          ${subTabs.map(t => {
            const active = state.listSubTab === t.id;
            return `
              <button onclick="state.listSubTab='${t.id}'; saveState(); render();"

      let contentHtml = '';

      if (state.listSubTab === 'docs') {

        contentHtml = `
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-3">
            ${categories.map(cat => {
              const active = state.activeDocCategory === cat;

                <button onclick="state.activeDocCategory='${cat}'; saveState(); render();"

            <div class="card-surface py-12 px-6 text-center">

                <i class="fa-regular fa-folder-open"></i>
              </div>
              <div class="font-bold text-base mb-1">尚無${state.activeDocCategory === '全部' ? '' : state.activeDocCategory}資料或文件</div>
              <div class="text-xs text-gray-400">可記錄護照效期、保險單號、訂房確認碼或自訂分類文件</div>

            <div class="space-y-2.5">

                <div class="card-surface p-4">

                      <div class="font-bold text-sm">${doc.title}</div>

                      ${doc.expiry ? `<div class="text-xs text-amber-700 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>到期/日期：${doc.expiry}</div>` : ''}

                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }

      // 5. 行李清單（查看所有夥伴打包狀況 + 新增警示提醒）
      if (state.listSubTab === 'luggage') {
        const viewingMemberId = state.luggageFilterMemberId || state.currentUserId;
        const viewingMember = getMember(viewingMemberId);
        const packedCount = state.luggageItems.filter(i => i.packedBy && i.packedBy[viewingMemberId]).length;

        contentHtml = `
          <!-- 切換查看哪位夥伴的行李進度 -->

            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-gray-600">查看夥伴打包狀況</span>
              <span class="text-xs font-semibold text-[#4f6f52]">${viewingMember.avatar} ${viewingMember.name}：${packedCount}/${state.luggageItems.length} 已打包</span>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${state.members.map(m => {

                const active = viewingMemberId === m.id;
                return `
                  <button onclick="state.luggageFilterMemberId='${m.id}'; saveState(); render();"

                    <span>${m.avatar} ${m.name}</span>
                    <span class="text-[11px] opacity-85">(${mPacked}/${state.luggageItems.length})</span>

          <button onclick="openAddLuggageModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">

                      <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleLuggagePack('${item.id}', '${viewingMemberId}')"

                        </div>
                        ${item.alertNote ? `

                            <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
                            <span>${item.alertNote}</span>
                          </div>

                        <!-- 全體旅伴打包狀態一覽 -->
                        <div class="mt-2 flex flex-wrap gap-1.5">
                          ${state.members.map(m => {
                            const ok = !!(item.packedBy && item.packedBy[m.id]);
                            return `
                              <span class="text-[11px] px-2 py-0.5 rounded-full border ${ok ? 'bg-[#e6efe7] border-[#cde0cf] text-[#3d5a40]' : 'bg-white border-[#e6e2d6] text-gray-400'}">
                                ${m.avatar} ${m.name} ${ok ? '✓' : '未收'}
                              </span>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    </label>
                    <div class="flex items-center gap-1">
                      <button onclick="openEditLuggageAlertModal('${item.id}')" class="text-xs text-amber-600 px-1.5 py-1" title="編輯警示提醒">
                        <i class="fa-solid fa-bell"></i>
                      </button>
                      <button onclick="deleteLuggageItem('${item.id}')" class="text-xs text-red-400 px-1.5 py-1">刪除</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // 6. 待辦事項（支援指定人物 + 留言進度收合 + 限定自己本機身分留言）
      if (state.listSubTab === 'todo') {
        const me = getCurrentUser();
        contentHtml = `
          <div class="flex items-center justify-between bg-[#e6efe7] text-[#3d5a40] px-3.5 py-2 rounded-2xl text-xs mb-3">

          </div>

          </button>

          <div class="space-y-3">
            ${state.todos.map(td => {
              const assignee = td.assigneeId === 'all' ? null : getMember(td.assigneeId);
              const comments = td.comments || [];
              return `
                <div class="card-surface p-4">
                  <div class="flex items-start justify-between gap-2">
                    <label class="flex items-start gap-2.5 cursor-pointer flex-1">
                      <input type="checkbox" ${td.done ? 'checked' : ''} onchange="toggleTodo('${td.id}')"
                        class="mt-1 w-4 h-4 accent-[#4f6f52]" />
                      <div>
                        <div class="font-bold text-sm ${td.done ? 'line-through text-gray-400' : ''}">${td.title}</div>
                        <div class="mt-1 flex items-center gap-2">

                            ? `<span class="text-[11px] bg-[#f3f1ea] border border-[#e6e2d6] px-2.5 py-0.5 rounded-full font-medium">負責人：${assignee.avatar} ${assignee.name}</span>`

                            <div class="bg-white border border-[#e6e2d6] rounded-xl px-3 py-2 text-xs">

      // 想去清單
      if (state.listSubTab === 'wishlist') {
        contentHtml = `
          <button onclick="openAddWishlistModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">

            ${state.wishlist.map(w => `

      return subNavHtml + contentHtml;
    }

    // ==================== 4, 5, 6 相關操作與 Modal ====================
    function openAddDocCategoryModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">自定義文件母項目分類</h3>
        <div class="space-y-3 text-sm">
          <div>
            <label class="text-xs text-gray-500 block mb-1">分類名稱（如：交通票券、門票憑證、租車資料）</label>
            <input id="custom-doc-cat" type="text" placeholder="輸入新分類名稱" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${state.docCategories.map(c => `
              <span class="text-xs bg-white border border-[#e6e2d6] px-2.5 py-1 rounded-full flex items-center gap-1.5">
                ${c}
                <button onclick="removeDocCategory('${c}')" class="text-red-400 hover:text-red-600">×</button>
              </span>
            `).join('')}
          </div>
          <button onclick="saveNewDocCategory()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">新增分類</button>
        </div>
      `);
    }

    function saveNewDocCategory() {
      const name = (document.getElementById('custom-doc-cat').value || '').trim();
      if (!name) return showToast('請輸入分類名稱');
      if (!state.docCategories.includes(name)) {
        state.docCategories.push(name);
        state.activeDocCategory = name;
        saveState();
      }
      closeModal();
      render();
      showToast(`已新增「${name}」分類`);
    }

    function removeDocCategory(cat) {
      state.docCategories = state.docCategories.filter(c => c !== cat);
      if (state.activeDocCategory === cat) state.activeDocCategory = '全部';
      saveState();
      openAddDocCategoryModal();
      render();
    }

      openModal(`

        <div class="space-y-3 text-sm">
          <div>
            <label class="text-xs text-gray-500 block mb-1">所屬分類（或直接輸入新分類）</label>
            <input id="doc-cat-input" list="doc-cat-list" value="${state.activeDocCategory !== '全部' ? state.activeDocCategory : state.docCategories[0] || ''}"
              class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" placeholder="選擇或直接輸入新母項目" />
            <datalist id="doc-cat-list">
              ${state.docCategories.map(c => `<option value="${c}">`).join('')}
            </datalist>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">文件名稱</label>
            <input id="doc-title" type="text" placeholder="例如：富邦旅平險保單 / 廣島飯店訂房" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />

          <div>
            <label class="text-xs text-gray-500 block mb-1">單號 / 確認碼（選填）</label>
            <input id="doc-ref" type="text" placeholder="例如：INS-20270319" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">到期日 / 使用日期（選填）</label>
            <input id="doc-expiry" type="date" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />

      `);

    function saveJournal(editId) {
      const title = document.getElementById('jn-title').value.trim();
      const content = document.getElementById('jn-content').value.trim();
      if (!title) return showToast('請輸入日誌標題');
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      if (editId) {
        const target = state.journals.find(j => j.id === editId);
        if (target) {
          target.date = document.getElementById('jn-date').value;
          target.title = title;
          target.content = content;
          target.updatedAt = stamp;
        }
        showToast('日誌已更新');
      } else {
        state.journals.unshift({
          id: 'jn_' + Date.now(),
          date: document.getElementById('jn-date').value,
          title,
          content,
          authorId: state.currentUserId,
          updatedAt: stamp
        });
        showToast('日誌已儲存');
      }
      saveState();
      closeModal();
      render();
    }

    function renderExpenseTab() {
      const subTabs = [
        { id: 'split', icon: 'fa-solid fa-file-invoice-dollar', label: '分帳總覽' },
        { id: 'cash', icon: 'fa-solid fa-money-bill-wave', label: '外幣現金' },
        { id: 'pool', icon: 'fa-solid fa-piggy-bank', label: '公費管理' }
      ];

      const navHtml = `
        <div class="bg-white border border-[#e6e2d6] rounded-full p-1 grid grid-cols-3 gap-1 mb-4">
          ${subTabs.map(t => {
            const active = state.expenseSubTab === t.id;
            return `
              <button onclick="state.expenseSubTab='${t.id}'; saveState(); render();"
                class="py-2 rounded-full text-xs font-semibold flex items-center justify-center gap-1.5 transition ${active ? 'bg-[#232720] text-white shadow-xs' : 'text-gray-600'}">
                <i class="${t.icon}"></i> ${t.label}
              </button>
            `;
          }).join('')}
        </div>
      `;

      // 10. 修復篩選 Bug：點選某人（例如鄭聿宸）時，只篩選「由該成員先付（paidBy === filterId）」的支出明細與對應總額
      if (state.expenseSubTab === 'split') {
        const filterId = state.expenseFilterMemberId || 'all';
        const filteredExpenses = filterId === 'all'
          ? state.expenses
          : state.expenses.filter(ex => ex.paidBy === filterId);

        const totalTWD = filteredExpenses.reduce((sum, ex) => sum + toTWD(ex.amount, ex.currency), 0);
        const avgPerMember = state.members.length > 0 ? Math.round(totalTWD / state.members.length) : totalTWD;
        const filterMember = filterId !== 'all' ? getMember(filterId) : null;

        return navHtml + `
          <div class="grid grid-cols-2 gap-2.5 mb-3">
            <button onclick="openAddExpenseModal()" class="py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-1.5 shadow-xs">
              <i class="fa-solid fa-circle-plus"></i> 新增支出
            </button>
            <button onclick="openSettlementModal()" class="py-3 rounded-2xl bg-white border border-[#e6e2d6] text-gray-800 font-semibold text-sm flex items-center justify-center gap-1.5">
              <i class="fa-solid fa-scale-balanced"></i> 結算建議
            </button>
          </div>

          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-3">
            <button onclick="state.expenseFilterMemberId='all'; saveState(); render();"
              class="px-3.5 py-1.5 rounded-full text-xs font-semibold border whitespace-nowrap ${filterId === 'all' ? 'btn-primary border-[#4f6f52]' : 'bg-white border-[#e6e2d6] text-gray-700'}">
              全部
            </button>
            ${state.members.map(m => `
              <button onclick="state.expenseFilterMemberId='${m.id}'; saveState(); render();"
                class="px-3.5 py-1.5 rounded-full text-xs font-semibold border whitespace-nowrap ${filterId === m.id ? 'btn-primary border-[#4f6f52]' : 'bg-white border-[#e6e2d6] text-gray-700'}">
                ${m.avatar} ${m.name}
              </button>
            `).join('')}
          </div>

          <!-- 綠色總覽卡片 -->
          <div class="rounded-3xl bg-[#4f6f52] text-white p-5 mb-4 shadow-sm">
            <div class="text-xs opacity-85 mb-1">
              ${filterMember ? `${filterMember.avatar} ${filterMember.name} 先付總支出 (TWD)` : '分帳總支出 (TWD)'}
            </div>
            <div class="text-3xl font-bold tracking-tight mb-4">NT$ ${totalTWD.toLocaleString()}</div>
            <div class="pt-3 border-t border-white/20 flex items-center justify-between text-xs opacity-90">
              <span>共 ${filteredExpenses.length} 筆支出紀錄</span>
              <span>${filterMember ? '僅統計該成員先付項目' : `平均每人 NT$ ${avgPerMember.toLocaleString()}`}</span>
            </div>
          </div>

          <div class="font-bold text-sm mb-2.5 text-gray-700">
            ${filterMember ? `${filterMember.name} 的先付明細` : '支出明細'}
          </div>

          <div class="space-y-2.5">
            ${filteredExpenses.length === 0 ? `
              <div class="card-surface p-8 text-center text-xs text-gray-400">目前沒有符合條件的支出紀錄</div>
            ` : filteredExpenses.map(ex => {
              const payer = getMember(ex.paidBy);
              const twdVal = toTWD(ex.amount, ex.currency);
              return `
                <div class="card-surface p-4 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">

                    </div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="font-bold text-base">NT$ ${twdVal.toLocaleString()}</div>
                    ${ex.currency !== 'TWD' ? `<div class="text-xs text-gray-400">${ex.currency} ${Number(ex.amount).toLocaleString()}</div>` : ''}
                    <button onclick="deleteExpense('${ex.id}')" class="text-xs text-red-400 hover:text-red-600 mt-1">刪除</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // 9. 外幣現金（預設 JPY/KRW/USD，另可手動輸入任意指定幣別）

        return navHtml + `
          <button onclick="openAddCashWalletModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">

              const spentCash = state.expenses
                .filter(ex => ex.currency === cw.currency && ex.payMethod === '現金支付')

              const remaining = Number(cw.initialAmount) - spentCash;
              return `
                <div class="card-surface p-4">
                  <div class="flex items-center justify-between mb-2">

                    <button onclick="deleteCashWallet('${cw.id}')" class="text-xs text-red-400">刪除</button>
                  </div>
                  <div class="grid grid-cols-3 gap-2 text-center bg-white border border-[#e6e2d6] rounded-2xl p-3">
                    <div>
                      <div class="text-[11px] text-gray-400">初始換匯</div>
                      <div class="font-bold text-sm mt-0.5">${Number(cw.initialAmount).toLocaleString()}</div>
                    </div>
                    <div>
                      <div class="text-[11px] text-gray-400">現金已花費</div>
                      <div class="font-bold text-sm text-amber-700 mt-0.5">-${spentCash.toLocaleString()}</div>
                    </div>
                    <div>
                      <div class="text-[11px] text-gray-400">剩餘現金</div>
                      <div class="font-bold text-sm text-[#4f6f52] mt-0.5">${remaining.toLocaleString()}</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // 8. 公費管理（支援指定外幣入金 + 設定保管人）
      if (state.expenseSubTab === 'pool') {
        // 依幣別與保管人統計公費餘額
        const byCurrency = {};
        const byCustodian = {};

        state.publicPoolDeposits.forEach(dep => {
          byCurrency[dep.currency] = (byCurrency[dep.currency] || 0) + Number(dep.amount);
          const key = `${dep.custodianId}_${dep.currency}`;
          byCustodian[key] = (byCustodian[key] || 0) + Number(dep.amount);
        });

        // 若支出選用「公費支付」則扣除對應幣別公費
        state.expenses
          .filter(ex => ex.payMethod === '公費支付')
          .forEach(ex => {
            byCurrency[ex.currency] = (byCurrency[ex.currency] || 0) - Number(ex.amount);
            const key = `${ex.paidBy}_${ex.currency}`;
            byCustodian[key] = (byCustodian[key] || 0) - Number(ex.amount);
          });

        return navHtml + `
          <button onclick="openAddPoolDepositModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
            <i class="fa-solid fa-piggy-bank"></i> 新增公費入金（支援外幣／指定保管人）
          </button>

          <!-- 各幣別公費總餘額 -->
          <div class="card-surface p-4 mb-3">
            <div class="font-bold text-xs text-gray-500 mb-2">目前各幣別公費總結餘</div>
            <div class="grid grid-cols-2 gap-2">
              ${Object.keys(byCurrency).length === 0 ? '<div class="text-xs text-gray-400">尚無公費紀錄</div>' : Object.entries(byCurrency).map(([cur, amt]) => `
                <div class="bg-white border border-[#e6e2d6] rounded-2xl p-3">
                  <div class="text-xs text-gray-500">${cur} 公費餘額</div>
                  <div class="font-bold text-lg text-[#4f6f52]">${cur} ${amt.toLocaleString()}</div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- 各保管人持有明細 -->
          <div class="card-surface p-4 mb-4">
            <div class="font-bold text-xs text-gray-500 mb-2">👤 各保管人持有公費狀況</div>
            <div class="space-y-1.5">
              ${Object.keys(byCustodian).length === 0 ? '<div class="text-xs text-gray-400">尚無保管紀錄</div>' : Object.entries(byCustodian).map(([key, amt]) => {
                const [cid, cur] = key.split('_');
                const m = getMember(cid);
                return `
                  <div class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-xl px-3 py-2 text-xs">
                    <span class="font-semibold">${m.avatar} ${m.name} 保管中</span>
                    <span class="font-bold text-[#4f6f52]">${cur} ${amt.toLocaleString()}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="font-bold text-sm mb-2 text-gray-700">公費入金紀錄</div>
          <div class="space-y-2.5">
            ${state.publicPoolDeposits.map(dep => {
              const contrib = getMember(dep.contributorId);
              const cust = getMember(dep.custodianId);
              return `
                <div class="card-surface p-3.5 flex items-center justify-between">
                  <div>
                    <div class="font-bold text-sm">${contrib.avatar} ${contrib.name} 入金 ${dep.currency} ${Number(dep.amount).toLocaleString()}</div>
                    <div class="text-xs text-[#4f6f52] font-medium mt-0.5">
                      <i class="fa-solid fa-hand-holding-dollar mr-1"></i>保管人：${cust.avatar} ${cust.name}
                    </div>
                    <div class="text-[11px] text-gray-400 mt-0.5">${dep.date}${dep.note ? ' · ' + dep.note : ''}</div>
                  </div>
                  <button onclick="deletePoolDeposit('${dep.id}')" class="text-xs text-red-400">刪除</button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      return navHtml;
    }

    // 記帳相關 Modal 與邏輯
    function openAddExpenseModal() {
      const currencies = getAllCurrencies();
      openModal(`
        <h3 class="text-base font-bold mb-3">新增支出紀錄</h3>
        <div class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">日期</label>
              <input id="ex-date" type="date" value="${state.tripInfo.startDate}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">分類</label>
              <select id="ex-cat" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                <option>餐飲</option><option>交通</option><option>住宿</option><option>購物</option><option>門票</option><option>其他</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">項目名稱</label>
            <input id="ex-title" type="text" placeholder="例如：一蘭拉麵 / JR車票" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">幣別</label>
              <select id="ex-currency" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${currencies.map(c => `<option value="${c}" ${c === 'JPY' ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">金額</label>
              <input id="ex-amount" type="number" placeholder="0" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">支付方式</label>
              <select id="ex-method" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                <option value="現金支付">現金支付</option>
                <option value="信用卡">信用卡</option>
                <option value="公費支付">公費支付</option>
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">先付 / 付款人</label>
              <select id="ex-paidby" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${state.members.map(m => `<option value="${m.id}" ${m.id === state.currentUserId ? 'selected' : ''}>${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">平分成員（可複選）</label>
            <div class="flex flex-wrap gap-2">
              ${state.members.map(m => `
                <label class="flex items-center gap-1.5 bg-white border border-[#e6e2d6] px-3 py-1.5 rounded-xl text-xs">
                  <input type="checkbox" name="ex-split" value="${m.id}" checked class="accent-[#4f6f52]" />
                  <span>${m.avatar} ${m.name}</span>
                </label>
              `).join('')}
            </div>
          </div>
          <button onclick="saveExpense()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">儲存支出</button>
        </div>
      `);
    }

    function saveExpense() {
      const title = document.getElementById('ex-title').value.trim();
      const amount = parseFloat(document.getElementById('ex-amount').value);
      const splitWith = Array.from(document.querySelectorAll('input[name="ex-split"]:checked')).map(el => el.value);
      if (!title || isNaN(amount) || amount <= 0) return showToast('請輸入項目與有效金額');
      if (splitWith.length === 0) return showToast('請至少勾選一位分攤成員');

      state.expenses.unshift({
        id: 'ex_' + Date.now(),
        date: document.getElementById('ex-date').value,
        category: document.getElementById('ex-cat').value,
        title,
        amount,
        currency: document.getElementById('ex-currency').value,
        payMethod: document.getElementById('ex-method').value,
        paidBy: document.getElementById('ex-paidby').value,
        splitWith
      });
      saveState();
      closeModal();
      render();
      showToast('已新增支出紀錄');
    }

    function deleteExpense(id) {
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveState();
      render();
    }

    function openSettlementModal() {
      const net = {};
      state.members.forEach(m => net[m.id] = 0);

      state.expenses.filter(ex => ex.payMethod !== '公費支付').forEach(ex => {
        const twd = toTWD(ex.amount, ex.currency);
        if (net[ex.paidBy] !== undefined) net[ex.paidBy] += twd;
        const share = twd / ex.splitWith.length;
        ex.splitWith.forEach(uid => {
          if (net[uid] !== undefined) net[uid] -= share;
        });
      });

      openModal(`
        <h3 class="text-base font-bold mb-3">⚖️ 個人分帳結算總覽 (TWD)</h3>
        <div class="space-y-2 text-sm mb-4">
          ${state.members.map(m => {
            const val = Math.round(net[m.id] || 0);
            return `
              <div class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-xl px-3.5 py-2.5">
                <span class="font-semibold">${m.avatar} ${m.name}</span>
                <span class="font-bold ${val >= 0 ? 'text-[#4f6f52]' : 'text-red-500'}">
                  ${val >= 0 ? `應收回 NT$ ${val.toLocaleString()}` : `應支付 NT$ ${Math.abs(val).toLocaleString()}`}
                </span>
              </div>
            `;
          }).join('')}
        </div>
        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-[#f3f1ea] font-semibold text-sm">關閉</button>
      `);
    }

    // 9. 新增外幣現金袋 Modal（預設 JPY/KRW/USD，亦可手動打入任意幣別代碼）
    function openAddCashWalletModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增外幣現金袋</h3>
        <div class="space-y-3 text-sm">
          <div>
            <label class="text-xs text-gray-500 block mb-1">選擇預設幣別或手動輸入指定幣別（如 EUR / THB / HKD）</label>
            <div class="flex gap-1.5 mb-2">
              ${['JPY', 'KRW', 'USD'].map(c => `
                <button type="button" onclick="document.getElementById('cw-currency').value='${c}'"
                  class="px-3 py-1 rounded-lg bg-[#e6efe7] text-[#3d5a40] font-bold text-xs">${c}</button>
              `).join('')}
            </div>
            <input id="cw-currency" type="text" value="JPY" maxlength="6" placeholder="手動輸入幣別代碼，例如 THB"
              class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white uppercase font-semibold" />
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">初始外幣現金額度</label>
            <input id="cw-amount" type="number" placeholder="例如：50000" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">備註（選填）</label>
            <input id="cw-note" type="text" placeholder="例如：機場提款 / 台灣銀行換匯" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <button onclick="saveCashWallet()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">建立外幣現金袋</button>
        </div>
      `);
    }

    function saveCashWallet() {
      const currency = (document.getElementById('cw-currency').value || '').trim().toUpperCase();
      const amount = parseFloat(document.getElementById('cw-amount').value);
      if (!currency || isNaN(amount) || amount < 0) return showToast('請輸入正確的幣別與金額');

      // 若是新自訂幣別，順便補進匯率表方便換算
      if (!state.tripInfo.rates[currency]) {
        state.tripInfo.rates[currency] = 1;
      }

      state.cashWallets.push({
        id: 'cw_' + Date.now(),
        currency,
        initialAmount: amount,
        note: document.getElementById('cw-note').value.trim()
      });
      saveState();
      closeModal();
      render();
      showToast(`已新增 ${currency} 現金袋`);
    }

    function deleteCashWallet(id) {
      state.cashWallets = state.cashWallets.filter(w => w.id !== id);
      saveState();
      render();
    }

    // 8. 新增公費入金 Modal（不限 TWD，可選外幣或手動打入幣別 + 指定保管人）
    function openAddPoolDepositModal() {
      const currencies = getAllCurrencies();
      openModal(`
        <h3 class="text-base font-bold mb-3">新增公費入金</h3>
        <div class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">出資人</label>
              <select id="pd-contrib" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${state.members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-xs text-[#4f6f52] font-bold block mb-1">指定保管人</label>
              <select id="pd-custodian" class="w-full border border-[#4f6f52] rounded-xl px-3 py-2 bg-[#f4f8f4]">
                ${state.members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">入金幣別（可選或手動輸入）</label>
              <input id="pd-currency" list="pd-cur-list" value="TWD" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white uppercase font-semibold" />
              <datalist id="pd-cur-list">
                ${currencies.map(c => `<option value="${c}">`).join('')}
              </datalist>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">入金金額</label>
              <input id="pd-amount" type="number" placeholder="0" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">日期</label>
            <input id="pd-date" type="date" value="${state.tripInfo.startDate}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <div>
            <label class="text-xs text-gray-500 block mb-1">備註（選填）</label>
            <input id="pd-note" type="text" placeholder="例如：機場共同換匯公費" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <button onclick="savePoolDeposit()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">確認入金</button>
        </div>
      `);
    }

    function savePoolDeposit() {
      const currency = (document.getElementById('pd-currency').value || 'TWD').trim().toUpperCase();
      const amount = parseFloat(document.getElementById('pd-amount').value);
      if (!currency || isNaN(amount) || amount <= 0) return showToast('請輸入正確的幣別與金額');

      if (!state.tripInfo.rates[currency]) {
        state.tripInfo.rates[currency] = 1;
      }

      state.publicPoolDeposits.unshift({
        id: 'pd_' + Date.now(),
        date: document.getElementById('pd-date').value,
        contributorId: document.getElementById('pd-contrib').value,
        custodianId: document.getElementById('pd-custodian').value,
        currency,
        amount,
        note: document.getElementById('pd-note').value.trim()
      });
      saveState();
      closeModal();
      render();
      showToast('已記錄公費入金');
    }

    function deletePoolDeposit(id) {
      state.publicPoolDeposits = state.publicPoolDeposits.filter(d => d.id !== id);
      saveState();
      render();
    }

    // ==================== 底部導覽列 ====================
    function renderBottomNav() {
      const navs = [
        { id: 'itinerary', icon: 'fa-regular fa-calendar', label: '行程' },
        { id: 'list', icon: 'fa-solid fa-list-check', label: '清單' },
        { id: 'journal', icon: 'fa-solid fa-book-open', label: '日誌' },
        { id: 'expense', icon: 'fa-solid fa-wallet', label: '記帳' }
      ];
      return `
        <nav class="fixed bottom-0 left-0 right-0 bg-[#faf9f5]/95 backdrop-blur border-t border-[#e6e2d6] z-40">
          <div class="max-w-md mx-auto grid grid-cols-4 py-2">
            ${navs.map(n => {
              const active = state.activeTab === n.id;
              return `
                <button onclick="state.activeTab='${n.id}'; saveState(); render();"
                  class="flex flex-col items-center justify-center gap-1 py-1 ${active ? 'text-[#4f6f52] font-bold' : 'text-gray-400'}">
                  <i class="${n.icon} text-base"></i>
                  <span class="text-[11px]">${n.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      let body = '';
      if (state.activeTab === 'itinerary') body = renderItineraryTab();
      if (state.activeTab === 'list') body = renderListTab();
      if (state.activeTab === 'journal') body = renderJournalTab();
      if (state.activeTab === 'expense') body = renderExpenseTab();

      app.innerHTML = renderHeader() + body + renderBottomNav();
    }

    render();
  </script>
</body>
</html>
