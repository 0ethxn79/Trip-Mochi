    * {

      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .app-shell {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: #F5F3EB;
      position: relative;
      box-shadow: 0 20px 50px rgba(44, 48, 46, 0.12);
    }
    @media (max-width: 480px) {
      body { background-color: #F5F3EB; }
      .app-shell { box-shadow: none; }
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
      }
    }

    :root {
      --bg-outer: #E7E3D6;
      --bg-shell: #F5F3EB;
      --bg-cream: #F5F3EB;
      --bg-cream-dark: #ECE8DA;
      --accent: #5B7A58;
      --accent-dark: #486345;
      --accent-light: #E6EFE5;
      --border-warm: #E5E0D2;
      --text-main: #2C302E;
    }
    body {
      background-color: var(--bg-outer) !important;
      color: var(--text-main) !important;
    }
    .app-shell {
      background-color: var(--bg-shell) !important;
    }
    .bg-cream { background-color: var(--bg-cream) !important; }
    .bg-creamDark { background-color: var(--bg-cream-dark) !important; }
    .bg-sage { background-color: var(--accent) !important; }
    .hover\:bg-sageDark:hover, .bg-sageDark { background-color: var(--accent-dark) !important; }
    .bg-sageLight, .bg-sageLight\/70, .bg-sageLight\/80 { background-color: var(--accent-light) !important; }
    .text-sage { color: var(--accent) !important; }
    .text-sageDark { color: var(--accent-dark) !important; }
    .border-sage { border-color: var(--accent) !important; }
    .border-warmBorder, .border-warmBorder\/60, .border-warmBorder\/70 { border-color: var(--border-warm) !important; }
    .text-charcoal { color: var(--text-main) !important; }

function getStyleConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem(CUSTOM_STYLE_KEY) || 'null');
    if (saved && saved.accent) return saved;
  } catch (e) {}
  return { ...STYLE_PRESETS.matcha };
}

function applyStyleConfig(cfg) {
  const root = document.documentElement;
  root.style.setProperty('--bg-outer', cfg.outer);
  root.style.setProperty('--bg-shell', cfg.shell);
  root.style.setProperty('--bg-cream', cfg.cream);
  root.style.setProperty('--bg-cream-dark', cfg.creamDark);
  root.style.setProperty('--accent', cfg.accent);
  root.style.setProperty('--accent-dark', cfg.accentDark);
  root.style.setProperty('--accent-light', cfg.accentLight);
  root.style.setProperty('--border-warm', cfg.border);
  root.style.setProperty('--text-main', cfg.text);
  localStorage.setItem(CUSTOM_STYLE_KEY, JSON.stringify(cfg));
}
