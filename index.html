// 載入或初始化狀態
let appState = (() => {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {
    console.error('Failed to load state:', e);
  }
  return createInitialData();
})();

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
  } catch (e) {
    showToast('儲存空間已滿，建議減少大型圖片上傳', 'error');
  }
}

// 取得當前行程
function getCurrentTrip() {
  return appState.trips.find(t => t.id === appState.activeTripId) || appState.trips[0];
}

// 格式化日期為 MM/DD 與 週X
function formatDateParts(dateStr) {
  const parts = dateStr.split('-');
  if (parts.length !== 3) return { md: dateStr, weekday: '' };
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  return {
    md: `${parts[1]}/${parts[2]}`,
    weekday: weekdays[d.getDay()] || ''
  };
}

// 金額換算為 TWD
function convertToTWD(amount, currency, rates) {
  const num = Number(amount) || 0;
  const rate = (rates && rates[currency]) ? Number(rates[currency]) : (DEFAULT_RATES[currency] || 1);
  return Math.round(num * rate);
}

// Toast 提示訊息 (替代 alert)
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const bg = type === 'error' ? 'bg-red-600' : 'bg-[#2C302E]';
  el.className = `${bg} text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 animate-slide-up`;
  el.innerHTML = `<span>${type === 'error' ? '⚠️' : '✨'}</span><span>${message}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.2s';
    setTimeout(() => el.remove(), 220);
  }, 2400);
}

/**
 * ============================================================================
 * 計算邏輯：個人預計分攤總額、潛在花費、分帳結算
 * ============================================================================
 */
function calculateTripFinancials(trip) {
  const rates = trip.rates || DEFAULT_RATES;
  const memberTotals = {};
  trip.members.forEach(m => {
    memberTotals[m.id] = { totalTWD: 0, breakdown: [] };
  });

  // 1. 計算行程項目中的確定花費 (非潛在花費)
  trip.days.forEach((day, dIdx) => {
    day.items.forEach(item => {
      const price = Number(item.price) || 0;
      if (price <= 0 || item.isPotential) return;
      const participants = (item.memberIds && item.memberIds.length > 0)
        ? item.memberIds.filter(id => memberTotals[id])
        : trip.members.map(m => m.id);
      if (participants.length === 0) return;

      let perPersonOrig = price;
      if (item.includeTax) perPersonOrig = perPersonOrig * 1.015;
      const perPersonTWD = convertToTWD(perPersonOrig, item.currency || 'TWD', rates);

      participants.forEach(mid => {
        memberTotals[mid].totalTWD += perPersonTWD;
        memberTotals[mid].breakdown.push({
          title: item.title,
          typeLabel: ITEM_TYPES[item.type]?.label || '項目',
          date: day.date,
          amountTWD: perPersonTWD
        });
      });
    });
  });

  // 2. 計算潛在花費清單
  const potentialItems = [];
  let totalPotentialTWD = 0;
  trip.days.forEach((day, dIdx) => {
    day.items.forEach(item => {
      const price = Number(item.price) || 0;
      if (price > 0 && item.isPotential) {
        const origWithFee = item.includeTax ? price * 1.015 : price;
        const perPersonTWD = convertToTWD(origWithFee, item.currency || 'TWD', rates);
        const participants = (item.memberIds && item.memberIds.length > 0)
          ? item.memberIds.filter(id => memberTotals[id])
          : trip.members.map(m => m.id);
        const rowTotal = perPersonTWD * participants.length;
        totalPotentialTWD += rowTotal;
        potentialItems.push({
          ...item,
          dayNumber: dIdx + 1,
          perPersonTWD,
          rowTotalTWD: rowTotal,
          participants
        });
      }
    });
  });

  // 3. 記帳分帳計算
  let totalSplitExpenseTWD = 0;
  const paidByMember = {};
  const owedByMember = {};
  trip.members.forEach(m => {
    paidByMember[m.id] = 0;
    owedByMember[m.id] = 0;
  });

  (trip.expenses || []).forEach(exp => {
    const raw = Number(exp.amount) || 0;
    const withFee = exp.extraFee ? raw * 1.015 : raw;
    const twd = convertToTWD(withFee, exp.currency || 'TWD', rates);
    totalSplitExpenseTWD += twd;
    if (paidByMember[exp.payerId] !== undefined) {
      paidByMember[exp.payerId] += twd;
    }
    const splitters = (exp.splitMemberIds && exp.splitMemberIds.length > 0)
      ? exp.splitMemberIds.filter(id => owedByMember[id] !== undefined)
      : trip.members.map(m => m.id);
    if (splitters.length > 0) {
      const share = Math.round(twd / splitters.length);
      splitters.forEach(id => {
        owedByMember[id] += share;
      });
    }
  });

  return {
    memberTotals,
    potentialItems,
    totalPotentialTWD,
    totalSplitExpenseTWD,
    paidByMember,
    owedByMember
  };
}

              <div class="h-[1.5px] flex-1 bg-stone-300"></div>
              <i data-lucide="plane" class="w-4 h-4 text-sage"></i>
              <div class="h-[1.5px] flex-1 bg-stone-300"></div>
            </div>
            <span class="text-[11px] font-bold text-sage">直飛航班</span>
          `}
        </div>

        <div class="text-right">
          <span class="inline-block text-[10px] font-bold bg-sky-100 text-sky-700 px-1.5 py-0.5 rounded mb-1">抵達</span>
          <div class="text-base font-extrabold text-charcoal">${escapeHtml(item.arrCity || '')} <span class="text-sky-700">${escapeHtml(item.arrCode || '')}</span></div>
          <div class="text-[11px] text-stone-400 truncate">${escapeHtml(item.arrAirport || '')}</div>
          <div class="text-lg font-black text-charcoal mt-0.5">${escapeHtml(item.arrTime || '')}</div>
        </div>
      </div>

      <div class="mt-2.5 pt-2.5 border-t border-warmBorder flex flex-wrap items-center justify-between gap-2 text-[11px] text-stone-600">
        <span>🧳 託運行李 <b>${escapeHtml(item.checkedBag || '23kg')}</b></span>
        <span>🎒 手提行李 <b>${escapeHtml(item.carryOnBag || '7kg')}</b></span>
        ${item.nextFlightNo ? `<span>🛫 接續 <b>${escapeHtml(item.nextFlightNo)}</b></span>` : ''}
      </div>
    </div>
  `;

  // 交通路線視覺區塊
  const renderTransportDetails = () => `
    <div class="mt-3 bg-cream/70 rounded-2xl p-3.5 border border-warmBorder">
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="font-bold text-sky-800 flex items-center gap-1">
          <i data-lucide="train-front" class="w-3.5 h-3.5"></i>
          ${escapeHtml(item.transportMode || '大眾運輸')}
        </span>
        ${item.passTag ? `
          <span class="text-[11px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">
            ${escapeHtml(item.passTag)}
          </span>
        ` : ''}
      </div>

      <div class="grid grid-cols-3 items-center gap-2 py-1">
        <div>
          <span class="text-[10px] font-bold bg-stone-200/80 text-stone-700 px-1.5 py-0.5 rounded">發車</span>
          <div class="text-base font-black text-charcoal mt-1">${escapeHtml(item.depTime || item.time)}</div>
          <div class="text-xs font-bold text-charcoal line-clamp-2 mt-0.5">${escapeHtml(item.depStation || item.title)}</div>
        </div>

        <div class="text-center flex flex-col items-center">
          <span class="text-[10px] text-stone-400 mb-1">${escapeHtml(item.viaStation || '直達路線')}</span>
          <div class="w-full flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-sage"></span>
            <div class="h-[2px] flex-1 bg-sage/40 border-dashed"></div>
            <span class="w-2 h-2 rounded-full bg-terracotta"></span>
          </div>
          ${item.segments && item.segments.length > 0 ? `
            <button onclick="event.stopPropagation(); toggleExpandItem('${item.id}')"
              class="mt-1.5 text-[11px] font-bold text-sage hover:underline flex items-center gap-0.5">
              <span>${isExpanded ? '收合詳情' : `轉乘明細 (${item.segments.length})`}</span>
              <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-3 h-3"></i>
            </button>
          ` : ''}
        </div>

        <div class="text-right">
          <span class="text-[10px] font-bold bg-stone-200/80 text-stone-700 px-1.5 py-0.5 rounded">抵達</span>
          <div class="text-base font-black text-charcoal mt-1">${escapeHtml(item.arrTime || '--:--')}</div>
          <div class="text-xs font-bold text-charcoal line-clamp-2 mt-0.5">${escapeHtml(item.arrStation || '')}</div>
        </div>
      </div>

      ${isExpanded && item.segments && item.segments.length > 0 ? `
        <div class="mt-3 pt-2.5 border-t border-warmBorder space-y-2">
          ${item.segments.map((seg, sIdx) => `
            <div class="bg-white rounded-xl p-2.5 border border-warmBorder text-xs">
              <div class="flex items-center justify-between font-bold text-charcoal mb-1">
                <span>${sIdx + 1}. ${escapeHtml(seg.mode || '列車')}</span>
                <span class="text-sage font-mono">${escapeHtml(seg.time || '')}</span>
              </div>
              <div class="text-stone-600 flex items-center gap-1.5">
                <span class="font-semibold">${escapeHtml(seg.from)}</span>
                <span class="text-stone-400">→</span>
                <span class="font-semibold">${escapeHtml(seg.to)}</span>
              </div>
              ${seg.note ? `<div class="text-[11px] text-amber-700 mt-1">💡 ${escapeHtml(seg.note)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}
    </div>
  `;

  return `
    <div onclick="openModal('EDIT_ITEM', '${item.id}')"
      class="bg-white rounded-3xl border border-warmBorder shadow-sm hover:shadow-md transition cursor-pointer overflow-hidden">
      
      ${hasImages && imgPos === 'top' ? renderPhotoBanner() : ''}

      <div class="p-4">
        <!-- 卡片頂部時間與分類標籤 -->
        <div class="flex items-center justify-between gap-2 mb-1.5">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-xl ${meta.bg} ${meta.color} flex items-center justify-center shrink-0">
              <i data-lucide="${meta.icon}" class="w-4 h-4"></i>
            </span>
            <span class="bg-sageLight text-sageDark font-extrabold text-xs px-2.5 py-0.5 rounded-lg font-mono">
              ${escapeHtml(item.time || '09:00')}
            </span>
            <span class="text-[11px] font-bold tracking-wider uppercase ${meta.color}">
              ${meta.tag}
            </span>
            ${item.isPotential ? `
              <span class="text-[10px] font-bold bg-terracottaLight text-terracotta px-2 py-0.5 rounded-full">
                潛在花費
              </span>
            ` : ''}
          </div>

          ${Number(item.price) > 0 ? `
            <span class="text-xs font-extrabold text-sageDark bg-sageLight/70 px-2.5 py-1 rounded-full">
              ${escapeHtml(item.currency || 'TWD')} ${Number(item.price).toLocaleString()}
            </span>
          ` : ''}
        </div>

        <!-- 標題與地點 -->
        <h3 class="text-base font-extrabold text-charcoal leading-snug">
          ${escapeHtml(item.title)}
        </h3>
        ${item.location ? `
          <div class="flex items-center justify-between gap-2 mt-1">
            <p class="text-xs text-stone-500 flex items-center gap-1 truncate">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-sage shrink-0"></i>
              <span class="truncate">${escapeHtml(item.location)}</span>
            </p>
            <a href="https://maps.google.com/?q=${encodeURIComponent(item.location)}" target="_blank"
              onclick="event.stopPropagation()"
              class="w-7 h-7 rounded-full bg-cream hover:bg-sageLight text-sage flex items-center justify-center shrink-0 transition"
              title="在 Google Maps 開啟">
              <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        ` : ''}

        ${hasImages && imgPos === 'middle' ? renderPhotoBanner() : ''}

        <!-- 類型專屬資訊 -->
        ${item.type === 'FLIGHT' ? renderFlightDetails() : ''}
        ${item.type === 'TRANSPORT' ? renderTransportDetails() : ''}

        <!-- 備註區塊 -->
        ${item.notes ? `
          <div class="mt-3 bg-cream/60 rounded-2xl p-3 text-xs text-stone-700 leading-relaxed whitespace-pre-line border border-warmBorder/70">
            ${escapeHtml(item.notes)}
          </div>
        ` : ''}

        ${hasImages && imgPos === 'bottom' ? renderPhotoBanner() : ''}

        <!-- 參與成員列 -->
        ${participants.length > 0 ? `
          <div class="mt-3 pt-2.5 border-t border-warmBorder/60 flex items-center justify-between">
            <span class="text-[10px] font-bold tracking-wider text-stone-400 uppercase">MEMBERS</span>
            <div class="flex items-center flex-wrap gap-1.5">
              ${participants.map(m => `
                <span class="inline-flex items-center gap-1 text-[11px] font-medium bg-cream px-2 py-0.5 rounded-full text-stone-600">
                  <span>${m.avatar}</span>
                  <span>${escapeHtml(m.name)}</span>
                </span>
              `).join('')}
            </div>
          </div>
        ` : ''}
      </div>
    </div>
  `;
}

/**
 * ============================================================================
 * TAB 2: 預訂總覽 (Bookings: 機票 / 住宿 / 租車)
 * ============================================================================
 */
function renderBookingsTab(trip) {
  const flights = [];
  const hotels = [];
  trip.days.forEach((day, dIdx) => {
    day.items.forEach(item => {
      if (item.type === 'FLIGHT') flights.push({ ...item, dayDate: day.date, dayNum: dIdx + 1 });
      if (item.type === 'HOTEL') hotels.push({ ...item, dayDate: day.date, dayNum: dIdx + 1 });
    });
  });

  const subTabs = [
    { id: 'FLIGHT', label: '機票', icon: 'plane', count: flights.length },
    { id: 'HOTEL', label: '住宿', icon: 'bed-double', count: hotels.length },
    { id: 'CAR', label: '租車', icon: 'car', count: 0 }
  ];

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <!-- 子分頁切換 -->
      <div class="grid grid-cols-3 gap-2 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">
        ${subTabs.map(st => {
          const active = uiState.bookingSubTab === st.id;
          return `
            <button onclick="setBookingSubTab('${st.id}')"
              class="py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition
              ${active ? 'bg-sage text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
              <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
              <span>${st.label}</span>
              ${st.count > 0 ? `<span class="text-[10px] px-1.5 rounded-full ${active ? 'bg-white/25' : 'bg-cream'}">${st.count}</span>` : ''}
            </button>
          `;
        }).join('')}
      </div>

      <!-- 快速新增按鈕 -->
      <button onclick="openModal('ITEM_FORM', { type: '${uiState.bookingSubTab === 'CAR' ? 'TRANSPORT' : uiState.bookingSubTab}' })"
        class="w-full py-3 rounded-2xl bg-white hover:bg-sageLight/50 text-charcoal font-bold text-xs border border-warmBorder shadow-sm flex items-center justify-center gap-1.5 transition">
        <i data-lucide="plus" class="w-4 h-4 text-sage"></i>
        <span>新增${uiState.bookingSubTab === 'FLIGHT' ? '機票' : uiState.bookingSubTab === 'HOTEL' ? '住宿' : '租車'}</span>
      </button>

      <!-- 內容列表 -->
      ${uiState.bookingSubTab === 'FLIGHT' ? (
        flights.length === 0 ? renderEmptyBooking('plane', '尚未新增機票', '點擊上方按鈕新增第一筆機票資料') :
        `<div class="space-y-3">${flights.map(f => renderItineraryCard(trip, f, 0)).join('')}</div>`
      ) : ''}

      ${uiState.bookingSubTab === 'HOTEL' ? (
        hotels.length === 0 ? renderEmptyBooking('bed-double', '尚未新增住宿', '點擊上方按鈕新增飯店、民宿或 Airbnb 資訊') :
        `<div class="space-y-3">${hotels.map(h => `
          <div onclick="openModal('EDIT_ITEM', '${h.id}')" class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm cursor-pointer hover:shadow-md transition">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold bg-purple-50 text-purple-700 px-2.5 py-0.5 rounded-full">
                Day ${h.dayNum} · ${h.dayDate}
              </span>
              <span class="text-xs font-extrabold text-sage">
                ${h.currency || 'TWD'} ${Number(h.price || 0).toLocaleString()}
              </span>
            </div>
            <h3 class="text-base font-extrabold text-charcoal">${escapeHtml(h.title)}</h3>
            <p class="text-xs text-stone-500 mt-1 flex items-center gap-1">
              <i data-lucide="map-pin" class="w-3.5 h-3.5 text-purple-600"></i>
              <span>${escapeHtml(h.location || '未填寫地址')}</span>
            </p>
            ${h.notes ? `<div class="mt-2.5 bg-cream/70 rounded-xl p-2.5 text-xs text-stone-600 whitespace-pre-line">${escapeHtml(h.notes)}</div>` : ''}
          </div>
        `).join('')}</div>`
      ) : ''}

      ${uiState.bookingSubTab === 'CAR' ? renderEmptyBooking('car', '尚未安排租車', '若有自駕行程，可點擊上方按鈕新增租車訂單') : ''}
    </div>
  `;
}

function renderEmptyBooking(icon, title, subtitle) {
  return `
    <div class="bg-white rounded-3xl p-10 border border-warmBorder text-center shadow-sm">
      <div class="w-14 h-14 rounded-full bg-sageLight text-sage mx-auto flex items-center justify-center mb-3">
        <i data-lucide="${icon}" class="w-7 h-7"></i>
      </div>
      <h4 class="text-sm font-extrabold text-charcoal">${title}</h4>
      <p class="text-xs text-stone-400 mt-1">${subtitle}</p>
    </div>
  `;
}

/**
 * ============================================================================
 * TAB 3: 記帳與分帳 (Expenses & Pool)
 * ============================================================================
 */
function renderExpensesTab(trip) {
  const fin = calculateTripFinancials(trip);
  const filteredExpenses = (trip.expenses || []).filter(exp => {
    if (uiState.expenseFilterMember === 'ALL') return true;
    return exp.payerId === uiState.expenseFilterMember || (exp.splitMemberIds || []).includes(uiState.expenseFilterMember);
  });

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <!-- 分帳總覽 / 公費管理 切換 -->
      <div class="grid grid-cols-2 gap-2 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">
        <button onclick="setExpenseSubTab('SPLIT')"
          class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition
          ${uiState.expenseSubTab === 'SPLIT' ? 'bg-charcoal text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
          <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
          <span>分帳總覽</span>
        </button>
        <button onclick="setExpenseSubTab('POOL')"
          class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition
          ${uiState.expenseSubTab === 'POOL' ? 'bg-charcoal text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
          <i data-lucide="piggy-bank" class="w-3.5 h-3.5"></i>
          <span>公費管理</span>
        </button>
      </div>

      ${uiState.expenseSubTab === 'SPLIT' ? `
        <!-- 操作按鈕列 -->
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="openModal('ADD_EXPENSE')"
            class="py-3 rounded-2xl bg-sage hover:bg-sageDark text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>新增支出</span>
          </button>
          <button onclick="openModal('SETTLEMENT_SUMMARY')"
            class="py-3 rounded-2xl bg-white hover:bg-cream text-charcoal font-bold text-xs border border-warmBorder shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition">
            <i data-lucide="scale" class="w-4 h-4 text-sage"></i>
            <span>結算建議</span>
          </button>
        </div>

        <!-- 成員篩選膠囊 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          <button onclick="setExpenseFilterMember('ALL')"
            class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition
            ${uiState.expenseFilterMember === 'ALL' ? 'bg-charcoal text-white' : 'bg-white text-stone-600 border border-warmBorder'}">
            全部
          </button>
          ${trip.members.map(m => `
            <button onclick="setExpenseFilterMember('${m.id}')"
              class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 transition
              ${uiState.expenseFilterMember === m.id ? 'bg-sage text-white' : 'bg-white text-stone-600 border border-warmBorder'}">
              <span>${m.avatar}</span>
              <span>${escapeHtml(m.name)}</span>
            </button>
          `).join('')}
        </div>

        <!-- 綠色總支出卡片 -->
        <div class="bg-gradient-to-br from-[#5B7A58] to-[#466343] rounded-3xl p-5 text-white shadow-md">
          <div class="text-xs font-medium text-white/80">分帳總支出 (TWD)</div>
          <div class="text-3xl font-black tracking-tight mt-1">
            NT$ ${fin.totalSplitExpenseTWD.toLocaleString()}
          </div>
          <div class="mt-3 pt-3 border-t border-white/15 flex items-center justify-between text-xs text-white/90">
            <span>共 ${filteredExpenses.length} 筆支出紀錄</span>
            <span>平均每人 NT$ ${Math.round(fin.totalSplitExpenseTWD / Math.max(1, trip.members.length)).toLocaleString()}</span>
          </div>
        </div>

        <!-- 支出明細列表 -->
        <div class="space-y-2.5">
          <h3 class="text-xs font-bold text-stone-500 px-1">支出明細</h3>
          ${filteredExpenses.length === 0 ? `
            <div class="bg-white rounded-3xl p-8 text-center border border-warmBorder text-xs text-stone-400">
              尚無分帳支出紀錄，點擊上方「新增支出」開始記帳
            </div>
          ` : filteredExpenses.map(exp => {
            const payer = trip.members.find(m => m.id === exp.payerId);
            const twd = convertToTWD(exp.extraFee ? exp.amount * 1.015 : exp.amount, exp.currency, trip.rates);
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-warmBorder shadow-sm flex items-center justify-between gap-3">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-1.5 mb-1">
                    <span class="text-[10px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">${escapeHtml(exp.category)}</span>
                    <span class="text-[10px] text-stone-400">${exp.date} · ${escapeHtml(exp.method)}</span>
                  </div>
                  <div class="text-sm font-extrabold text-charcoal truncate">${escapeHtml(exp.title)}</div>
                  <div class="text-[11px] text-stone-500 mt-0.5">
                    由 <b>${payer ? `${payer.avatar} ${escapeHtml(payer.name)}` : '成員'}</b> 先付 · ${(exp.splitMemberIds || []).length}人平分
                  </div>
                </div>
                <div class="text-right shrink-0">
                  <div class="text-sm font-black text-charcoal">NT$ ${twd.toLocaleString()}</div>
                  ${exp.currency !== 'TWD' ? `<div class="text-[10px] text-stone-400">${exp.currency} ${exp.amount}</div>` : ''}
                  <button onclick="deleteExpense('${exp.id}')" class="text-[10px] text-red-400 hover:text-red-600 mt-1">刪除</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      ` : `
        <!-- 公費管理視圖 -->
        <div class="bg-gradient-to-br from-[#2B7A69] to-[#1F5C4E] rounded-3xl p-5 text-white shadow-md">
          <div class="text-xs font-medium text-white/80">公費總額概算 (TWD)</div>
          <div class="text-3xl font-black tracking-tight mt-1">
            NT$ ${(trip.poolBalance || 0).toLocaleString()}
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button onclick="openModal('POOL_ACTION', 'deposit')"
            class="bg-white hover:bg-emerald-50 rounded-2xl p-4 border border-warmBorder shadow-sm flex flex-col items-center gap-1.5 transition">
            <span class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center">
              <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
            </span>
            <span class="text-xs font-extrabold text-charcoal">入金</span>
            <span class="text-[10px] text-stone-400">ADD FUND</span>
          </button>

          <button onclick="openModal('POOL_ACTION', 'spend')"
            class="bg-white hover:bg-red-50 rounded-2xl p-4 border border-warmBorder shadow-sm flex flex-col items-center gap-1.5 transition">
            <span class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center">
              <i data-lucide="arrow-up-right" class="w-5 h-5"></i>
            </span>
            <span class="text-xs font-extrabold text-charcoal">公費支出</span>
            <span class="text-[10px] text-stone-400">RECORD SPEND</span>
          </button>
        </div>

        <div class="space-y-2">
          <h3 class="text-xs font-bold text-stone-500 px-1">公費明細</h3>
          ${(trip.poolLogs || []).length === 0 ? `
            <div class="bg-white rounded-2xl p-8 text-center border border-warmBorder text-xs text-stone-400">尚無公費收支紀錄</div>
          ` : (trip.poolLogs || []).map(log => `
            <div class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between">
              <div>
                <div class="text-xs font-bold text-charcoal">${escapeHtml(log.title)}</div>
                <div class="text-[11px] text-stone-400 mt-0.5">${log.date} · ${escapeHtml(log.by)}</div>
              </div>
              <span class="text-sm font-black ${log.type === 'deposit' ? 'text-emerald-600' : 'text-red-500'}">
                ${log.type === 'deposit' ? '+' : '-'} NT$ ${Number(log.amount).toLocaleString()}
              </span>
            </div>
          `).join('')}
        </div>
      `}
    </div>
  `;
}

/**
 * ============================================================================
 * TAB 4: 旅行日誌 (Journal)
 * ============================================================================
 */

  const activeAuthor = trip.members.find(m => m.id === uiState.activeJournalAuthorId) || trip.members[0];

    <div class="px-4 pt-3 space-y-3.5">
      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm flex items-center justify-between">
        <div>
          <h2 class="text-base font-extrabold text-charcoal">旅行日誌</h2>
          <p class="text-[11px] text-stone-400 mt-0.5">紀錄旅途中的每一個精彩瞬間與實用心得</p>
        </div>
        <button onclick="openModal('ADD_JOURNAL')"
          class="bg-sage hover:bg-sageDark text-white text-xs font-bold px-3.5 py-2 rounded-full flex items-center gap-1 shadow-sm active:scale-95 transition">
          <i data-lucide="feather" class="w-3.5 h-3.5"></i>
          <span>寫日誌</span>
        </button>
      </div>

      ${(trip.journals || []).length === 0 ? `
        <div class="bg-white rounded-3xl p-12 text-center border border-warmBorder shadow-sm">
          <div class="w-14 h-14 rounded-full bg-sageLight text-sage mx-auto flex items-center justify-center mb-3">
            <i data-lucide="feather" class="w-7 h-7"></i>
          </div>
          <h3 class="text-sm font-bold text-charcoal">還沒有寫下任何回憶...</h3>
          <p class="text-xs text-stone-400 mt-1">點擊右上方「寫日誌」記錄旅程與上傳照片</p>
        </div>
      ` : (trip.journals || []).map(j => {
        const author = trip.members.find(m => m.id === j.authorId) || trip.members[0];
        return `
          <article class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-sageLight flex items-center justify-center text-lg">
                  ${author ? author.avatar : '📝'}
                </div>
                <div>
                  <div class="text-xs font-extrabold text-charcoal">${author ? escapeHtml(author.name) : '旅伴'}</div>
                  <div class="text-[10px] text-stone-400">${escapeHtml(j.date)}</div>
                </div>
              </div>
              <button onclick="deleteJournal('${j.id}')" class="text-stone-300 hover:text-red-500 p-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div>
              <h3 class="text-base font-extrabold text-charcoal mb-1.5">${escapeHtml(j.title)}</h3>
              <p class="text-xs text-stone-700 leading-relaxed whitespace-pre-line">${escapeHtml(j.content)}</p>
            </div>

            ${j.image ? `
              <img src="${j.image}" alt="${escapeHtml(j.title)}"
                onclick="openLightbox(['${j.image}'], 0)"
                onerror="this.style.display='none'"
                class="w-full h-52 object-cover rounded-2xl cursor-zoom-in border border-warmBorder" />
            ` : ''}

            <!-- 成員切換與留言區 -->
            <div class="pt-3 border-t border-warmBorder space-y-2.5">
              ${(j.comments || []).map(c => {
                const cm = trip.members.find(m => m.id === c.memberId);
                return `
                  <div class="bg-cream/80 rounded-2xl px-3 py-2 text-xs flex items-start gap-2">
                    <span class="text-sm">${cm ? cm.avatar : '💬'}</span>
                    <div class="flex-1">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-charcoal">${cm ? escapeHtml(cm.name) : '旅伴'}</span>
                        <span class="text-[10px] text-stone-400">${c.time || ''}</span>
                      </div>
                      <p class="text-stone-700 mt-0.5">${escapeHtml(c.text)}</p>
                    </div>
                  </div>
                `;
              }).join('')}

              <!-- 選擇發言身份 -->
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${trip.members.map(m => `
                  <button onclick="setJournalAuthor('${m.id}')"
                    class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border transition
                    ${activeAuthor?.id === m.id ? 'bg-sageLight border-sage text-sageDark' : 'bg-cream border-warmBorder text-stone-500'}">
                    <span>${m.avatar}</span>
                    <span>${escapeHtml(m.name)}</span>
                  </button>
                `).join('')}
              </div>

              <form onsubmit="submitJournalComment(event, '${j.id}')" class="flex items-center gap-2">
                <input type="text" id="j_comment_${j.id}"
                  placeholder="用 ${activeAuthor ? escapeHtml(activeAuthor.name) : '我'} 的身份留言..."
                  class="flex-1 bg-cream rounded-full px-3.5 py-2 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
                <button type="submit" class="w-8 h-8 rounded-full bg-sage text-white flex items-center justify-center shrink-0">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
              </form>
            </div>
          </article>
        `;
      }).join('')}
    </div>
  `;
}

/**
 * ============================================================================
 * TAB 5: 清單 (待辦 / 行李 / 想去口袋名單 / 文件)
 * ============================================================================
 */
function renderListsTab(trip) {
  const subTabs = [
    { id: 'TODO', label: '待辦', icon: 'check-circle-2' },
    { id: 'PACKING', label: '行李', icon: 'luggage' },
    { id: 'POCKET', label: '想去', icon: 'heart' },
    { id: 'DOCS', label: '文件', icon: 'folder-check' }
  ];

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <!-- 4個子分頁 -->
      <div class="grid grid-cols-4 gap-1.5 bg-white p-1.5 rounded-2xl border border-warmBorder shadow-sm">
        ${subTabs.map(st => {
          const active = uiState.listSubTab === st.id;
          return `
            <button onclick="setListSubTab('${st.id}')"
              class="py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition
              ${active ? 'bg-sage text-white shadow-sm' : 'text-stone-600 hover:bg-cream'}">
              <i data-lucide="${st.icon}" class="w-3.5 h-3.5"></i>
              <span>${st.label}</span>
            </button>
          `;
        }).join('')}
      </div>

      ${uiState.listSubTab === 'TODO' ? renderTodoSubView(trip) : ''}
      ${uiState.listSubTab === 'PACKING' ? renderPackingSubView(trip) : ''}
      ${uiState.listSubTab === 'POCKET' ? renderPocketSubView(trip) : ''}
      ${uiState.listSubTab === 'DOCS' ? renderDocsSubView(trip) : ''}
    </div>
  `;
}

// 5-1 待辦事項視圖
function renderTodoSubView(trip) {
  const activeAuthor = trip.members.find(m => m.id === uiState.activeJournalAuthorId) || trip.members[0];

  return `
    <div class="space-y-3">
      <!-- 新增待辦輸入框 -->
      <form onsubmit="addTodoItem(event)" class="bg-white rounded-2xl p-2.5 border border-warmBorder shadow-sm flex items-center gap-2">
        <input type="text" id="new_todo_input" placeholder="新增待辦事項 (全體)..."
          class="flex-1 bg-transparent px-2 py-1.5 text-xs focus:outline-none" />
        <button type="submit" class="w-9 h-9 rounded-xl bg-sage hover:bg-sageDark text-white flex items-center justify-center shrink-0">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </form>

      ${(trip.todos || []).length === 0 ? `
        <div class="bg-white rounded-3xl p-10 text-center border border-warmBorder text-xs text-stone-400">
          這裡空空如也，新增第一項行前準備吧！
        </div>
      ` : (trip.todos || []).map(todo => {
        const doneCount = (todo.completedBy || []).length;
        const totalMembers = trip.members.length;
        return `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="text-[11px] font-extrabold px-2 py-0.5 rounded-full ${doneCount === totalMembers ? 'bg-sage text-white' : 'bg-sageLight text-sageDark'}">
                  ${doneCount}/${totalMembers}
                </span>
                <h4 class="text-sm font-extrabold text-charcoal">${escapeHtml(todo.title)}</h4>
              </div>
              <button onclick="deleteTodo('${todo.id}')" class="text-stone-300 hover:text-red-500">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- 成員完成度切換按鈕 -->
            <div class="flex flex-wrap gap-1.5">
              ${trip.members.map(m => {
                const isDone = (todo.completedBy || []).includes(m.id);
                return `
                  <button onclick="toggleTodoMember('${todo.id}', '${m.id}')"
                    class="px-2.5 py-1 rounded-full text-[11px] font-bold flex items-center gap-1 border transition
                    ${isDone ? 'bg-sage text-white border-sage' : 'bg-cream text-stone-500 border-warmBorder hover:bg-creamDark'}">
                    <span>${isDone ? '✓' : m.avatar}</span>
                    <span>${escapeHtml(m.name)}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 留言進度討論 -->
            ${(todo.comments || []).length > 0 ? `
              <div class="space-y-1.5 pt-2 border-t border-warmBorder/60">
                ${todo.comments.map(c => {
                  const cm = trip.members.find(m => m.id === c.memberId);
                  return `
                    <div class="bg-cream/80 rounded-xl px-3 py-1.5 text-xs flex items-center justify-between">
                      <span><b>${cm ? escapeHtml(cm.name) : '旅伴'}：</b>${escapeHtml(c.text)}</span>
                      <span class="text-[10px] text-stone-400">${c.time || ''}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : ''}

            <form onsubmit="addTodoComment(event, '${todo.id}')" class="flex items-center gap-2 pt-1">
              <input type="text" id="todo_comment_${todo.id}"
                placeholder="用 ${activeAuthor ? escapeHtml(activeAuthor.name) : '我'} 的身份留言進度..."
                class="flex-1 bg-cream rounded-full px-3 py-1.5 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
              <button type="submit" class="w-7 h-7 rounded-full bg-sage text-white flex items-center justify-center shrink-0">
                <i data-lucide="send" class="w-3 h-3"></i>
              </button>
            </form>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// 5-2 行李打包清單視圖
function renderPackingSubView(trip) {
  const memberId = uiState.packingMemberId || trip.members[0]?.id;
  const activeMember = trip.members.find(m => m.id === memberId) || trip.members[0];
  const items = (trip.packing && trip.packing[memberId]) || [];
  const packedCount = items.filter(i => i.packed).length;
  const pct = items.length === 0 ? 0 : Math.round((packedCount / items.length) * 100);

  const categories = ['衣物', '盥洗用品', '3C 電子', '藥品保健', '證件財物', '其他'];

  return `
    <div class="space-y-3">
      <!-- 成員切換卡片 -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
        ${trip.members.map(m => {
          const mItems = (trip.packing && trip.packing[m.id]) || [];
          const mDone = mItems.filter(i => i.packed).length;
          const isSelected = m.id === memberId;
          return `
            <button onclick="setPackingMember('${m.id}')"
              class="shrink-0 px-3.5 py-2.5 rounded-2xl border text-left transition
              ${isSelected ? 'bg-sage text-white border-sage shadow-sm' : 'bg-white text-charcoal border-warmBorder'}">
              <div class="flex items-center gap-1.5 font-bold text-xs">
                <span>${m.avatar}</span>
                <span>${escapeHtml(m.name)}</span>
              </div>
              <div class="text-[10px] mt-0.5 ${isSelected ? 'text-white/85' : 'text-stone-400'}">
                ${mItems.length === 0 ? '尚未新增' : `${mDone}/${mItems.length} 已打包`}
              </div>
            </button>
          `;
        }).join('')}
      </div>

      <!-- 總打包進度卡 -->
      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm">
        <div class="flex items-center justify-between mb-2">
          <div>
            <div class="text-xs font-extrabold text-charcoal">${escapeHtml(activeMember.name)} 的行李打包完成度</div>
            <div class="text-[11px] text-stone-400">已打包 ${packedCount} / 共 ${items.length} 件物品</div>
          </div>
          <span class="text-lg font-black text-sage">${pct}%</span>
        </div>
        <div class="w-full h-2.5 bg-cream rounded-full overflow-hidden">
          <div class="h-full bg-sage rounded-full transition-all duration-300" style="width: ${pct}%"></div>
        </div>
      </div>

      <!-- 各分類行李清單 -->
      ${categories.map(cat => {
        const catItems = items.filter(i => i.category === cat);
        const catDone = catItems.filter(i => i.packed).length;
        const catPct = catItems.length === 0 ? 0 : Math.round((catDone / catItems.length) * 100);

        return `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-charcoal">${cat}</span>
                <span class="text-[10px] font-bold bg-cream text-stone-500 px-2 py-0.5 rounded-full">
                  ${catItems.length === 0 ? '尚未新增' : `${catDone}/${catItems.length}`}
                </span>
              </div>
              ${catItems.length > 0 ? `<span class="text-xs font-extrabold text-sage">${catPct}%</span>` : ''}
            </div>

            <div class="space-y-1.5">
              ${catItems.map(item => `
                <div class="flex items-center justify-between py-1.5 px-2 rounded-xl hover:bg-cream/60 transition">
                  <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                    <input type="checkbox" ${item.packed ? 'checked' : ''}
                      onchange="togglePackingItem('${memberId}', '${item.id}')"
                      class="w-4 h-4 accent-[#5B7A58] rounded" />
                    <span class="text-xs font-medium ${item.packed ? 'line-through text-stone-400' : 'text-charcoal'}">
                      ${escapeHtml(item.name)}
                    </span>
                  </label>
                  <button onclick="deletePackingItem('${memberId}', '${item.id}')" class="text-stone-300 hover:text-red-500 p-1">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `).join('')}
            </div>

            <!-- 快速新增單品 -->
            <form onsubmit="addPackingItem(event, '${memberId}', '${cat}')" class="flex items-center gap-2 pt-1">
              <input type="text" id="pk_input_${cat}" placeholder="+ 新增${cat}項目..."
                class="flex-1 bg-cream rounded-xl px-3 py-1.5 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
              <button type="submit" class="px-3 py-1.5 rounded-xl bg-sageLight hover:bg-sage hover:text-white text-sageDark text-xs font-bold transition">
                + 新增
              </button>
            </form>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// 5-3 想去口袋名單筆記視圖
function renderPocketSubView(trip) {
  const list = trip.pocketList || [];
  const filtered = list.filter(item => {
    if (uiState.pocketTypeFilter !== 'ALL' && item.type !== uiState.pocketTypeFilter) return false;
    if (uiState.pocketStatusFilter !== 'ALL' && item.status !== uiState.pocketStatusFilter) return false;
    if (uiState.pocketSearch.trim()) {
      const q = uiState.pocketSearch.toLowerCase();
      return item.title.toLowerCase().includes(q) || (item.tag || '').toLowerCase().includes(q) || (item.notes || '').toLowerCase().includes(q);
    }
    return true;
  });

  return `
    <div class="space-y-3">
      <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-base font-extrabold text-charcoal">口袋名單筆記 <span class="text-xs font-medium text-stone-400">共 ${list.length} 項</span></h3>
          </div>
          <button onclick="openModal('ADD_POCKET')"
            class="bg-charcoal hover:bg-black text-white text-xs font-bold px-3.5 py-2 rounded-full flex items-center gap-1 transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>新增筆記</span>
          </button>
        </div>

        <!-- 搜尋框 -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-stone-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" value="${escapeHtml(uiState.pocketSearch)}"
            oninput="setPocketSearch(this.value)"
            placeholder="搜尋口袋名單店名、標籤、備註..."
            class="w-full bg-cream rounded-2xl pl-9 pr-4 py-2 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
        </div>

        <!-- 分類篩選 -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
          ${['ALL', '美食', '探索景點', '購物/伴手禮'].map(t => `
            <button onclick="setPocketTypeFilter('${t}')"
              class="shrink-0 px-3 py-1 rounded-full text-xs font-bold transition
              ${uiState.pocketTypeFilter === t ? 'bg-sage text-white' : 'bg-cream text-stone-600'}">
              ${t === 'ALL' ? '全部' : t}
            </button>
          `).join('')}
        </div>
      </div>

      <!-- 口袋名單卡片列表 -->
      <div class="space-y-3">
        ${filtered.length === 0 ? `
          <div class="bg-white rounded-3xl p-10 text-center border border-warmBorder text-xs text-stone-400">
            沒有符合條件的口袋名單筆記
          </div>
        ` : filtered.map(item => `
          <div class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm space-y-2.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">${escapeHtml(item.type)}</span>
                  ${item.tag ? `<span class="text-[10px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">${escapeHtml(item.tag)}</span>` : ''}
                  <span class="text-[11px] font-bold text-amber-500">★ ${item.rating || '5.0'}</span>
                </div>
                <h4 class="text-sm font-extrabold text-charcoal">${escapeHtml(item.title)}</h4>
              </div>
              <button onclick="togglePocketStatus('${item.id}')"
                class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full border transition
                ${item.status === '已去' ? 'bg-sage text-white border-sage' : 'bg-cream text-stone-600 border-warmBorder'}">
                ${item.status === '已去' ? '✓ 已去' : '想去'}
              </button>
            </div>

            ${item.notes ? `
              <p class="text-xs text-stone-600 leading-relaxed bg-cream/70 p-2.5 rounded-2xl">${escapeHtml(item.notes)}</p>
            ` : ''}

            ${item.images && item.images.length > 0 ? `
              <div class="grid grid-cols-3 gap-2">
                ${item.images.map((img, i) => `
                  <img src="${img}" onclick="openLightbox(${JSON.stringify(item.images).replace(/"/g, '&quot;')}, ${i})"
                    class="w-full h-20 object-cover rounded-xl cursor-zoom-in border border-warmBorder" />
                `).join('')}
              </div>
            ` : ''}

            <div class="flex items-center justify-between pt-1 text-xs">
              <span class="text-stone-400 text-[11px]">${escapeHtml(item.priceRange || '')}</span>
              <div class="flex items-center gap-2">
                ${item.mapUrl ? `
                  <a href="${escapeHtml(item.mapUrl)}" target="_blank"
                    class="inline-flex items-center gap-1 text-sage font-bold hover:underline">
                    <i data-lucide="navigation" class="w-3 h-3"></i>
                    <span>導航</span>
                  </a>
                ` : ''}
                <button onclick="deletePocketItem('${item.id}')" class="text-stone-300 hover:text-red-500">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// 5-4 入境資料與文件視圖
function renderDocsSubView(trip) {
  const docs = (trip.documents || []).filter(d => uiState.docCategoryFilter === 'ALL' || d.category === uiState.docCategoryFilter);
  const cats = ['ALL', '入境資料', '簽證', '保險', '訂單'];

  return `
    <div class="space-y-3">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        ${cats.map(c => `
          <button onclick="setDocCategoryFilter('${c}')"
            class="shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition
            ${uiState.docCategoryFilter === c ? 'bg-charcoal text-white' : 'bg-white text-stone-600 border border-warmBorder'}">
            ${c === 'ALL' ? `全部 (${(trip.documents || []).length})` : c}
          </button>
        `).join('')}
      </div>

      <button onclick="openModal('ADD_DOC')"
        class="w-full py-3 rounded-2xl bg-sage hover:bg-sageDark text-white font-bold text-xs shadow-sm flex items-center justify-center gap-1.5 transition">
        <i data-lucide="file-plus" class="w-4 h-4"></i>
        <span>新增資料或文件</span>
      </button>

      ${docs.length === 0 ? `
        <div class="bg-white rounded-3xl p-10 text-center border border-warmBorder shadow-sm">
          <div class="w-12 h-12 rounded-2xl bg-cream text-stone-400 mx-auto flex items-center justify-center mb-2">
            <i data-lucide="folder-open" class="w-6 h-6"></i>
          </div>
          <div class="text-sm font-bold text-charcoal">尚無入境資料或文件</div>
          <p class="text-xs text-stone-400 mt-1">可記錄護照效期、保險單號、訂房確認碼，自動追蹤到期日</p>
        </div>
      ` : docs.map(doc => `
        <div class="bg-white rounded-2xl p-4 border border-warmBorder shadow-sm flex items-start justify-between gap-3">
          <div>
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[10px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">${escapeHtml(doc.category)}</span>
              ${doc.expiry ? `<span class="text-[10px] text-amber-700 font-semibold">到期日：${escapeHtml(doc.expiry)}</span>` : ''}
            </div>
            <h4 class="text-sm font-extrabold text-charcoal">${escapeHtml(doc.title)}</h4>
            <p class="text-xs text-stone-500 mt-1">${escapeHtml(doc.note || '')}</p>
          </div>
          <button onclick="deleteDoc('${doc.id}')" class="text-stone-300 hover:text-red-500">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>

/**
 * ============================================================================
 * TAB 6: 成員管理與個人預計分攤預覽 (Members)
 * ============================================================================
 */
function renderMembersTab(trip) {
  const fin = calculateTripFinancials(trip);

  return `
    <div class="px-4 pt-3 space-y-3.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <h2 class="text-base font-extrabold text-charcoal">成員管理</h2>
          <span class="text-xs font-bold bg-sageLight text-sageDark px-2.5 py-0.5 rounded-full">
            ${trip.members.length} 位旅伴
          </span>
        </div>
        <button onclick="openModal('ADD_MEMBER')"
          class="bg-sage hover:bg-sageDark text-white text-xs font-bold px-3.5 py-2 rounded-full flex items-center gap-1 shadow-sm active:scale-95 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>新增成員</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        ${trip.members.map(m => {
          const totalTWD = fin.memberTotals[m.id]?.totalTWD || 0;
          return `
            <div onclick="openModal('MEMBER_DETAIL', '${m.id}')"
              class="bg-white rounded-3xl p-4 border border-warmBorder shadow-sm hover:shadow-md transition cursor-pointer flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-full bg-cream border-2 border-sageLight flex items-center justify-center text-3xl mb-2.5 shadow-inner">
                ${m.avatar}
              </div>
              <div class="text-sm font-extrabold text-charcoal truncate w-full">${escapeHtml(m.name)}</div>
              <div class="mt-3 w-full bg-sageLight/70 rounded-2xl py-2 px-2">
                <div class="text-[10px] font-semibold text-stone-500">預計分攤總額</div>
                <div class="text-sm font-black text-sageDark mt-0.5">NT$ ${totalTWD.toLocaleString()}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/**
 * ============================================================================
 * 彈窗系統 (Modals)
 * ============================================================================
 */
function renderModalLayer(trip) {
  if (!uiState.modal) return '';
  const { type, payload } = uiState.modal;

  let content = '';

  // 1. 首頁 / 行程切換器
  if (type === 'HOME_SWITCHER') {
    content = `
      <div class="p-5 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-black text-charcoal">我的旅遊手帳</h2>
            <p class="text-xs text-stone-400">準備好出發了嗎？</p>
          </div>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-stone-500">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <button onclick="openModal('CREATE_NEW_TRIP')"
          class="w-full py-4 rounded-3xl bg-sage hover:bg-sageDark text-white font-extrabold text-sm shadow-md flex items-center justify-center gap-2 transition">
          <i data-lucide="plus" class="w-5 h-5"></i>
          <span>建立新行程</span>
        </button>

        <!-- 輸入行程碼加入 -->
        <form onsubmit="joinTripByCode(event)" class="flex items-center gap-2">
          <input type="text" id="trip_code_input" placeholder="輸入行程碼 (如 HIJ319)..."
            class="flex-1 bg-white rounded-2xl px-4 py-3 text-xs border border-warmBorder focus:outline-none focus:border-sage uppercase" />
          <button type="submit" class="w-11 h-11 rounded-2xl bg-charcoal text-white flex items-center justify-center shrink-0">
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <div class="space-y-2">
          <div class="text-xs font-bold text-stone-500">我的收藏行程</div>
          ${appState.trips.map(t => `
            <div onclick="selectTrip('${t.id}')"
              class="bg-white rounded-2xl p-3.5 border ${t.id === trip.id ? 'border-sage ring-2 ring-sage/20' : 'border-warmBorder'} flex items-center justify-between cursor-pointer hover:bg-cream/40 transition">
              <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-sageLight text-sage flex items-center justify-center shrink-0">
                  <i data-lucide="plane" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                  <div class="text-sm font-extrabold text-charcoal truncate">${escapeHtml(t.title)}</div>
                  <div class="text-[11px] font-mono text-stone-400 mt-0.5">Code: ${t.code} · ${t.days.length} 天</div>
                </div>
              </div>
              ${appState.trips.length > 1 ? `
                <button onclick="event.stopPropagation(); deleteTrip('${t.id}')" class="text-stone-300 hover:text-red-500 p-1.5">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              ` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // 2. 建立新行程表單
  else if (type === 'CREATE_NEW_TRIP') {
    content = `
      <form onsubmit="submitCreateTrip(event)" class="p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-charcoal">建立新旅遊手帳</h3>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">行程名稱</label>
          <input type="text" name="title" required placeholder="例如：東京富士山5天4夜自由行"
            class="w-full bg-white rounded-2xl px-4 py-3 text-xs border border-warmBorder focus:outline-none focus:border-sage" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">出發日期</label>
            <input type="date" name="startDate" required value="2027-03-19"
              class="w-full bg-white rounded-2xl px-3 py-2.5 text-xs border border-warmBorder" />
          </div>
          <div>
            <label class="block text-xs font-bold text-stone-600 mb-1">旅遊天數</label>
            <input type="number" name="daysCount" min="1" max="30" value="6" required
              class="w-full bg-white rounded-2xl px-3 py-2.5 text-xs border border-warmBorder" />
          </div>
        </div>
        <button type="submit" class="w-full py-3.5 rounded-2xl bg-sage text-white font-extrabold text-xs shadow-md">
          確認建立行程
        </button>
      </form>
    `;
  }

  // 3. 選擇項目類型 (5大規劃功能)
  else if (type === 'ADD_TYPE_SELECTOR') {
    const cards = [
      { id: 'SPOT', label: '景點', icon: 'camera', bg: 'bg-emerald-50', color: 'text-emerald-600' },
      { id: 'FOOD', label: '美食', icon: 'utensils', bg: 'bg-amber-50', color: 'text-amber-600' },
      { id: 'TRANSPORT', label: '交通', icon: 'train-front', bg: 'bg-sky-50', color: 'text-sky-600' },
      { id: 'HOTEL', label: '住宿', icon: 'bed-double', bg: 'bg-purple-50', color: 'text-purple-600' },
      { id: 'FLIGHT', label: '航班', icon: 'plane', bg: 'bg-teal-50', color: 'text-teal-600' }
    ];
    content = `
      <div class="p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-charcoal">選擇項目類型</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center text-stone-500">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div class="grid grid-cols-2 gap-3">
          ${cards.map(c => `
            <button onclick="openModal('ITEM_FORM', { type: '${c.id}' })"
              class="bg-white hover:bg-cream/60 rounded-3xl p-5 border border-warmBorder shadow-sm flex flex-col items-center justify-center gap-2.5 active:scale-95 transition">
              <div class="w-12 h-12 rounded-2xl ${c.bg} ${c.color} flex items-center justify-center">
                <i data-lucide="${c.icon}" class="w-6 h-6"></i>
              </div>
              <span class="text-sm font-extrabold text-charcoal">${c.label}</span>
            </button>
          `).join('')}
        </div>
        <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-white border border-warmBorder text-xs font-bold text-stone-600">
          取消
        </button>
      </div>
    `;
  }

  // 4. 新增 / 編輯行程項目表單 (支援航班、交通、圖片位置、潛在花費、分攤成員)
  else if (type === 'ITEM_FORM' || type === 'EDIT_ITEM') {
    const existingItem = type === 'EDIT_ITEM'
      ? trip.days.flatMap(d => d.items).find(i => i.id === payload)
      : null;
    const itemType = existingItem ? existingItem.type : (payload?.type || 'SPOT');
    const meta = ITEM_TYPES[itemType] || ITEM_TYPES.SPOT;
    const selectedMembers = existingItem ? (existingItem.memberIds || []) : trip.members.map(m => m.id);

    content = `
      <form onsubmit="submitItemForm(event, '${existingItem ? existingItem.id : ''}', '${itemType}')" class="p-5 space-y-3.5 max-h-[85vh] overflow-y-auto">
        <div class="flex items-center justify-between sticky top-0 bg-[#F5F3EB] pb-2 z-10">
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${meta.bg} ${meta.color}">${meta.label}</span>
            <h3 class="text-base font-extrabold text-charcoal">${existingItem ? '編輯項目' : `新增${meta.label}`}</h3>
          </div>
          <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-white border border-warmBorder flex items-center justify-center">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-stone-500 mb-1">時間</label>
            <input type="time" name="time" value="${existingItem?.time || '09:00'}" required
              class="w-full bg-white rounded-xl px-3 py-2 text-xs border border-warmBorder" />
          </div>
          <div class="col-span-2">
            <label class="block text-[11px] font-bold text-stone-500 mb-1">標題 *</label>
            <input type="text" name="title" required value="${escapeHtml(existingItem?.title || '')}"
              placeholder="輸入${meta.label}名稱..."
              class="w-full bg-white rounded-xl px-3 py-2 text-xs border border-warmBorder" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-stone-500 mb-1">地點 / 地址</label>
          <input type="text" name="location" value="${escapeHtml(existingItem?.location || '')}"
            placeholder="輸入地址或地標名稱 (可一鍵開啟地圖)"
            class="w-full bg-white rounded-xl px-3 py-2 text-xs border border-warmBorder" />
        </div>

        ${itemType === 'FLIGHT' ? `
          <div class="bg-white rounded-2xl p-3 border border-warmBorder space-y-2.5">
            <div class="text-xs font-extrabold text-teal-700">✈️ 航班詳細資訊</div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="airline" value="${escapeHtml(existingItem?.airline || '')}" placeholder="航空公司 (例: 中華航空)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="flightNo" value="${escapeHtml(existingItem?.flightNo || '')}" placeholder="航班代號 (例: CI112)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="depCity" value="${escapeHtml(existingItem?.depCity || '')}" placeholder="起飛城市 (例: 台北桃園)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="depCode" value="${escapeHtml(existingItem?.depCode || '')}" placeholder="起飛代碼 (例: TPE)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="arrCity" value="${escapeHtml(existingItem?.arrCity || '')}" placeholder="抵達城市 (例: 廣島)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="arrCode" value="${escapeHtml(existingItem?.arrCode || '')}" placeholder="抵達代碼 (例: HIJ)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-3 gap-2">
              <input type="text" name="arrTime" value="${escapeHtml(existingItem?.arrTime || '10:25')}" placeholder="抵達時間" class="bg-cream rounded-xl px-2.5 py-2 text-xs border border-warmBorder" />
              <input type="text" name="checkedBag" value="${escapeHtml(existingItem?.checkedBag || '23kg')}" placeholder="託運kg" class="bg-cream rounded-xl px-2.5 py-2 text-xs border border-warmBorder" />
              <input type="text" name="carryOnBag" value="${escapeHtml(existingItem?.carryOnBag || '7kg')}" placeholder="手提kg" class="bg-cream rounded-xl px-2.5 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="layoverCode" value="${escapeHtml(existingItem?.layoverCode || '')}" placeholder="轉機代碼 (選填)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="layoverDuration" value="${escapeHtml(existingItem?.layoverDuration || '')}" placeholder="轉機停留 (如 停 1h20m)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
          </div>
        ` : ''}

        ${itemType === 'TRANSPORT' ? `
          <div class="bg-white rounded-2xl p-3 border border-warmBorder space-y-2.5">
            <div class="text-xs font-extrabold text-sky-700">🚆 交通路線與票券</div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="transportMode" value="${escapeHtml(existingItem?.transportMode || '電車 ・ 約 30 分鐘')}" placeholder="交通方式" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="passTag" value="${escapeHtml(existingItem?.passTag || '')}" placeholder="票券標籤 (如 JR周遊券)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="depStation" value="${escapeHtml(existingItem?.depStation || '')}" placeholder="出發站名" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="arrStation" value="${escapeHtml(existingItem?.arrStation || '')}" placeholder="抵達站名" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" name="viaStation" value="${escapeHtml(existingItem?.viaStation || '')}" placeholder="轉乘/經由站" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
              <input type="text" name="arrTime" value="${escapeHtml(existingItem?.arrTime || '')}" placeholder="預計抵達時間 (如 10:30)" class="bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            </div>
          </div>
        ` : ''}

        <!-- 費用與潛在花費 -->
        <div class="bg-white rounded-2xl p-3 border border-warmBorder space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold text-charcoal">💰 每人預計費用</span>
            <label class="inline-flex items-center gap-1.5 text-xs font-bold text-terracotta cursor-pointer">
              <input type="checkbox" name="isPotential" ${existingItem?.isPotential ? 'checked' : ''} class="accent-[#D97736]" />
              <span>列入潛在花費 (不確定會花)</span>
            </label>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <input type="number" step="0.01" name="price" value="${existingItem?.price || ''}" placeholder="0"
              class="col-span-2 bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
            <select name="currency" class="bg-cream rounded-xl px-2.5 py-2 text-xs border border-warmBorder font-bold">
              ${Object.keys(trip.rates || DEFAULT_RATES).map(cur => `
                <option value="${cur}" ${(existingItem?.currency || 'JPY') === cur ? 'selected' : ''}>${cur}</option>
              `).join('')}
            </select>
          </div>
          <label class="inline-flex items-center gap-1.5 text-[11px] text-stone-500 cursor-pointer">
            <input type="checkbox" name="includeTax" ${existingItem?.includeTax ? 'checked' : ''} class="accent-[#5B7A58]" />
            <span>加計 1.5% 海外刷卡手續費</span>
          </label>
        </div>

        <!-- 參與分攤人員 -->
        <div class="bg-white rounded-2xl p-3 border border-warmBorder">
          <div class="text-xs font-bold text-charcoal mb-2">參與人員</div>
          <div class="flex flex-wrap gap-1.5">
            ${trip.members.map(m => `
              <label class="inline-flex items-center gap-1 bg-cream px-2.5 py-1.5 rounded-full text-xs font-semibold cursor-pointer border border-warmBorder">
                <input type="checkbox" name="memberIds" value="${m.id}" ${selectedMembers.includes(m.id) ? 'checked' : ''} class="accent-[#5B7A58]" />
                <span>${m.avatar} ${escapeHtml(m.name)}</span>
              </label>
            `).join('')}
          </div>
        </div>

        <!-- 相片上傳與卡片顯示位置 -->
        <div class="bg-white rounded-2xl p-3 border border-warmBorder space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-charcoal">🖼️ 相片 / 卡片顯示位置</span>
            <label class="text-[11px] font-bold text-sage bg-sageLight px-2.5 py-1 rounded-full cursor-pointer">
              + 上傳本機圖片
              <input type="file" accept="image/*" class="hidden" onchange="handleItemImageUpload(event)" />
            </label>
          </div>
          <input type="text" id="item_image_url" name="imageUrl" value="${escapeHtml(existingItem?.images?.[0] || '')}"
            placeholder="或貼上圖片網址 (https://...)"
            class="w-full bg-cream rounded-xl px-3 py-2 text-xs border border-warmBorder" />
          <div class="grid grid-cols-3 gap-1.5">
            ${[
              { id: 'top', label: '頂部封面' },
              { id: 'middle', label: '虛線下方' },
              { id: 'bottom', label: '卡片最底' }
            ].map(pos => `
              <label class="text-center py-1.5 px-2 rounded-xl border text-[11px] font-bold cursor-pointer bg-cream">
                <input type="radio" name="imagePos" value="${pos.id}" ${(existingItem?.imagePos || 'top') === pos.id ? 'checked' : ''} class="mr-1 accent-[#5B7A58]" />
                ${pos.label}
              </label>
            `).join('')}
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-stone-500 mb-1">備註 / 攻略心得</label>
          <textarea name="notes" rows="3" placeholder="輸入注意事項、營業時間、預約編號..."
            class="w-full bg-white rounded-2xl p-3 text-xs border border-warmBorder">${escapeHtml(existingItem?.notes || '')}</textarea>
        </div>

        <div class="flex items-center gap-2 pt-1">
          ${existingItem ? `
            <button type="button" onclick="deleteItineraryItem('${existingItem.id}')"
              class="px-4 py-3 rounded-2xl bg-red-50 text-red-600 font-bold text-xs border border-red-200">
              刪除項目
            </button>
          ` : ''}
          <button type="submit" class="flex-1 py-3 rounded-2xl bg-sage hover:bg-sageDark text-white font-extrabold text-xs shadow-md">
            ${existingItem ? '確認修改' : '加入行程'}
          </button>
        </div>
      </form>
    `;
  }

  // 5. 對調日期確認彈窗
  else if (type === 'SWAP_DAYS_CONFIRM') {
    const { idxA, idxB } = payload;
    const dayA = trip.days[idxA];
    const dayB = trip.days[idxB];
    const fmtA = formatDateParts(dayA.date);
    const fmtB = formatDateParts(dayB.date);

    content = `
      <div class="p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-base font-extrabold text-charcoal flex items-center gap-1.5">
            <i data-lucide="arrow-left-right" class="w-4 h-4 text-sage"></i>
            <span>確認對調日期</span>
          </h3>
          <button onclick="cancelSwapDays()" class="w-8 h-8 rounded-full bg-cream flex items-center justify-center">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <p class="text-xs text-stone-500">確定要將以下兩天的地點與所有行程內容互相對調嗎？</p>

        <div class="space-y-2">
          <div class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">Day ${idxA + 1}</span>
              <div class="text-sm font-extrabold text-charcoal mt-1">${dayA.themeEmoji || '📍'} ${escapeHtml(dayA.themeTitle)}</div>
            </div>
            <div class="text-right text-xs">
              <div class="font-bold text-charcoal">${fmtA.md} (${fmtA.weekday})</div>
              <div class="text-stone-400">${dayA.items.length} 個行程</div>
            </div>
          </div>

          <div class="flex justify-center">
            <span class="w-8 h-8 rounded-full bg-terracottaLight text-terracotta flex items-center justify-center">
              <i data-lucide="arrow-up-down" class="w-4 h-4"></i>
            </span>
          </div>

          <div class="bg-white rounded-2xl p-3.5 border border-warmBorder flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold bg-sageLight text-sageDark px-2 py-0.5 rounded-full">Day ${idxB + 1}</span>
              <div class="text-sm font-extrabold text-charcoal mt-1">${dayB.themeEmoji || '📍'} ${escapeHtml(dayB.themeTitle)}</div>
            </div>
            <div class="text-right text-xs">
              <div class="font-bold text-charcoal">${fmtB.md} (${fmtB.weekday})</div>
              <div class="text-stone-400">${dayB.items.length} 個行程</div>
            </div>
          </div>

// 日期點擊與對調邏輯
function handleDayClick(idx) {
  if (uiState.swapSourceDayIndex !== null) {
    if (uiState.swapSourceDayIndex === idx) {
      uiState.swapSourceDayIndex = null;
      render();
      return;
    }
    openModal('SWAP_DAYS_CONFIRM', { idxA: uiState.swapSourceDayIndex, idxB: idx });
    return;
  }
  uiState.activeDayIndex = idx;
  render();
}

function toggleSwapMode() {
  if (uiState.swapSourceDayIndex !== null) {
    uiState.swapSourceDayIndex = null;
    showToast('已取消對調模式');
  } else {
    uiState.swapSourceDayIndex = uiState.activeDayIndex;
    showToast('請點選另一天進行日期內容對調');
  }
  render();
}

function cancelSwapDays() {
  uiState.swapSourceDayIndex = null;
  closeModal();
}

function confirmSwapDays(idxA, idxB) {
  const trip = getCurrentTrip();
  const dayA = trip.days[idxA];
  const dayB = trip.days[idxB];
  const tempItems = dayA.items;
  const tempEmoji = dayA.themeEmoji;
  const tempTitle = dayA.themeTitle;

  dayA.items = dayB.items;
  dayA.themeEmoji = dayB.themeEmoji;
  dayA.themeTitle = dayB.themeTitle;

  dayB.items = tempItems;
  dayB.themeEmoji = tempEmoji;
  dayB.themeTitle = tempTitle;

  uiState.swapSourceDayIndex = null;
  uiState.activeDayIndex = idxB;
  saveState();
  closeModal();
  showToast('已完成兩天行程對調！');
}

function addNewDay() {
  const trip = getCurrentTrip();
  const lastDay = trip.days[trip.days.length - 1];
  const parts = lastDay.date.split('-').map(Number);
  const nextDateObj = new Date(parts[0], parts[1] - 1, parts[2] + 1);
  const yyyy = nextDateObj.getFullYear();
  const mm = String(nextDateObj.getMonth() + 1).padStart(2, '0');
  const dd = String(nextDateObj.getDate()).padStart(2, '0');

  trip.days.push({
    id: 'day_' + Date.now(),
    date: `${yyyy}-${mm}-${dd}`,
    themeEmoji: '✨',
    themeTitle: `第 ${trip.days.length + 1} 天`,
    items: []
  });
  uiState.activeDayIndex = trip.days.length - 1;
  saveState();
  render();
  showToast(`已新增 Day ${trip.days.length}`);
}

function submitEditDayInfo(e, dayIdx) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const trip = getCurrentTrip();
  trip.days[dayIdx].date = fd.get('date');

function confirmDeleteDay(dayIdx) {
  const trip = getCurrentTrip();
  if (trip.days.length <= 1) return;
  trip.days.splice(dayIdx, 1);
  uiState.activeDayIndex = Math.max(0, dayIdx - 1);

// 處理本機圖片上傳轉為壓縮 DataURL
function handleItemImageUpload(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressed = canvas.toDataURL('image/jpeg', 0.75);
      const urlInput = document.getElementById('item_image_url');
      if (urlInput) urlInput.value = compressed;
      showToast('已載入並最佳化圖片！');
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

// 新增或修改行程項目
function submitItemForm(e, existingId, itemType) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const trip = getCurrentTrip();
  const day = trip.days[uiState.activeDayIndex];
  const memberIds = fd.getAll('memberIds');
  const imageUrl = (fd.get('imageUrl') || '').trim();

  const itemData = {
    id: existingId || ('item_' + Date.now()),
    type: itemType,
    time: fd.get('time') || '09:00',
    title: fd.get('title'),
    location: fd.get('location') || '',
    price: Number(fd.get('price')) || 0,
    currency: fd.get('currency') || 'JPY',
    includeTax: fd.get('includeTax') === 'on',
    isPotential: fd.get('isPotential') === 'on',
    memberIds,
    notes: fd.get('notes') || '',
    images: imageUrl ? [imageUrl] : [],
    imagePos: fd.get('imagePos') || 'top',
    focalY: 50
  };

  if (itemType === 'FLIGHT') {
    itemData.airline = fd.get('airline') || '';
    itemData.flightNo = fd.get('flightNo') || '';
    itemData.depCity = fd.get('depCity') || '';
    itemData.depCode = fd.get('depCode') || '';
    itemData.depTime = itemData.time;
    itemData.arrCity = fd.get('arrCity') || '';
    itemData.arrCode = fd.get('arrCode') || '';
    itemData.arrTime = fd.get('arrTime') || '';
    itemData.checkedBag = fd.get('checkedBag') || '23kg';
    itemData.carryOnBag = fd.get('carryOnBag') || '7kg';
    itemData.layoverCode = fd.get('layoverCode') || '';
    itemData.layoverDuration = fd.get('layoverDuration') || '';
    itemData.hasLayover = Boolean(itemData.layoverCode);
  }

  if (itemType === 'TRANSPORT') {
    itemData.transportMode = fd.get('transportMode') || '電車';
    itemData.passTag = fd.get('passTag') || '';
    itemData.depStation = fd.get('depStation') || itemData.title;
    itemData.arrStation = fd.get('arrStation') || '';
    itemData.viaStation = fd.get('viaStation') || '';
    itemData.depTime = itemData.time;
    itemData.arrTime = fd.get('arrTime') || '';
  }

  if (existingId) {
    trip.days.forEach(d => {
      const idx = d.items.findIndex(i => i.id === existingId);
      if (idx !== -1) {
        itemData.segments = d.items[idx].segments || [];
        d.items[idx] = itemData;
      }
    });
    showToast('已更新行程項目');
  } else {
    day.items.push(itemData);
    day.items.sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    showToast('已成功新增行程！');
  }

  saveState();
  closeModal();
}

function deleteItineraryItem(itemId) {
  const trip = getCurrentTrip();
  trip.days.forEach(d => {
    d.items = d.items.filter(i => i.id !== itemId);
  });
  saveState();
  closeModal();
  showToast('已刪除該行程項目');
}

// 產生 LINE 純文字行程摘要
function generatePlainTextItinerary(trip, shareAll) {
  const daysToShare = shareAll ? trip.days : [trip.days[uiState.activeDayIndex]];
  const startIdx = shareAll ? 0 : uiState.activeDayIndex;

  let lines = [`📔 ${trip.title} (代碼: ${trip.code})`, ''];
  daysToShare.forEach((day, offset) => {
    const { md, weekday } = formatDateParts(day.date);
    lines.push(`📅 ${md} (${weekday}) Day ${startIdx + offset + 1}`);
    lines.push(`${day.themeEmoji || '📍'} ${day.themeTitle || ''}`);
    if (day.items.length === 0) {
      lines.push('  (今日尚無排定行程)');
    } else {
      day.items.forEach(it => {
        const icon = it.type === 'FLIGHT' ? '✈️' : it.type === 'TRANSPORT' ? '🚆' : it.type === 'FOOD' ? '🍴' : it.type === 'HOTEL' ? '🏨' : '📍';
        lines.push(`${icon} ${it.time} | ${it.title}`);
        if (it.type === 'FLIGHT') {
          lines.push(`   ${it.airline || ''} ${it.flightNo || ''} · ${it.depCity}${it.depCode} ➝ ${it.arrCity}${it.arrCode}`);
        } else if (it.type === 'TRANSPORT' && it.arrStation) {
          lines.push(`   ${it.depStation} ➝ ${it.arrStation} ${it.passTag ? `[${it.passTag}]` : ''}`);
        }
        if (Number(it.price) > 0) {
          lines.push(`   💰 費用：${it.currency} ${it.price} / 人`);
        }
      });
    }
    lines.push('');
  });
  return lines.join('\n').trim();
}

function submitCreateTrip(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const title = fd.get('title');
  const startDate = fd.get('startDate');
  const daysCount = Math.min(30, Math.max(1, Number(fd.get('daysCount')) || 3));
  const parts = startDate.split('-').map(Number);

  const days = [];
  for (let i = 0; i < daysCount; i++) {
    const d = new Date(parts[0], parts[1] - 1, parts[2] + i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    days.push({
      id: `d_${Date.now()}_${i}`,
      date: dateStr,
      themeEmoji: i === 0 ? '✈️' : '📍',
      themeTitle: i === 0 ? '出發日' : `第 ${i + 1} 天`,
      items: []
    });
  }

  const randomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
  const newTrip = {
    id: 'trip_' + Date.now(),
    code: randomCode,
    title,
    rates: { ...DEFAULT_RATES },
    poolBalance: 0,
    poolLogs: [],
    members: [{ id: 'm_' + Date.now(), name: '我', avatar: '🐶' }],
    days,
    expenses: [],
    journals: [],
    todos: [],
    packing: {},
    pocketList: [],
    documents: []
  };

  appState.trips.unshift(newTrip);
  appState.activeTripId = newTrip.id;
  uiState.activeDayIndex = 0;
  saveState();
  closeModal();
  showToast(`已建立新行程 (代碼: ${randomCode})`);
}

// HTML 安全轉義
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
