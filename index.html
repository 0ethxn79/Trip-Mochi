      // 記帳
      expenseSubTab: 'split', // 'split' | 'cash' | 'pool' | 'planned'

      expenses: [
        {

          customShares: {}
        }
      ],
      cashWallets: [
        { id: 'cw1', currency: 'JPY', initialAmount: 80000, note: '出發前換匯' },
        { id: 'cw2', currency: 'KRW', initialAmount: 0, note: '' },
        { id: 'cw3', currency: 'USD', initialAmount: 200, note: '備用美金' }
      ],
      publicPoolDeposits: [
        {
          id: 'pd1',
          date: '2027-03-19',
          contributorId: 'm1',
          custodianId: 'm1',
          currency: 'TWD',
          amount: 5000,
          note: '出發前公費繳交'
        },
        {
          id: 'pd2',
          date: '2027-03-19',
          contributorId: 'm2',
          custodianId: 'm2',
          currency: 'JPY',
          amount: 25000,
          note: '日幣公費（由鄭聿宸保管）'
        }
      ],
      plannedExpenses: [
        { id: 'pl1', title: 'JR 山陽山陰地區鐵路周遊券預估', amount: 23000, currency: 'JPY', note: '出發前先估算' }
      ]
    };

    let state = loadState();
    let dragMemberIndex = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          tripInfo: {
            ...structuredClone(DEFAULT_STATE.tripInfo),
            ...(parsed.tripInfo || {}),
            rates: {
              ...DEFAULT_STATE.tripInfo.rates,
              ...((parsed.tripInfo && parsed.tripInfo.rates) || {})
            }
          }
        };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function getMember(id) {
      return state.members.find(m => m.id === id) || { id, name: '未知成員', avatar: '👤', role: '旅伴' };
    }

    function getCurrentUser() {
      return getMember(state.currentUserId) || state.members[0];
    }

    function toTWD(amount, currency) {
      if (currency === 'TWD') return Number(amount) || 0;
      const rate = Number(state.tripInfo.rates[currency]) || 1;
      return Math.round((Number(amount) || 0) * rate);
    }

    function getAllCurrencies() {
      const base = ['TWD', 'JPY', 'KRW', 'USD'];
      const extra = Object.keys(state.tripInfo.rates || {}).filter(c => !base.includes(c));
      return [...base, ...extra];
    }

    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    }

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    // 1. 自動抓取最新匯率
    async function fetchLatestRates() {
      const btn = document.getElementById('btn-fetch-rates');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>抓取中...';
      }
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/TWD');
        const data = await res.json();
        if (data && data.result === 'success' && data.rates) {
          const currencies = getAllCurrencies().filter(c => c !== 'TWD');
          let updated = 0;
          currencies.forEach(code => {
            if (data.rates[code] && data.rates[code] > 0) {
              const twdPerUnit = Number((1 / data.rates[code]).toFixed(4));
              state.tripInfo.rates[code] = twdPerUnit;
              const inputEl = document.getElementById(`rate-input-${code}`);
              if (inputEl) inputEl.value = twdPerUnit;
              updated++;
            }
          });
          saveState();
          showToast(`已更新 ${updated} 種幣別最新匯率！`);
        } else {
          throw new Error('API 異常');
        }
      } catch (err) {
        showToast('自動抓取失敗，請檢查網路或手動輸入匯率');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i>自動抓取最新匯率';
        }
      }
    }

    // 行程與系統設定 Modal（1.匯率自動/手動、2.自訂Emoji、3.拖移排序）
    function openSettingsModal() {
      const currencies = getAllCurrencies().filter(c => c !== 'TWD');
      const presetEmojis = ['🐯', '🦊', '🐻', '🐰', '🐶', '🐱', '🐼', '🐨', '🦁', '🐸', '🐧', '🦄'];

      const membersHtml = state.members.map((m, idx) => `
        <div draggable="true"
             ondragstart="handleMemberDragStart(event, ${idx})"
             ondragover="handleMemberDragOver(event)"
             ondragleave="handleMemberDragLeave(event)"
             ondrop="handleMemberDrop(event, ${idx})"
             class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-2xl px-3 py-2.5 mb-2 cursor-move transition">
          <div class="flex items-center gap-2.5">
            <i class="fa-solid fa-grip-vertical text-gray-400 text-xs"></i>
            <span class="text-xl w-8 h-8 flex items-center justify-center bg-[#f3f1ea] rounded-full">${m.avatar}</span>
            <div>
              <div class="font-semibold text-sm flex items-center gap-1.5">
                ${m.name}
                ${state.currentUserId === m.id ? '<span class="text-[11px] bg-[#e6efe7] text-[#4f6f52] px-2 py-0.5 rounded-full">目前本機身分</span>' : ''}
              </div>
              <div class="text-[11px] text-gray-400">可拖移或用箭頭排序</div>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="moveMember(${idx}, -1)" class="p-1.5 text-gray-400 hover:text-gray-700"><i class="fa-solid fa-arrow-up text-xs"></i></button>
            <button onclick="moveMember(${idx}, 1)" class="p-1.5 text-gray-400 hover:text-gray-700"><i class="fa-solid fa-arrow-down text-xs"></i></button>
            ${state.members.length > 1 ? `<button onclick="removeMember('${m.id}')" class="p-1.5 text-red-400 hover:text-red-600"><i class="fa-solid fa-trash-can text-xs"></i></button>` : ''}
          </div>
        </div>
      `).join('');

      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold">⚙️ 行程與系統設定</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-[#f3f1ea] flex items-center justify-center text-gray-500">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="space-y-5 text-sm">
          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="font-bold text-[#4f6f52]">手冊基本資訊</div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">手冊名稱</label>
              <input id="set-title" type="text" value="${state.tripInfo.title}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-[#faf9f5]" />
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">本機操作身分（待辦留言將鎖定此身分）</label>
              <select id="set-current-user" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-[#faf9f5]">
                ${state.members.map(m => `<option value="${m.id}" ${m.id === state.currentUserId ? 'selected' : ''}>${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="flex items-center justify-between">
              <div class="font-bold text-[#4f6f52]">💱 匯率設定（1 外幣 = ? TWD）</div>
              <button id="btn-fetch-rates" onclick="fetchLatestRates()" class="text-xs bg-[#e6efe7] text-[#4f6f52] font-semibold px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-rotate mr-1"></i>自動抓取最新匯率
              </button>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              ${currencies.map(code => `
                <div class="bg-[#faf9f5] border border-[#e6e2d6] rounded-xl p-2.5">
                  <label class="text-xs font-semibold text-gray-600 block mb-1">${code} → TWD</label>
                  <input id="rate-input-${code}" type="number" step="0.0001" value="${state.tripInfo.rates[code] || ''}" class="w-full border border-[#e6e2d6] rounded-lg px-2.5 py-1.5 bg-white text-sm" />
                </div>
              `).join('')}
            </div>
            <div class="flex gap-2 pt-1">
              <input id="new-rate-code" type="text" maxlength="5" placeholder="新增幣別 如 EUR" class="flex-1 border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs uppercase bg-[#faf9f5]" />
              <input id="new-rate-val" type="number" step="0.0001" placeholder="匯率" class="w-24 border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs bg-[#faf9f5]" />
              <button onclick="addCustomCurrencyRate()" class="px-3 py-1.5 rounded-xl bg-[#4f6f52] text-white text-xs font-semibold">新增</button>
            </div>
          </div>

          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-3">
            <div class="flex items-center justify-between">
              <div class="font-bold text-[#4f6f52]">👥 旅伴成員管理（共 ${state.members.length} 人）</div>
              <span class="text-[11px] text-gray-400">拖移排序</span>
            </div>
            <div>${membersHtml}</div>
            <div class="pt-2 border-t border-[#e6e2d6] space-y-2">
              <div class="text-xs font-semibold text-gray-600">新增旅伴成員（可自行貼上手機表情符號）</div>
              <div class="flex gap-2">
                <input id="new-member-avatar" type="text" value="🐶" maxlength="4" placeholder="Emoji" class="w-16 text-center text-xl border border-[#e6e2d6] rounded-xl py-1.5 bg-[#faf9f5]" />
                <input id="new-member-name" type="text" placeholder="旅伴名稱" class="flex-1 border border-[#e6e2d6] rounded-xl px-3 py-1.5 bg-[#faf9f5]" />
                <button onclick="addMember()" class="px-4 py-1.5 rounded-xl btn-primary text-xs font-semibold">新增</button>
              </div>
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${presetEmojis.map(em => `
                  <button type="button" onclick="document.getElementById('new-member-avatar').value='${em}'" class="w-8 h-8 rounded-lg bg-[#f3f1ea] hover:bg-[#e6e2d6] text-base flex items-center justify-center">${em}</button>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="bg-white p-3.5 rounded-2xl border border-[#e6e2d6] space-y-2.5">
            <div class="font-bold text-[#4f6f52]">💾 JSON 備份與還原</div>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="exportJsonBackup()" class="py-2 px-3 rounded-xl border border-[#4f6f52] text-[#4f6f52] font-semibold text-xs">
                <i class="fa-solid fa-download mr-1"></i>匯出備份檔
              </button>
              <label class="py-2 px-3 rounded-xl bg-[#f3f1ea] text-gray-700 font-semibold text-xs text-center cursor-pointer">
                <i class="fa-solid fa-upload mr-1"></i>匯入還原檔
                <input type="file" accept=".json" onchange="importJsonBackup(event)" class="hidden" />
              </label>
            </div>
          </div>

          <button onclick="saveSettings()" class="w-full py-3 rounded-2xl btn-primary font-bold text-sm shadow">儲存設定</button>
        </div>
      `);
    }

    function addCustomCurrencyRate() {
      const code = (document.getElementById('new-rate-code').value || '').trim().toUpperCase();
      const val = parseFloat(document.getElementById('new-rate-val').value);
      if (!code || isNaN(val) || val <= 0) return showToast('請輸入正確的幣別與匯率');
      state.tripInfo.rates[code] = val;
      saveState();
      openSettingsModal();
      showToast(`已新增 ${code} 匯率`);
    }

    function addMember() {
      const avatar = (document.getElementById('new-member-avatar').value || '🙂').trim();
      const name = (document.getElementById('new-member-name').value || '').trim();
      if (!name) return showToast('請輸入旅伴名稱');
      const newId = 'm_' + Date.now();
      state.members.push({ id: newId, name, avatar: avatar || '🙂', role: '旅伴' });
      state.luggageItems.forEach(item => {
        if (!item.packedBy) item.packedBy = {};
        item.packedBy[newId] = false;
      });
      saveState();
      openSettingsModal();
      render();
      showToast(`已新增旅伴「${name}」`);
    }

    function removeMember(id) {
      if (state.members.length <= 1) return;
      state.members = state.members.filter(m => m.id !== id);
      if (state.currentUserId === id) state.currentUserId = state.members[0].id;
      if (state.expenseFilterMemberId === id) state.expenseFilterMemberId = 'all';
      saveState();
      openSettingsModal();
      render();
    }

    function moveMember(index, dir) {
      const target = index + dir;
      if (target < 0 || target >= state.members.length) return;
      const temp = state.members[index];
      state.members[index] = state.members[target];
      state.members[target] = temp;
      saveState();
      openSettingsModal();
      render();
    }

    function handleMemberDragStart(e, index) { dragMemberIndex = index; }
    function handleMemberDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleMemberDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleMemberDrop(e, targetIndex) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (dragMemberIndex === null || dragMemberIndex === targetIndex) return;
      const moved = state.members.splice(dragMemberIndex, 1)[0];
      state.members.splice(targetIndex, 0, moved);
      dragMemberIndex = null;
      saveState();
      openSettingsModal();
      render();
    }

    function saveSettings() {
      const title = document.getElementById('set-title').value.trim();
      if (title) state.tripInfo.title = title;
      state.currentUserId = document.getElementById('set-current-user').value;
      const currencies = getAllCurrencies().filter(c => c !== 'TWD');
      currencies.forEach(code => {
        const el = document.getElementById(`rate-input-${code}`);
        if (el) {
          const v = parseFloat(el.value);
          if (!isNaN(v) && v > 0) state.tripInfo.rates[code] = v;
        }
      });
      saveState();
      closeModal();
      render();
      showToast('設定已儲存');
    }

    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.tripInfo.title || '旅遊手冊'}_備份.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已匯出 JSON 備份檔');
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported.tripInfo || !imported.members) throw new Error('格式不符');
          state = { ...structuredClone(DEFAULT_STATE), ...imported };
          saveState();
          closeModal();
          render();
          showToast('備份還原成功！');
        } catch (err) {
          showToast('匯入失敗：檔案格式不正確');
        }
      };
      reader.readAsText(file);
    }

    function shareSummaryText() {
      const text = `【${state.tripInfo.title}】Code: ${state.tripInfo.code}\n成員：${state.members.map(m => m.avatar + m.name).join('、')}`;

      else showToast('已準備分享摘要');
    }

    function saveItineraryItem() {
      const title = document.getElementById('it-title').value.trim();
      if (!title) return showToast('請輸入行程名稱');
      const dayObj = state.days.find(d => d.day === state.selectedDay) || state.days[0];
      state.itinerary.push({
        id: 'it_' + Date.now(),
        day: state.selectedDay,
        date: dayObj.date,
        time: document.getElementById('it-time').value,
        category: document.getElementById('it-cat').value,
        title,
        location: document.getElementById('it-loc').value.trim(),
        legs: document.getElementById('it-legs').value.trim(),
        cost: Number(document.getElementById('it-cost').value) || 0,
        currency: document.getElementById('it-cur').value,
        plusOneDay: document.getElementById('it-plus1').checked,
        note: document.getElementById('it-note').value.trim()
      });
      saveState();
      closeModal();
      render();
      showToast(`已加入 Day ${state.selectedDay}`);
    }

    function sortDayItineraryByTime() {
      const others = state.itinerary.filter(i => i.day !== state.selectedDay);
      const sameDay = state.itinerary.filter(i => i.day === state.selectedDay).sort((a, b) => a.time.localeCompare(b.time));
      state.itinerary = [...others, ...sameDay];
      saveState();
      render();
      showToast('已依時間重新排序');
    }

    function openSwapDaysModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">日期行程對調</h3>
        <div class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">天數 A</label>
              <select id="swap-a" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${state.days.map(d => `<option value="${d.day}">Day ${d.day}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">天數 B</label>
              <select id="swap-b" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${state.days.map(d => `<option value="${d.day}" ${d.day===2?'selected':''}>Day ${d.day}</option>`).join('')}
              </select>
            </div>
          </div>
          <button onclick="executeSwapDays()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">確認對調行程內容</button>
        </div>
      `);
    }

    function executeSwapDays() {
      const a = Number(document.getElementById('swap-a').value);
      const b = Number(document.getElementById('swap-b').value);
      if (a === b) return showToast('請選擇不同的兩天');
      state.itinerary.forEach(item => {
        if (item.day === a) item.day = b;
        else if (item.day === b) item.day = a;
      });
      saveState();
      closeModal();
      render();
      showToast(`已對調 Day ${a} 與 Day ${b} 的行程`);
    }

    function moveItineraryItem(id, dir) {
      const sameDayIndices = state.itinerary
        .map((it, i) => ({ it, i }))
        .filter(x => x.it.day === state.selectedDay);
      const pos = sameDayIndices.findIndex(x => x.it.id === id);
      const targetPos = pos + dir;
      if (pos < 0 || targetPos < 0 || targetPos >= sameDayIndices.length) return;
      const idxA = sameDayIndices[pos].i;
      const idxB = sameDayIndices[targetPos].i;
      const tmp = state.itinerary[idxA];
      state.itinerary[idxA] = state.itinerary[idxB];
      state.itinerary[idxB] = tmp;
      saveState();
      render();
    }

    function convertItineraryToExpense(id) {
      const it = state.itinerary.find(x => x.id === id);
      if (!it || !it.cost) return;
      state.expenses.unshift({
        id: 'ex_' + Date.now(),
        date: it.date,
        category: it.category || '其他',
        title: it.title,
        amount: it.cost,
        currency: it.currency || 'JPY',
        payMethod: '現金支付',
        paidBy: state.currentUserId,
        splitMode: 'equal',
        splitWith: state.members.map(m => m.id),
        customShares: {}
      });
      saveState();
      showToast(`已將「${it.title}」轉入記帳明細`);
    }

    function deleteItineraryItem(id) {
      state.itinerary = state.itinerary.filter(x => x.id !== id);
      saveState();
      render();
    }

          : state.documents.filter(d => d.category === state.activeDocCategory);

        contentHtml = `
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-3">
            ${categories.map(cat => {
              const active = state.activeDocCategory === cat;
              const count = cat === '全部' ? state.documents.length : state.documents.filter(d => d.category === cat).length;
              return `
                <button onclick="state.activeDocCategory='${cat}'; saveState(); render();"
                  class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border ${active ? 'bg-[#2f332c] text-white border-[#2f332c]' : 'bg-white text-gray-700 border-[#e6e2d6]'}">
                  ${cat}${cat === '全部' || count > 0 ? ` (${count})` : ''}
                </button>
              `;
            }).join('')}
            <button onclick="openAddDocCategoryModal()" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-[#e6efe7] text-[#4f6f52] border border-[#cde0cf]">
              <i class="fa-solid fa-plus mr-1"></i>自訂母項目
            </button>
          </div>

          <button onclick="openAddDocumentModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
            <i class="fa-solid fa-file-circle-plus"></i> 新增資料或文件
          </button>

          ${filteredDocs.length === 0 ? `
            <div class="card-surface py-12 px-6 text-center">
              <div class="w-14 h-14 rounded-2xl bg-[#efede4] text-gray-400 flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-regular fa-folder-open"></i>
              </div>
              <div class="font-bold text-base mb-1">尚無${state.activeDocCategory === '全部' ? '' : state.activeDocCategory}資料或文件</div>
              <div class="text-xs text-gray-400">可記錄護照效期、保險單號、訂房確認碼或自訂母項目</div>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${filteredDocs.map(doc => `
                <div class="card-surface p-4 flex items-start justify-between gap-2">
                  <div>
                    <span class="inline-block text-[11px] bg-[#e6efe7] text-[#4f6f52] font-semibold px-2.5 py-0.5 rounded-full mb-1">${doc.category}</span>
                    <div class="font-bold text-sm">${doc.title}</div>
                    ${doc.refNo ? `<div class="text-xs font-mono text-gray-600 mt-0.5">單號/代碼：${doc.refNo}</div>` : ''}
                    ${doc.expiry ? `<div class="text-xs text-amber-700 mt-0.5">日期/效期：${doc.expiry}</div>` : ''}
                    ${doc.note ? `<div class="text-xs text-gray-500 mt-0.5">${doc.note}</div>` : ''}
                  </div>
                  <button onclick="deleteDocument('${doc.id}')" class="text-xs text-red-400">刪除</button>
                </div>
              `).join('')}
            </div>
          `}
        `;
      }

      if (state.listSubTab === 'luggage') {
        const viewingMemberId = state.luggageFilterMemberId || state.currentUserId;
        const viewingMember = getMember(viewingMemberId);
        const packedCount = state.luggageItems.filter(i => i.packedBy && i.packedBy[viewingMemberId]).length;

        contentHtml = `
          <div class="card-surface p-3.5 mb-3">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold text-gray-600">查看夥伴打包狀況</span>
              <span class="text-xs font-semibold text-[#4f6f52]">${viewingMember.avatar} ${viewingMember.name}：${packedCount}/${state.luggageItems.length}</span>
            </div>
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
              ${state.members.map(m => {
                const mPacked = state.luggageItems.filter(i => i.packedBy && i.packedBy[m.id]).length;
                const active = viewingMemberId === m.id;
                return `
                  <button onclick="state.luggageFilterMemberId='${m.id}'; saveState(); render();"
                    class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap border ${active ? 'btn-primary border-[#4f6f52]' : 'bg-white border-[#e6e2d6] text-gray-700'}">
                    ${m.avatar} ${m.name} (${mPacked}/${state.luggageItems.length})
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <button onclick="openAddLuggageModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
            <i class="fa-solid fa-plus"></i> 新增行李項目／警示提醒
          </button>

          <div class="space-y-2.5">
            ${state.luggageItems.map(item => {
              const isChecked = !!(item.packedBy && item.packedBy[viewingMemberId]);
              return `
                <div class="card-surface p-3.5">
                  <div class="flex items-start justify-between gap-2">
                    <label class="flex items-start gap-3 cursor-pointer flex-1">
                      <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleLuggagePack('${item.id}', '${viewingMemberId}')" class="mt-1 w-4 h-4 accent-[#4f6f52]" />
                      <div class="flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-semibold text-sm ${isChecked ? 'line-through text-gray-400' : ''}">${item.name}</span>
                          <span class="text-[11px] px-2 py-0.5 rounded-full bg-[#efede4] text-gray-600">${item.category}</span>
                        </div>
                        ${item.alertNote ? `
                          <div class="mt-1.5 text-xs bg-amber-50 border border-amber-200 text-amber-800 px-2.5 py-1 rounded-xl flex items-center gap-1.5">
                            <i class="fa-solid fa-triangle-exclamation text-amber-500"></i>
                            <span>${item.alertNote}</span>
                          </div>
                        ` : ''}
                        <div class="mt-2 flex flex-wrap gap-1.5">
                          ${state.members.map(m => {
                            const ok = !!(item.packedBy && item.packedBy[m.id]);
                            return `
                              <span class="text-[11px] px-2 py-0.5 rounded-full border ${ok ? 'bg-[#e6efe7] border-[#cde0cf] text-[#3d5a40]' : 'bg-white border-[#e6e2d6] text-gray-400'}">
                                ${m.avatar} ${m.name} ${ok ? '✓' : '未收'}
                              </span>
                            `;
                          }).join('')}
                        </div>
                      </div>
                    </label>
                    <div class="flex items-center gap-1">
                      <button onclick="openEditLuggageAlertModal('${item.id}')" class="text-xs text-amber-600 px-1.5 py-1" title="編輯警示提醒"><i class="fa-solid fa-bell"></i></button>
                      <button onclick="deleteLuggageItem('${item.id}')" class="text-xs text-red-400 px-1.5 py-1">刪除</button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (state.listSubTab === 'todo') {
        const me = getCurrentUser();
        contentHtml = `
          <div class="flex items-center justify-between bg-[#e6efe7] text-[#3d5a40] px-3.5 py-2 rounded-2xl text-xs mb-3">
            <span>目前本機留言身分：<strong>${me.avatar} ${me.name}</strong></span>
            <button onclick="openSettingsModal()" class="underline font-semibold">切換本機身分</button>
          </div>

          <button onclick="openAddTodoModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
            <i class="fa-solid fa-plus"></i> 新增待辦事項（可指定負責人）
          </button>

          <div class="space-y-3">
            ${state.todos.map(td => {
              const assignee = td.assigneeId === 'all' ? null : getMember(td.assigneeId);
              const comments = td.comments || [];
              return `
                <div class="card-surface p-4">
                  <div class="flex items-start justify-between gap-2">
                    <label class="flex items-start gap-2.5 cursor-pointer flex-1">
                      <input type="checkbox" ${td.done ? 'checked' : ''} onchange="toggleTodo('${td.id}')" class="mt-1 w-4 h-4 accent-[#4f6f52]" />
                      <div>
                        <div class="font-bold text-sm ${td.done ? 'line-through text-gray-400' : ''}">${td.title}</div>
                        <div class="mt-1">
                          ${assignee
                            ? `<span class="text-[11px] bg-[#f3f1ea] border border-[#e6e2d6] px-2.5 py-0.5 rounded-full font-medium">負責人：${assignee.avatar} ${assignee.name}</span>`
                            : `<span class="text-[11px] bg-[#e6efe7] text-[#3d5a40] px-2.5 py-0.5 rounded-full font-medium">👥 全體共同</span>`
                          }
                        </div>
                      </div>
                    </label>
                    <button onclick="deleteTodo('${td.id}')" class="text-xs text-red-400 px-2 py-1">刪除</button>
                  </div>

                  <div class="mt-3 pt-2.5 border-t border-[#e6e2d6]">
                    <button onclick="toggleTodoComments('${td.id}')" class="w-full flex items-center justify-between text-xs font-semibold text-gray-600 bg-white border border-[#e6e2d6] rounded-xl px-3 py-1.5">
                      <span><i class="fa-regular fa-comments mr-1.5 text-[#4f6f52]"></i>進度留言（${comments.length} 則）</span>
                      <span>${td.commentsExpanded ? '收合 ▲' : '展開 ▼'}</span>
                    </button>

                    ${td.commentsExpanded ? `
                      <div class="mt-2.5 space-y-2">
                        ${comments.map(c => {
                          const author = getMember(c.authorId);
                          return `
                            <div class="bg-white border border-[#e6e2d6] rounded-xl px-3 py-2 text-xs">
                              <div class="flex items-center justify-between text-[11px] text-gray-500 mb-0.5">
                                <span class="font-semibold text-gray-700">${author.avatar} ${author.name}</span>
                                <span>${c.createdAt}</span>
                              </div>
                              <div class="text-gray-800">${c.text}</div>
                            </div>
                          `;
                        }).join('')}
                        <div class="flex items-center gap-1.5 pt-1">
                          <span class="text-xs bg-[#f3f1ea] px-2.5 py-1.5 rounded-xl whitespace-nowrap font-semibold">${me.avatar} ${me.name}</span>
                          <input id="todo-comment-input-${td.id}" type="text" placeholder="以「${me.name}」身分留言..." class="flex-1 border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs bg-white" />
                          <button onclick="addTodoComment('${td.id}')" class="px-3 py-1.5 rounded-xl btn-primary text-xs font-semibold">送出</button>
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (state.listSubTab === 'wishlist') {
        contentHtml = `
          <button onclick="openAddWishlistModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
            <i class="fa-solid fa-plus"></i> 新增想去景點／美食
          </button>
          <div class="space-y-2.5">
            ${state.wishlist.map(w => `
              <div class="card-surface p-4 flex items-start justify-between gap-2">
                <div>
                  <span class="text-[11px] bg-[#efede4] px-2.5 py-0.5 rounded-full text-gray-600">${w.category}</span>
                  <div class="font-bold text-sm mt-1">${w.title}</div>
                  ${w.note ? `<div class="text-xs text-gray-500 mt-0.5">${w.note}</div>` : ''}
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="state.activeTab='itinerary'; openAddItineraryModal('${w.title.replace(/'/g,"\\'")}','${w.category}','${(w.note||'').replace(/'/g,"\\'")}');" class="text-xs bg-[#e6efe7] text-[#3d5a40] font-semibold px-2.5 py-1 rounded-xl">排入行程</button>
                  <button onclick="deleteWishlist('${w.id}')" class="text-xs text-red-400">刪除</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      return subNavHtml + contentHtml;
    }

    function openAddDocCategoryModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">自定義文件母項目</h3>
        <div class="space-y-3 text-sm">
          <input id="custom-doc-cat" type="text" placeholder="輸入新母項目名稱（如：交通票券）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <div class="flex flex-wrap gap-1.5">
            ${state.docCategories.map(c => `
              <span class="text-xs bg-white border border-[#e6e2d6] px-2.5 py-1 rounded-full flex items-center gap-1.5">
                ${c} <button onclick="removeDocCategory('${c}')" class="text-red-400">×</button>
              </span>
            `).join('')}
          </div>
          <button onclick="saveNewDocCategory()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">新增母項目</button>
        </div>
      `);
    }

    function saveNewDocCategory() {
      const name = (document.getElementById('custom-doc-cat').value || '').trim();
      if (!name) return showToast('請輸入母項目名稱');
      if (!state.docCategories.includes(name)) {
        state.docCategories.push(name);
        state.activeDocCategory = name;
        saveState();
      }
      closeModal();
      render();
      showToast(`已新增「${name}」母項目`);
    }

    function removeDocCategory(cat) {
      state.docCategories = state.docCategories.filter(c => c !== cat);
      if (state.activeDocCategory === cat) state.activeDocCategory = '全部';
      saveState();
      openAddDocCategoryModal();
      render();
    }

    function openAddDocumentModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增資料或文件</h3>
        <div class="space-y-3 text-sm">
          <input id="doc-cat-input" list="doc-cat-list" value="${state.activeDocCategory !== '全部' ? state.activeDocCategory : state.docCategories[0] || ''}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" placeholder="選擇或直接輸入新母項目" />
          <datalist id="doc-cat-list">${state.docCategories.map(c => `<option value="${c}">`).join('')}</datalist>
          <input id="doc-title" type="text" placeholder="文件名稱" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="doc-ref" type="text" placeholder="單號 / 確認碼（選填）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="doc-expiry" type="date" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="doc-note" type="text" placeholder="備註（選填）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <button onclick="saveDocument()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">儲存文件</button>
        </div>
      `);
    }

    function saveDocument() {
      const category = (document.getElementById('doc-cat-input').value || '其他').trim();
      const title = (document.getElementById('doc-title').value || '').trim();
      if (!title) return showToast('請輸入文件名稱');
      if (!state.docCategories.includes(category)) state.docCategories.push(category);
      state.documents.unshift({
        id: 'doc_' + Date.now(),
        category,
        title,
        refNo: document.getElementById('doc-ref').value.trim(),
        expiry: document.getElementById('doc-expiry').value,
        note: document.getElementById('doc-note').value.trim()
      });
      state.activeDocCategory = category;
      saveState();
      closeModal();
      render();
    }

    function deleteDocument(id) {
      state.documents = state.documents.filter(d => d.id !== id);
      saveState();
      render();
    }

    function toggleLuggagePack(itemId, memberId) {
      const item = state.luggageItems.find(i => i.id === itemId);
      if (!item) return;
      if (!item.packedBy) item.packedBy = {};
      item.packedBy[memberId] = !item.packedBy[memberId];
      saveState();
      render();
    }

    function openAddLuggageModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增行李與警示提醒</h3>
        <div class="space-y-3 text-sm">
          <input id="lug-name" type="text" placeholder="行李物品名稱" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="lug-cat" type="text" value="隨身重要" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="lug-alert" type="text" placeholder="警示提醒（選填，例如：不可託運！）" class="w-full border border-amber-300 rounded-xl px-3 py-2 bg-amber-50" />
          <button onclick="saveLuggageItem()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">加入行李清單</button>
        </div>
      `);
    }

    function saveLuggageItem() {
      const name = (document.getElementById('lug-name').value || '').trim();
      if (!name) return showToast('請輸入物品名稱');
      const packedBy = {};
      state.members.forEach(m => packedBy[m.id] = false);
      state.luggageItems.push({
        id: 'lug_' + Date.now(),
        name,
        category: document.getElementById('lug-cat').value.trim() || '一般',
        alertNote: document.getElementById('lug-alert').value.trim(),
        packedBy
      });
      saveState();
      closeModal();
      render();
    }

    function openEditLuggageAlertModal(id) {
      const item = state.luggageItems.find(i => i.id === id);
      if (!item) return;
      openModal(`
        <h3 class="text-base font-bold mb-3">編輯警示提醒 - ${item.name}</h3>
        <div class="space-y-3 text-sm">
          <input id="edit-lug-alert" type="text" value="${item.alertNote || ''}" placeholder="輸入警示提醒（留空可清除）" class="w-full border border-amber-300 rounded-xl px-3 py-2 bg-amber-50" />
          <button onclick="updateLuggageAlert('${id}')" class="w-full py-2.5 rounded-xl btn-primary font-semibold">儲存提醒</button>
        </div>
      `);
    }

    function updateLuggageAlert(id) {
      const item = state.luggageItems.find(i => i.id === id);
      if (item) {
        item.alertNote = document.getElementById('edit-lug-alert').value.trim();
        saveState();
      }
      closeModal();
      render();
    }

    function deleteLuggageItem(id) {
      state.luggageItems = state.luggageItems.filter(i => i.id !== id);
      saveState();
      render();
    }

    function openAddTodoModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增待辦事項</h3>
        <div class="space-y-3 text-sm">
          <input id="todo-title" type="text" placeholder="待辦內容" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <select id="todo-assignee" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
            <option value="all">👥 全體共同</option>
            ${state.members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('')}
          </select>
          <button onclick="saveTodo()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">新增待辦</button>
        </div>
      `);
    }

    function saveTodo() {
      const title = (document.getElementById('todo-title').value || '').trim();
      if (!title) return showToast('請輸入待辦內容');
      state.todos.unshift({
        id: 'td_' + Date.now(),
        title,
        assigneeId: document.getElementById('todo-assignee').value,
        done: false,
        commentsExpanded: false,
        comments: []
      });
      saveState();
      closeModal();
      render();
    }

    function toggleTodo(id) {
      const td = state.todos.find(t => t.id === id);
      if (td) { td.done = !td.done; saveState(); render(); }
    }

    function toggleTodoComments(id) {
      const td = state.todos.find(t => t.id === id);
      if (td) { td.commentsExpanded = !td.commentsExpanded; saveState(); render(); }
    }

    function addTodoComment(id) {
      const td = state.todos.find(t => t.id === id);
      const input = document.getElementById(`todo-comment-input-${id}`);
      if (!td || !input) return;
      const text = input.value.trim();
      if (!text) return showToast('請輸入進度內容');
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      td.comments.push({
        id: 'c_' + Date.now(),
        authorId: state.currentUserId,
        text,
        createdAt: timeStr
      });
      td.commentsExpanded = true;
      saveState();
      render();
    }

    function deleteTodo(id) {
      state.todos = state.todos.filter(t => t.id !== id);
      saveState();
      render();
    }

    function openAddWishlistModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增想去清單</h3>
        <div class="space-y-3 text-sm">
          <input id="wish-title" type="text" placeholder="地點或美食名稱" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="wish-cat" type="text" value="景點" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="wish-note" type="text" placeholder="備註" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <button onclick="saveWishlist()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">儲存</button>
        </div>
      `);
    }

    function saveWishlist() {
      const title = (document.getElementById('wish-title').value || '').trim();
      if (!title) return showToast('請輸入名稱');
      state.wishlist.unshift({
        id: 'w_' + Date.now(),
        title,
        category: document.getElementById('wish-cat').value.trim() || '景點',
        note: document.getElementById('wish-note').value.trim()
      });
      saveState();
      closeModal();
      render();
    }

    function deleteWishlist(id) {
      state.wishlist = state.wishlist.filter(w => w.id !== id);
      saveState();
      render();
    }

    // ==================== 7. 日誌分頁（支援已完成日誌後續編輯） ====================
    function renderJournalTab() {
      return `
        <button onclick="openJournalModal()" class="w-full py-3 rounded-2xl btn-primary font-semibold text-sm flex items-center justify-center gap-2 mb-4 shadow-xs">
          <i class="fa-solid fa-pen-nib"></i> 撰寫旅遊日誌
        </button>
        <div class="space-y-3">
          ${state.journals.map(jn => {
            const author = getMember(jn.authorId);
            return `
              <div class="card-surface p-4">
                <div class="flex items-center justify-between text-xs text-gray-500 mb-1.5">
                  <span>${jn.date} · ${author.avatar} ${author.name}</span>
                  <div class="flex items-center gap-2">
                    <button onclick="openJournalModal('${jn.id}')" class="text-[#4f6f52] font-semibold"><i class="fa-solid fa-pen-to-square mr-0.5"></i>編輯</button>
                    <button onclick="deleteJournal('${jn.id}')" class="text-red-400">刪除</button>
                  </div>
                </div>
                <div class="font-bold text-base mb-1">${jn.title}</div>
                <p class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">${jn.content}</p>
                ${jn.updatedAt ? `<div class="text-[11px] text-gray-400 mt-2">更新時間：${jn.updatedAt}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openJournalModal(editId = null) {
      const existing = editId ? state.journals.find(j => j.id === editId) : null;
      openModal(`
        <h3 class="text-base font-bold mb-3">${existing ? '編輯旅遊日誌' : '新增旅遊日誌'}</h3>
        <div class="space-y-3 text-sm">
          <input id="jn-date" type="date" value="${existing ? existing.date : state.tripInfo.startDate}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="jn-title" type="text" value="${existing ? existing.title : ''}" placeholder="日誌標題" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <textarea id="jn-content" rows="5" placeholder="記錄今天的心情與故事..." class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">${existing ? existing.content : ''}</textarea>
          <button onclick="saveJournal('${editId || ''}')" class="w-full py-2.5 rounded-xl btn-primary font-semibold">${existing ? '儲存修改' : '發佈日誌'}</button>
        </div>
      `);
    }

    function saveJournal(editId) {
      const title = document.getElementById('jn-title').value.trim();
      const content = document.getElementById('jn-content').value.trim();
      if (!title) return showToast('請輸入日誌標題');
      const now = new Date();
      const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      if (editId) {
        const target = state.journals.find(j => j.id === editId);
        if (target) {
          target.date = document.getElementById('jn-date').value;
          target.title = title;
          target.content = content;
          target.updatedAt = stamp;
        }
        showToast('日誌已更新');
      } else {
        state.journals.unshift({
          id: 'jn_' + Date.now(),
          date: document.getElementById('jn-date').value,
          title,
          content,
          authorId: state.currentUserId,
          updatedAt: stamp
        });
        showToast('日誌已儲存');
      }
      saveState();
      closeModal();
      render();
    }

    function deleteJournal(id) {
      state.journals = state.journals.filter(j => j.id !== id);
      saveState();
      render();
    }

    // ==================== 8, 9, 10. 記帳分頁 ====================

        { id: 'pool', icon: 'fa-solid fa-piggy-bank', label: '公費管理' },

            ${state.plannedExpenses.map(pl => `

                <div>
                  <div class="font-bold text-sm">${pl.title}</div>
                  ${pl.note ? `<div class="text-xs text-gray-500 mt-0.5">${pl.note}</div>` : ''}
                </div>
                <div class="text-right">
                  <div class="font-bold text-sm">${pl.currency} ${Number(pl.amount).toLocaleString()}</div>
                  <div class="text-[11px] text-gray-400">約 NT$ ${toTWD(pl.amount, pl.currency).toLocaleString()}</div>
                  <button onclick="deletePlannedExpense('${pl.id}')" class="text-xs text-red-400 mt-1">刪除</button>

              </div>

      return navHtml;

            </select>
            <select id="ex-paidby" class="border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">

              <option value="equal">平均分攤</option>
              <option value="custom">自訂每人分攤金額（原幣別）</option>
            </select>
            <div id="ex-equal-box" class="flex flex-wrap gap-2">
              ${state.members.map(m => `
                <label class="flex items-center gap-1.5 bg-white border border-[#e6e2d6] px-3 py-1.5 rounded-xl text-xs">
                  <input type="checkbox" name="ex-split" value="${m.id}" checked class="accent-[#4f6f52]" />

              `).join('')}
            </div>
            <div id="ex-custom-box" class="hidden space-y-1.5">
              ${state.members.map(m => `
                <div class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-xl px-3 py-1.5 text-xs">
                  <span>${m.avatar} ${m.name}</span>
                  <input type="number" data-share-uid="${m.id}" placeholder="0" class="w-28 border border-[#e6e2d6] rounded-lg px-2 py-1 text-right" />
                </div>
              `).join('')}
            </div>

    function toggleCustomShareBox() {
      const mode = document.getElementById('ex-split-mode').value;
      document.getElementById('ex-equal-box').classList.toggle('hidden', mode === 'custom');
      document.getElementById('ex-custom-box').classList.toggle('hidden', mode !== 'custom');
    }

    function saveExpense() {
      const title = document.getElementById('ex-title').value.trim();
      const amount = parseFloat(document.getElementById('ex-amount').value);
      const splitMode = document.getElementById('ex-split-mode').value;
      if (!title || isNaN(amount) || amount <= 0) return showToast('請輸入項目與有效金額');

      let splitWith = [];
      let customShares = {};

      if (splitMode === 'custom') {
        document.querySelectorAll('#ex-custom-box input[data-share-uid]').forEach(inp => {
          const val = parseFloat(inp.value) || 0;
          if (val > 0) {
            const uid = inp.getAttribute('data-share-uid');
            splitWith.push(uid);
            customShares[uid] = val;
          }
        });
        if (splitWith.length === 0) return showToast('請至少填寫一位成員的自訂金額');
      } else {
        splitWith = Array.from(document.querySelectorAll('input[name="ex-split"]:checked')).map(el => el.value);
        if (splitWith.length === 0) return showToast('請至少勾選一位分攤成員');
      }

      state.expenses.unshift({
        id: 'ex_' + Date.now(),
        date: document.getElementById('ex-date').value,
        category: document.getElementById('ex-cat').value,
        title,
        amount,
        currency: document.getElementById('ex-currency').value,
        payMethod: document.getElementById('ex-method').value,
        paidBy: document.getElementById('ex-paidby').value,
        splitMode,
        splitWith,
        customShares
      });
      saveState();
      closeModal();
      render();
      showToast('已新增支出紀錄');
    }

    function deleteExpense(id) {
      state.expenses = state.expenses.filter(e => e.id !== id);
      saveState();
      render();
    }

    function openSettlementModal() {
      const net = {};
      state.members.forEach(m => net[m.id] = 0);

      state.expenses.filter(ex => ex.payMethod !== '公費支付').forEach(ex => {
        const twd = toTWD(ex.amount, ex.currency);
        if (net[ex.paidBy] !== undefined) net[ex.paidBy] += twd;
        if (ex.splitMode === 'custom' && ex.customShares) {
          Object.entries(ex.customShares).forEach(([uid, shareAmt]) => {
            if (net[uid] !== undefined) net[uid] -= toTWD(shareAmt, ex.currency);
          });
        } else {
          const share = twd / ex.splitWith.length;
          ex.splitWith.forEach(uid => {
            if (net[uid] !== undefined) net[uid] -= share;
          });
        }
      });

      openModal(`
        <h3 class="text-base font-bold mb-3">⚖️ 個人分帳結算總覽 (TWD)</h3>
        <div class="space-y-2 text-sm mb-4">
          ${state.members.map(m => {
            const val = Math.round(net[m.id] || 0);
            return `
              <div class="flex items-center justify-between bg-white border border-[#e6e2d6] rounded-xl px-3.5 py-2.5">
                <span class="font-semibold">${m.avatar} ${m.name}</span>
                <span class="font-bold ${val >= 0 ? 'text-[#4f6f52]' : 'text-red-500'}">
                  ${val >= 0 ? `應收回 NT$ ${val.toLocaleString()}` : `應支付 NT$ ${Math.abs(val).toLocaleString()}`}
                </span>
              </div>
            `;
          }).join('')}
        </div>
        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-[#f3f1ea] font-semibold text-sm">關閉</button>
      `);
    }

    function openAddCashWalletModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增外幣現金袋</h3>
        <div class="space-y-3 text-sm">
          <div class="flex gap-1.5">
            ${['JPY', 'KRW', 'USD'].map(c => `
              <button type="button" onclick="document.getElementById('cw-currency').value='${c}'" class="px-3 py-1 rounded-lg bg-[#e6efe7] text-[#3d5a40] font-bold text-xs">${c}</button>
            `).join('')}
          </div>
          <input id="cw-currency" type="text" value="JPY" maxlength="6" placeholder="或手動輸入幣別（如 THB / EUR）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white uppercase font-semibold" />
          <input id="cw-amount" type="number" placeholder="初始現金額度" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="cw-note" type="text" placeholder="備註（選填）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <button onclick="saveCashWallet()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">建立外幣現金袋</button>
        </div>
      `);
    }

    function saveCashWallet() {
      const currency = (document.getElementById('cw-currency').value || '').trim().toUpperCase();
      const amount = parseFloat(document.getElementById('cw-amount').value);
      if (!currency || isNaN(amount) || amount < 0) return showToast('請輸入正確的幣別與金額');
      if (!state.tripInfo.rates[currency]) state.tripInfo.rates[currency] = 1;
      state.cashWallets.push({
        id: 'cw_' + Date.now(),
        currency,
        initialAmount: amount,
        note: document.getElementById('cw-note').value.trim()
      });
      saveState();
      closeModal();
      render();
      showToast(`已新增 ${currency} 現金袋`);
    }

    function deleteCashWallet(id) {
      state.cashWallets = state.cashWallets.filter(w => w.id !== id);
      saveState();
      render();
    }

    function openAddPoolDepositModal() {
      const currencies = getAllCurrencies();
      openModal(`
        <h3 class="text-base font-bold mb-3">新增公費入金</h3>
        <div class="space-y-3 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">出資人</label>
              <select id="pd-contrib" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
                ${state.members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-xs text-[#4f6f52] font-bold block mb-1">指定保管人</label>
              <select id="pd-custodian" class="w-full border border-[#4f6f52] rounded-xl px-3 py-2 bg-[#f4f8f4]">
                ${state.members.map(m => `<option value="${m.id}">${m.avatar} ${m.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500 block mb-1">幣別（可選或手動輸入）</label>
              <input id="pd-currency" list="pd-cur-list" value="TWD" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white uppercase font-semibold" />
              <datalist id="pd-cur-list">${currencies.map(c => `<option value="${c}">`).join('')}</datalist>
            </div>
            <div>
              <label class="text-xs text-gray-500 block mb-1">入金金額</label>
              <input id="pd-amount" type="number" placeholder="0" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
            </div>
          </div>
          <input id="pd-date" type="date" value="${state.tripInfo.startDate}" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <input id="pd-note" type="text" placeholder="備註（選填）" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <button onclick="savePoolDeposit()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">確認入金</button>
        </div>
      `);
    }

    function savePoolDeposit() {
      const currency = (document.getElementById('pd-currency').value || 'TWD').trim().toUpperCase();
      const amount = parseFloat(document.getElementById('pd-amount').value);
      if (!currency || isNaN(amount) || amount <= 0) return showToast('請輸入正確的幣別與金額');
      if (!state.tripInfo.rates[currency]) state.tripInfo.rates[currency] = 1;
      state.publicPoolDeposits.unshift({
        id: 'pd_' + Date.now(),
        date: document.getElementById('pd-date').value,
        contributorId: document.getElementById('pd-contrib').value,
        custodianId: document.getElementById('pd-custodian').value,
        currency,
        amount,
        note: document.getElementById('pd-note').value.trim()
      });
      saveState();
      closeModal();
      render();
      showToast('已記錄公費入金');
    }

    function deletePoolDeposit(id) {
      state.publicPoolDeposits = state.publicPoolDeposits.filter(d => d.id !== id);
      saveState();
      render();
    }

    function openAddPlannedExpenseModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">新增潛在 / 預估花費</h3>
        <div class="space-y-3 text-sm">
          <input id="pl-title" type="text" placeholder="項目名稱" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <div class="grid grid-cols-2 gap-2">
            <select id="pl-cur" class="border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white">
              ${getAllCurrencies().map(c => `<option value="${c}" ${c==='JPY'?'selected':''}>${c}</option>`).join('')}
            </select>
            <input id="pl-amt" type="number" placeholder="預估金額" class="border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          </div>
          <input id="pl-note" type="text" placeholder="備註" class="w-full border border-[#e6e2d6] rounded-xl px-3 py-2 bg-white" />
          <button onclick="savePlannedExpense()" class="w-full py-2.5 rounded-xl btn-primary font-semibold">儲存預估</button>
        </div>
      `);
    }

    function savePlannedExpense() {
      const title = document.getElementById('pl-title').value.trim();
      const amount = parseFloat(document.getElementById('pl-amt').value);
      if (!title || isNaN(amount) || amount <= 0) return showToast('請輸入項目與金額');
      state.plannedExpenses.push({
        id: 'pl_' + Date.now(),
        title,
        currency: document.getElementById('pl-cur').value,
        amount,
        note: document.getElementById('pl-note').value.trim()
      });
      saveState();
      closeModal();
      render();
    }

    function deletePlannedExpense(id) {
      state.plannedExpenses = state.plannedExpenses.filter(p => p.id !== id);
      saveState();
      render();
    }

    // ==================== 成員分頁 ====================
    function renderMembersTab() {
      return `
        <div class="card-surface p-4 mb-4 flex items-center justify-between">
          <div>
            <div class="font-bold text-sm">旅伴成員名單（共 ${state.members.length} 人）</div>
            <div class="text-xs text-gray-500 mt-0.5">支援自行貼上表情符號、調整順序與切換本機身分</div>
          </div>
          <button onclick="openSettingsModal()" class="px-3.5 py-2 rounded-xl btn-primary text-xs font-semibold">管理 / 新增</button>
        </div>
        <div class="space-y-2.5">
          ${state.members.map((m, idx) => `
            <div class="card-surface p-4 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <span class="text-2xl w-10 h-10 rounded-full bg-white border border-[#e6e2d6] flex items-center justify-center">${m.avatar}</span>
                <div>
                  <div class="font-bold text-sm flex items-center gap-1.5">
                    ${m.name}
                    ${state.currentUserId === m.id ? '<span class="text-[10px] bg-[#e6efe7] text-[#4f6f52] px-2 py-0.5 rounded-full">本機身分</span>' : ''}
                  </div>
                  <div class="text-xs text-gray-400">排序 #${idx + 1}</div>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="moveMember(${idx}, -1)" class="p-2 text-gray-400 hover:text-gray-700"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                <button onclick="moveMember(${idx}, 1)" class="p-2 text-gray-400 hover:text-gray-700"><i class="fa-solid fa-arrow-down text-xs"></i></button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ==================== 底部導覽列 ====================
    function renderBottomNav() {
      const navs = [
        { id: 'itinerary', icon: 'fa-regular fa-calendar', label: '行程' },
        { id: 'booking', icon: 'fa-solid fa-plane-departure', label: '預訂' },
        { id: 'list', icon: 'fa-solid fa-list-check', label: '清單' },
        { id: 'journal', icon: 'fa-solid fa-book-open', label: '日誌' },
        { id: 'expense', icon: 'fa-solid fa-wallet', label: '記帳' },
        { id: 'members', icon: 'fa-solid fa-users', label: '成員' }
      ];
      return `
        <nav class="fixed bottom-0 left-0 right-0 bg-[#faf9f5]/95 backdrop-blur border-t border-[#e6e2d6] z-40">
          <div class="max-w-md mx-auto grid grid-cols-6 py-2">
            ${navs.map(n => {
              const active = state.activeTab === n.id;
              return `
                <button onclick="state.activeTab='${n.id}'; saveState(); render();"
                  class="flex flex-col items-center justify-center gap-1 py-1 ${active ? 'text-[#4f6f52] font-bold' : 'text-gray-400'}">
                  <i class="${n.icon} text-sm"></i>
                  <span class="text-[10px]">${n.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </nav>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      let body = '';
      if (state.activeTab === 'itinerary') body = renderItineraryTab();
      if (state.activeTab === 'booking') body = renderBookingTab();
      if (state.activeTab === 'list') body = renderListTab();
      if (state.activeTab === 'journal') body = renderJournalTab();
      if (state.activeTab === 'expense') body = renderExpenseTab();
      if (state.activeTab === 'members') body = renderMembersTab();

      app.innerHTML = renderHeader() + body + renderBottomNav();
    }

    render();
  </script>
</body>
</html>
