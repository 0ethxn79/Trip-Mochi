<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅伴協作行程與雲端同步測試版</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <!-- 錯誤提示橫幅（若發生未預期錯誤會顯示在這裡） -->
  <div id="fatalErrorBanner" class="hidden bg-red-600 text-white px-4 py-3 text-sm">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <span id="fatalErrorText">網頁發生執行錯誤</span>
      <button id="btnResetLocalData" type="button" class="px-3 py-1 rounded bg-white text-red-700 font-semibold text-xs shrink-0">
        清除本機快取並重載
      </button>
    </div>
  </div>

  <!-- 頂部導覽與同步狀態 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-indigo-600 text-white font-bold">旅</span>
        <div>
          <h1 class="font-bold text-lg leading-tight">旅伴協作行程・雲端測試版</h1>
          <p id="syncStatusText" class="text-xs text-slate-500">初始化中...</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="btnManualPull" type="button" class="px-3 py-1.5 text-sm rounded-lg border border-slate-300 bg-white hover:bg-slate-50">
          重新抓雲端
        </button>
        <button id="btnManualPush" type="button" class="px-3 py-1.5 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
          立即上傳雲端
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
    <!-- GAS 網址設定列 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
      <div class="flex flex-col md:flex-row md:items-end gap-3">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-slate-600 mb-1">
            Google Apps Script Web App 網址（/exec）
          </label>
          <input
            id="gasUrlInput"
            type="url"
            placeholder="https://script.google.com/macros/s/你的部署ID/exec"
            class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>
        <button id="btnSaveGasUrl" type="button" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-white hover:bg-slate-900">
          儲存網址並同步
        </button>
      </div>
    </section>

    <!-- 測試身分切換 & 輸入旅伴 Code 授權 -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 身分切換 / 註冊測試帳號 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-base">1. 測試身分切換（模擬 Google 登入）</h2>
          <span id="currentRoleBadge" class="text-xs px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 font-semibold"></span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-500 mb-1">選擇既有測試帳號</label>
            <select id="userSelect" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white"></select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">我的專屬 Code</label>
            <div class="flex items-center gap-2">
              <input id="myCodeDisplay" type="text" readonly class="w-full px-3 py-2 text-sm font-mono bg-slate-100 border border-slate-200 rounded-lg" />
              <button id="btnCopyMyCode" type="button" class="px-3 py-2 text-xs rounded-lg border border-slate-300 hover:bg-slate-50 shrink-0">
                複製
              </button>
            </div>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100">
          <p class="text-xs font-semibold text-slate-600 mb-2">新增／切換自訂測試朋友身分</p>
          <div class="flex flex-col sm:flex-row gap-2">
            <input id="newUserName" type="text" placeholder="朋友暱稱（例如：阿明）" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg" />
            <input id="newUserEmail" type="email" placeholder="email（選填）" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg" />
            <button id="btnCreateUser" type="button" class="px-4 py-2 text-sm font-medium rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 shrink-0">
              產生 Code 並登入
            </button>
          </div>
        </div>
      </div>

      <!-- 輸入旅伴 Code 取得編輯權限 -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
        <h2 class="font-bold text-base">2. 輸入旅伴 Code 取得編輯權限</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
          輸入旅伴的專屬 Code，系統會將你目前的 Code 加入該旅伴行程的編輯名單，之後你就能一起新增／修改／刪除行程項目。
        </p>

        <div class="flex flex-col sm:flex-row gap-2">
          <input
            id="redeemCodeInput"
            type="text"
            placeholder="輸入旅伴 Code，例如：ADMIN-001 或 TRV-XXXX"
            class="flex-1 px-3 py-2 text-sm font-mono uppercase border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <button id="btnRedeemCode" type="button" class="px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 shrink-0">
            解鎖編輯權限
          </button>
        </div>

        <div id="redeemFeedback" class="text-xs text-slate-600 min-h-[1.25rem]"></div>

        <div class="pt-3 border-t border-slate-100">
          <p class="text-xs font-semibold text-slate-600 mb-2">建立新行程（自動歸屬目前登入者）</p>
          <div class="flex flex-col sm:flex-row gap-2">
            <input id="newTripTitle" type="text" placeholder="行程名稱（例如：2026 沖繩 4 天 3 夜）" class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg" />
            <button id="btnCreateTrip" type="button" class="px-4 py-2 text-sm font-medium rounded-lg bg-slate-800 text-white hover:bg-slate-900 shrink-0">
              建立行程
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 主帳號專屬：查看所有使用者的 Code -->
    <section id="adminPanel" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-bold text-base text-amber-950">主帳號總覽：所有使用者與專屬 Code</h2>
          <p class="text-xs text-amber-800">僅主帳號可見，方便你管理測試朋友的 Code 與權限。</p>
        </div>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-200 text-amber-900">ADMIN ONLY</span>
      </div>
      <div class="overflow-x-auto bg-white rounded-xl border border-amber-200">
        <table class="w-full text-left text-sm">
          <thead class="bg-amber-100/70 text-amber-950 text-xs">
            <tr>
              <th class="py-2.5 px-3">暱稱</th>
              <th class="py-2.5 px-3">Email</th>
              <th class="py-2.5 px-3">專屬 Code</th>
              <th class="py-2.5 px-3">角色</th>
            </tr>
          </thead>
          <tbody id="adminUsersTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </section>

    <!-- 行程列表與編輯區 -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <!-- 左側行程清單 -->
      <div class="lg:col-span-4 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
        <h2 class="font-bold text-base">行程清單</h2>
        <div id="tripList" class="space-y-2"></div>
      </div>

      <!-- 右側選定行程詳情與項目 -->
      <div class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
        <div id="tripDetailEmpty" class="text-center py-12 text-slate-400 text-sm">
          請先建立或選擇一份行程
        </div>

        <div id="tripDetailContent" class="hidden space-y-4">
          <div class="flex flex-wrap items-start justify-between gap-3 pb-3 border-b border-slate-100">
            <div>
              <h3 id="activeTripTitle" class="font-bold text-xl"></h3>
              <p id="activeTripMeta" class="text-xs text-slate-500 mt-1"></p>
            </div>
            <span id="activeTripPermBadge" class="text-xs font-semibold px-3 py-1 rounded-full"></span>
          </div>

          <!-- 新增行程項目表單（需有編輯權限） -->
          <form id="addItemForm" class="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <input id="itemDay" type="text" placeholder="Day 1" class="sm:col-span-2 px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white" required />
            <input id="itemTime" type="text" placeholder="09:30" class="sm:col-span-2 px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white" required />
            <input id="itemTitle" type="text" placeholder="景點 / 餐廳 / 交通項目" class="sm:col-span-4 px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white" required />
            <input id="itemCost" type="number" placeholder="預算(TWD)" class="sm:col-span-2 px-3 py-2 text-sm border border-slate-300 rounded-lg bg-white" min="0" />
            <button type="submit" class="sm:col-span-2 px-3 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
              新增
            </button>
          </form>

          <!-- 行程項目列表 -->
          <div id="tripItemsList" class="space-y-2"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycby3QL_dKcVbbbBNPEGu3EBMFWQfKWMAa2AjLZ_nCh2FpCaxHCq28nZMUsT1OowEK98/exec';

    const STORAGE_KEYS = {
      GAS_URL: 'travel_sync_gas_url_v1',
      CURRENT_USER_CODE: 'travel_sync_current_user_code_v1',
      SELECTED_TRIP_ID: 'travel_sync_selected_trip_id_v1',
      LOCAL_STORE: 'travel_sync_local_store_v1'
    };

    const ADMIN_CODE = 'ADMIN-001';

    function showFatalError(msg) {
      const banner = document.getElementById('fatalErrorBanner');
      const text = document.getElementById('fatalErrorText');
      if (banner && text) {
        text.textContent = `錯誤：${msg}`;
        banner.classList.remove('hidden');
      }
    }

    window.addEventListener('error', (event) => {
      showFatalError(event.message || '腳本執行錯誤');
    });

    window.addEventListener('unhandledrejection', (event) => {
      const reason = event.reason && event.reason.message ? event.reason.message : String(event.reason || '非同步錯誤');
      showFatalError(reason);
    });

    document.getElementById('btnResetLocalData').addEventListener('click', () => {
      Object.values(STORAGE_KEYS).forEach((k) => localStorage.removeItem(k));
      location.reload();
    });

    function createInitialStore() {
      return {
        users: {
          [ADMIN_CODE]: {
            code: ADMIN_CODE,
            name: '主帳號 (Yuma)',
            email: 'admin@example.com',
            role: 'admin'
          },
          'TRV-友A01': {
            code: 'TRV-友A01',
            name: '測試旅伴 A',
            email: 'friendA@example.com',
            role: 'user'
          },
          'TRV-友B02': {
            code: 'TRV-友B02',
            name: '測試旅伴 B',
            email: 'friendB@example.com',
            role: 'user'
          }
        },
        trips: {
          'trip_demo_01': {
            id: 'trip_demo_01',
            title: '測試共編行程：中壢 → 關西／廣島',
            ownerCode: ADMIN_CODE,
            editors: [ADMIN_CODE],
            items: [
              {
                id: 'item_1',
                day: 'Day 1',
                time: '14:00',
                title: '抵達機場並領取交通票券',
                cost: 1200,
                addedBy: ADMIN_CODE
              }
            ],
            updatedAt: new Date().toISOString()
          }
        },
        updatedAt: new Date().toISOString()
      };
    }

    function loadLocalStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.LOCAL_STORE);
        const fallback = createInitialStore();
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return fallback;
        const users = parsed.users && typeof parsed.users === 'object' ? parsed.users : fallback.users;
        if (!users[ADMIN_CODE]) {
          users[ADMIN_CODE] = fallback.users[ADMIN_CODE];
        }
        const trips = parsed.trips && typeof parsed.trips === 'object' ? parsed.trips : fallback.trips;
        return {
          users,
          trips,
          updatedAt: parsed.updatedAt || fallback.updatedAt
        };
      } catch {
        return createInitialStore();
      }
    }

    let state = {
      gasUrl: localStorage.getItem(STORAGE_KEYS.GAS_URL) || DEFAULT_GAS_URL,
      currentUserCode: localStorage.getItem(STORAGE_KEYS.CURRENT_USER_CODE) || ADMIN_CODE,
      selectedTripId: localStorage.getItem(STORAGE_KEYS.SELECTED_TRIP_ID) || 'trip_demo_01',
      store: loadLocalStore(),
      syncTimer: null
    };

    function saveLocalStore() {
      try {
        state.store.updatedAt = new Date().toISOString();
        localStorage.setItem(STORAGE_KEYS.LOCAL_STORE, JSON.stringify(state.store));
        localStorage.setItem(STORAGE_KEYS.CURRENT_USER_CODE, state.currentUserCode);
        if (state.selectedTripId) {
          localStorage.setItem(STORAGE_KEYS.SELECTED_TRIP_ID, state.selectedTripId);
        }
      } catch (err) {
        showFatalError(`本機儲存失敗：${err.message}`);
      }
    }

    function setSyncStatus(text, isError = false) {
      const el = document.getElementById('syncStatusText');
      if (!el) return;
      el.textContent = text;
      el.className = isError ? 'text-xs text-red-600 font-medium' : 'text-xs text-slate-500';
    }

    function generateUniqueCode(prefix = 'TRV') {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = '';
      do {
        let rand = '';
        for (let i = 0; i < 5; i++) {
          rand += chars[Math.floor(Math.random() * chars.length)];
        }
        code = `${prefix}-${rand}`;
      } while (state.store.users[code]);
      return code;
    }

    function getCurrentUser() {
      if (!state.store.users[state.currentUserCode]) {
        state.currentUserCode = ADMIN_CODE;
      }
      return state.store.users[state.currentUserCode];
    }

    function canEditTrip(trip, user) {
      if (!trip || !user) return false;
      if (user.role === 'admin' || user.code === ADMIN_CODE) return true;
      if (trip.ownerCode === user.code) return true;
      return Array.isArray(trip.editors) && trip.editors.includes(user.code);
    }

    async function pullFromCloud(showAlertOnFail = false) {
      if (!state.gasUrl) {
        setSyncStatus('未設定 Apps Script 網址（目前僅本機儲存）');
        return;
      }
      setSyncStatus('正在從 Google 試算表抓取最新資料...');
      try {
        const res = await fetch(`${state.gasUrl}?t=${Date.now()}`, { method: 'GET' });
        const rawText = await res.text();
        let json;
        try {
          json = JSON.parse(rawText);
        } catch {
          throw new Error('雲端回傳非 JSON（請確認 Apps Script 已部署且開放「所有人」存取）');
        }
        if (!json.ok || !json.data) {
          throw new Error(json.error || '雲端回傳格式異常');
        }

        const fallback = createInitialStore();
        const cloudUsers = json.data.users && typeof json.data.users === 'object' ? json.data.users : {};
        const cloudTrips = json.data.trips && typeof json.data.trips === 'object' ? json.data.trips : {};

        if (Object.keys(cloudUsers).length > 0) {
          state.store.users = { ...fallback.users, ...cloudUsers };
        }
        if (Object.keys(cloudTrips).length > 0) {
          state.store.trips = cloudTrips;
        }
        if (!state.store.users[state.currentUserCode]) {
          state.currentUserCode = ADMIN_CODE;
        }
        if (!state.store.trips[state.selectedTripId]) {
          const ids = Object.keys(state.store.trips);
          state.selectedTripId = ids[0] || '';
        }

        saveLocalStore();
        renderAll();
        setSyncStatus(`已同步雲端（${new Date().toLocaleTimeString('zh-TW')}）`);
      } catch (err) {
        setSyncStatus(`雲端讀取失敗：${err.message}`, true);
        if (showAlertOnFail) alert(`雲端讀取失敗：${err.message}`);
      }
    }

    async function pushToCloud(showAlertOnFail = false) {
      saveLocalStore();
      if (!state.gasUrl) {
        setSyncStatus('已存本機（尚未設定 Apps Script 網址）');
        return;
      }
      setSyncStatus('正在上傳資料到 Google 試算表...');
      try {
        const res = await fetch(state.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            users: state.store.users,
            trips: state.store.trips
          })
        });
        const rawText = await res.text();
        let json;
        try {
          json = JSON.parse(rawText);
        } catch {
          throw new Error('上傳回傳非 JSON（請確認 Apps Script 部署權限為「所有人」）');
        }
        if (!json.ok) {
          throw new Error(json.error || '上傳失敗');
        }
        setSyncStatus(`已自動上傳雲端（${new Date().toLocaleTimeString('zh-TW')}）`);
      } catch (err) {
        setSyncStatus(`雲端上傳失敗：${err.message}`, true);
        if (showAlertOnFail) alert(`雲端上傳失敗：${err.message}`);
      }
    }

    function scheduleCloudSync() {
      saveLocalStore();
      renderAll();
      clearTimeout(state.syncTimer);
      state.syncTimer = setTimeout(() => {
        pushToCloud(false);
      }, 600);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderAll() {
      try {
        const user = getCurrentUser();
        const isAdmin = user.role === 'admin' || user.code === ADMIN_CODE;

        const roleBadge = document.getElementById('currentRoleBadge');
        roleBadge.textContent = isAdmin ? '主帳號 ADMIN' : '一般旅伴';
        roleBadge.className = isAdmin
          ? 'text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold'
          : 'text-xs px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700 font-semibold';

        document.getElementById('myCodeDisplay').value = user.code;

        const userSelect = document.getElementById('userSelect');
        userSelect.innerHTML = '';
        Object.values(state.store.users).forEach((u) => {
          if (!u || !u.code) return;
          const opt = document.createElement('option');
          opt.value = u.code;
          opt.textContent = `${u.name || u.code} (${u.code})`;
          opt.selected = u.code === user.code;
          userSelect.appendChild(opt);
        });

        const adminPanel = document.getElementById('adminPanel');
        const adminTbody = document.getElementById('adminUsersTableBody');
        if (isAdmin) {
          adminPanel.classList.remove('hidden');
          adminTbody.innerHTML = Object.values(state.store.users)
            .filter((u) => u && u.code)
            .map((u) => `
              <tr>
                <td class="py-2 px-3 font-medium">${escapeHtml(u.name || '-')}</td>
                <td class="py-2 px-3 text-slate-600">${escapeHtml(u.email || '-')}</td>
                <td class="py-2 px-3 font-mono text-indigo-700">${escapeHtml(u.code)}</td>
                <td class="py-2 px-3">${u.role === 'admin' ? '主帳號' : '旅伴'}</td>
              </tr>
            `)
            .join('');
        } else {
          adminPanel.classList.add('hidden');
        }

        const tripListEl = document.getElementById('tripList');
        const trips = Object.values(state.store.trips).filter((t) => t && t.id);
        if (trips.length === 0) {
          tripListEl.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">目前尚無行程</p>';
        } else {
          tripListEl.innerHTML = trips
            .map((t) => {
              const active = t.id === state.selectedTripId;
              const editable = canEditTrip(t, user);
              return `
                <button
                  type="button"
                  data-trip-id="${escapeHtml(t.id)}"
                  class="trip-select-btn w-full text-left p-3 rounded-xl border transition ${
                    active
                      ? 'border-indigo-500 bg-indigo-50/70'
                      : 'border-slate-200 hover:bg-slate-50'
                  }"
                >
                  <div class="flex items-center justify-between gap-2">
                    <span class="font-semibold text-sm truncate">${escapeHtml(t.title || '未命名行程')}</span>
                    <span class="text-[11px] px-2 py-0.5 rounded-full shrink-0 ${
                      editable ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'
                    }">${editable ? '可編輯' : '唯讀'}</span>
                  </div>
                  <p class="text-xs text-slate-500 mt-1 font-mono">建立者 Code：${escapeHtml(t.ownerCode || '-')}</p>
                </button>
              `;
            })
            .join('');
        }

        document.querySelectorAll('.trip-select-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selectedTripId = btn.dataset.tripId;
            saveLocalStore();
            renderAll();
          });
        });

        const activeTrip = state.store.trips[state.selectedTripId];
        const emptyEl = document.getElementById('tripDetailEmpty');
        const detailEl = document.getElementById('tripDetailContent');

        if (!activeTrip) {
          emptyEl.classList.remove('hidden');
          detailEl.classList.add('hidden');
          return;
        }

        emptyEl.classList.add('hidden');
        detailEl.classList.remove('hidden');

        const editable = canEditTrip(activeTrip, user);
        document.getElementById('activeTripTitle').textContent = activeTrip.title || '未命名行程';
        document.getElementById('activeTripMeta').textContent =
          `建立者：${activeTrip.ownerCode || '-'} ｜ 已授權編輯 Code：${(Array.isArray(activeTrip.editors) ? activeTrip.editors : []).join(', ')}`;

        const permBadge = document.getElementById('activeTripPermBadge');
        permBadge.textContent = editable ? '已取得編輯權限' : '僅唯讀（請輸入旅伴 Code 解鎖）';
        permBadge.className = editable
          ? 'text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700'
          : 'text-xs font-semibold px-3 py-1 rounded-full bg-slate-200 text-slate-600';

        const form = document.getElementById('addItemForm');
        Array.from(form.elements).forEach((el) => {
          el.disabled = !editable;
        });
        form.classList.toggle('opacity-50', !editable);

        const itemsListEl = document.getElementById('tripItemsList');
        const items = Array.isArray(activeTrip.items) ? activeTrip.items : [];
        if (items.length === 0) {
          itemsListEl.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">這份行程還沒有項目</p>';
        } else {
          itemsListEl.innerHTML = items
            .map((item) => `
              <div class="flex items-center justify-between gap-3 p-3 rounded-xl border border-slate-200 bg-white">
                <div>
                  <div class="flex items-center gap-2 text-xs text-indigo-600 font-semibold">
                    <span>${escapeHtml(item.day || '')}</span>
                    <span>${escapeHtml(item.time || '')}</span>
                    <span class="text-slate-400 font-normal">by ${escapeHtml(item.addedBy || '-')}</span>
                  </div>
                  <p class="font-medium text-sm mt-0.5">${escapeHtml(item.title || '')}</p>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-semibold text-slate-700">NT$ ${Number(item.cost || 0).toLocaleString()}</span>
                  ${
                    editable
                      ? `<button type="button" data-item-id="${escapeHtml(item.id)}" class="delete-item-btn text-xs text-red-600 hover:underline">刪除</button>`
                      : ''
                  }
                </div>
              </div>
            `)
            .join('');
        }

        document.querySelectorAll('.delete-item-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (!canEditTrip(activeTrip, user)) return;
            activeTrip.items = (activeTrip.items || []).filter((i) => i.id !== btn.dataset.itemId);
            activeTrip.updatedAt = new Date().toISOString();
            scheduleCloudSync();
          });
        });
      } catch (err) {
        showFatalError(`畫面渲染失敗：${err.message}`);
      }
    }

    document.getElementById('gasUrlInput').value = state.gasUrl;

    document.getElementById('btnSaveGasUrl').addEventListener('click', () => {
      state.gasUrl = document.getElementById('gasUrlInput').value.trim();
      localStorage.setItem(STORAGE_KEYS.GAS_URL, state.gasUrl);
      pullFromCloud(true);
    });

    document.getElementById('btnManualPull').addEventListener('click', () => pullFromCloud(true));
    document.getElementById('btnManualPush').addEventListener('click', () => pushToCloud(true));

    document.getElementById('userSelect').addEventListener('change', (e) => {
      state.currentUserCode = e.target.value;
      saveLocalStore();
      renderAll();
    });

    document.getElementById('btnCopyMyCode').addEventListener('click', () => {
      const code = document.getElementById('myCodeDisplay').value;
      navigator.clipboard?.writeText(code);
      setSyncStatus(`已複製 Code：${code}`);
    });

    document.getElementById('btnCreateUser').addEventListener('click', () => {
      const nameInput = document.getElementById('newUserName');
      const emailInput = document.getElementById('newUserEmail');
      const name = nameInput.value.trim();
      if (!name) {
        alert('請先輸入朋友暱稱');
        return;
      }
      const code = generateUniqueCode('TRV');
      state.store.users[code] = {
        code,
        name,
        email: emailInput.value.trim(),
        role: 'user'
      };
      state.currentUserCode = code;
      nameInput.value = '';
      emailInput.value = '';
      scheduleCloudSync();
    });

    document.getElementById('btnRedeemCode').addEventListener('click', () => {
      const input = document.getElementById('redeemCodeInput');
      const feedback = document.getElementById('redeemFeedback');
      const targetCode = input.value.trim().toUpperCase();
      const user = getCurrentUser();

      if (!targetCode) {
        feedback.textContent = '請輸入旅伴的 Code';
        feedback.className = 'text-xs text-red-600';
        return;
      }

      const matchingTrips = Object.values(state.store.trips).filter(
        (t) => t && String(t.ownerCode || '').toUpperCase() === targetCode
      );

      if (matchingTrips.length === 0) {
        feedback.textContent = `找不到由 ${targetCode} 建立的行程，請確認 Code 是否正確或已同步雲端。`;
        feedback.className = 'text-xs text-red-600';
        return;
      }

      matchingTrips.forEach((t) => {
        t.editors = Array.from(new Set([...(t.editors || []), user.code]));
        t.updatedAt = new Date().toISOString();
      });

      state.selectedTripId = matchingTrips[0].id;
      input.value = '';
      feedback.textContent = `已成功取得「${matchingTrips[0].title}」等 ${matchingTrips.length} 份行程的編輯權限！`;
      feedback.className = 'text-xs text-emerald-700 font-medium';
      scheduleCloudSync();
    });

    document.getElementById('btnCreateTrip').addEventListener('click', () => {
      const titleInput = document.getElementById('newTripTitle');
      const title = titleInput.value.trim();
      if (!title) {
        alert('請輸入行程名稱');
        return;
      }
      const user = getCurrentUser();
      const id = `trip_${Date.now()}`;
      state.store.trips[id] = {
        id,
        title,
        ownerCode: user.code,
        editors: [user.code],
        items: [],
        updatedAt: new Date().toISOString()
      };
      state.selectedTripId = id;
      titleInput.value = '';
      scheduleCloudSync();
    });

    document.getElementById('addItemForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = getCurrentUser();
      const trip = state.store.trips[state.selectedTripId];
      if (!canEditTrip(trip, user)) {
        alert('你目前沒有這份行程的編輯權限');
        return;
      }

      const day = document.getElementById('itemDay').value.trim();
      const time = document.getElementById('itemTime').value.trim();
      const title = document.getElementById('itemTitle').value.trim();
      const cost = Number(document.getElementById('itemCost').value || 0);

      trip.items = trip.items || [];
      trip.items.push({
        id: `item_${Date.now()}`,
        day,
        time,
        title,
        cost,
        addedBy: user.code
      });
      trip.updatedAt = new Date().toISOString();

      e.target.reset();
      scheduleCloudSync();
    });

    renderAll();
    if (state.gasUrl) {
      pullFromCloud(false);
    }
  </script>
</body>
</html>
